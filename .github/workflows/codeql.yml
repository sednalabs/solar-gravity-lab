name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  schedule:
    - cron: "31 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-advanced-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            config_file: ./.github/codeql/codeql-actions-security.yml
            pr_config_file: ./.github/codeql/codeql-actions-security.yml
          - language: c-cpp
            build-mode: none
            config_file: ./.github/codeql/codeql-cpp-claim-enforcement.yml
            pr_config_file: ./.github/codeql/codeql-config.yml
          - language: java-kotlin
            build-mode: manual
            config_file: ./.github/codeql/codeql-java-kotlin-claim-enforcement.yml
            pr_config_file: ./.github/codeql/codeql-config.yml
          - language: python
            build-mode: none
            config_file: ./.github/codeql/codeql-python-security.yml
            pr_config_file: ./.github/codeql/codeql-python-security.yml
          - language: rust
            build-mode: none
            config_file: ./.github/codeql/codeql-rust-claim-enforcement.yml
            pr_config_file: ./.github/codeql/codeql-config.yml
    env:
      ANDROID_PLATFORM_PACKAGE: "platforms;android-36"
      ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;36.0.0"
      ANDROID_NDK_VERSION: "27.3.13750724"
      ANDROID_NDK_PACKAGE: "ndk;27.3.13750724"
      ANDROID_SDK_ROOT_DEFAULT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Restore trusted CodeQL policy for PRs
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-codeql-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Apply trusted CodeQL policy for PRs
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/codeql
          cp -R .trusted-codeql-policy/.github/codeql .github/codeql

      - name: Install Rust toolchains for CodeQL
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          toolchains = {}
          for path in sorted(Path(".").glob("**/rust-toolchain*")):
              text = path.read_text(encoding="utf-8").strip()
              if text.startswith("["):
                  data = tomllib.loads(text)
                  toolchain = data["toolchain"]
                  channel = toolchain["channel"]
                  components = set(toolchain.get("components", []))
              else:
                  channel = text
                  components = set()
              components.add("rust-src")
              toolchains.setdefault(channel, set()).update(components)

          if not toolchains:
              toolchains["stable"] = {"rust-src"}

          for channel, components in sorted(toolchains.items()):
              command = [
                  "rustup",
                  "toolchain",
                  "install",
                  channel,
                  "--profile",
                  "minimal",
                  "--no-self-update",
              ]
              for component in sorted(components):
                  command.extend(["--component", component])
              subprocess.run(command, check=True)
          PY

      - name: Restore Rust dependency cache for CodeQL
        if: ${{ matrix.language == 'rust' }}
        id: cache_codeql_rust_cargo_home_restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: codeql-rust-cargo-home-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/rust-toolchain*') }}
          restore-keys: |
            codeql-rust-cargo-home-v1-${{ runner.os }}-

      - name: Prefetch Rust dependencies for CodeQL
        if: ${{ matrix.language == 'rust' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path infra/gradle-cache-service/Cargo.toml

      - name: Set up Java for CodeQL Kotlin extraction
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle for CodeQL Kotlin extraction
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
          add-job-summary: on-failure
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Prepare Android SDK for CodeQL Kotlin extraction
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android build inputs for CodeQL Kotlin extraction
        if: ${{ matrix.language == 'java-kotlin' }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ github.event_name == 'pull_request' && matrix.pr_config_file || matrix.config_file }}
          dependency-caching: ${{ github.event_name == 'pull_request' && 'restore' || 'full' }}

      - name: Build Java and Kotlin sources for CodeQL
        if: ${{ matrix.language == 'java-kotlin' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p clients/android --no-daemon --rerun-tasks --no-build-cache \
            -Dorg.gradle.caching=false \
            :app:compileDebugKotlin \
            :app:compileDebugUnitTestKotlin \
            :app:compileDebugAndroidTestKotlin \
            :feature-lab:compileDebugKotlin \
            :feature-lab:compileDebugUnitTestKotlin \
            :render-core:compileKotlin \
            :render-core:compileTestKotlin \
            :core-math:compileKotlin \
            :core-math:compileTestKotlin \
            :core-model:compileKotlin \
            :core-model:compileTestKotlin \
            :core-simulation:compileKotlin \
            :core-simulation:compileTestKotlin \
            -Psolarlab.stageFirstRuntimeMirror=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Save Rust dependency cache for CodeQL
        if: ${{ always() && !cancelled() && matrix.language == 'rust' && steps.cache_codeql_rust_cargo_home_restore.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: codeql-rust-cargo-home-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/rust-toolchain*') }}

  results:
    name: CodeQL required gate
    needs:
      - analyze
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Report CodeQL timing
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### CodeQL timing"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[]
                | select(.name | test("^(Analyze \\(|CodeQL required gate)"))
                | "- \(.name): \(.status)/\(.conclusion // "") started=\(.started_at) completed=\(.completed_at // "")"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize CodeQL result
        shell: bash
        run: |
          set -euo pipefail
          echo "analyze  : ${{ needs.analyze.result }}"

          if [[ '${{ needs.analyze.result }}' != 'success' ]]; then
            echo 'CodeQL analysis failed.'
            exit 1
          fi
