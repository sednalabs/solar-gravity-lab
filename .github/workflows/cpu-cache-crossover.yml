name: CPU cache crossover

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cpu-cache-crossover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-arm-crossover:
    name: Paired native Arm cache crossover
    if: github.head_ref == 'perf/cpu-cache-topology-20261118'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Validate measurement comparison contracts
        run: python3 .github/scripts/test_compare_hardware_throughput.py
      - name: Measure segment-length crossover against immutable base
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/run_paired_hardware_throughput.sh "$BASELINE_SHA"
      - name: Publish segment comparisons
        if: always()
        run: |
          if [[ -f dist/hardware-throughput/comparison.md ]]; then
            cat dist/hardware-throughput/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for cohort in short-segment segment-2 segment-4 segment-8 segment-16 segment-32; do
            report="dist/hardware-throughput/$cohort/comparison.md"
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cpu-cache-crossover-${{ github.run_id }}
          path: dist/hardware-throughput
