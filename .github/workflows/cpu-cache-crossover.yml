name: CPU dense confirmation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cpu-dense-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-arm-dense:
    name: Confirm dense parallel timing
    if: github.head_ref == 'perf/cpu-cache-topology-20261118'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: protocol
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dc5b1084cadf97a1f152147a0062704c3ca7dc40
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Validate measurement protocol
        run: |
          python3 -m py_compile protocol/.github/scripts/run_dense_confirmation.py
          python3 protocol/.github/scripts/test_compare_hardware_throughput.py
      - name: Measure frozen dense workloads
        run: python3 protocol/.github/scripts/run_dense_confirmation.py --candidate-dir candidate --output dist/cpu-dense-confirmation
      - name: Publish dense confirmation summary
        if: always()
        run: |
          if [[ -f dist/cpu-dense-confirmation/confirmation.md ]]; then
            cat dist/cpu-dense-confirmation/confirmation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cpu-dense-confirmation-${{ github.run_id }}
          path: dist/cpu-dense-confirmation
