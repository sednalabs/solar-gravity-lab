name: Probe mass repair workbench
on:
  push:
    branches: [work/probe-mass-20261117]
permissions:
  contents: write
concurrency:
  group: probe-mass-workbench
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Complete command presentation on retained product source
        run: |
          git checkout --detach f0f3cd61a4b46bca7dcd91e642d23cf4aeb0caaa
          python3 - <<'PY'
          from pathlib import Path
          p=Path('clients/android/app/src/main/kotlin/com/sednalabs/solarlab/runtime/BridgeBackedRuntimeFacade.kt')
          s=p.read_text()
          old='    is RuntimeCommand.SetBodyKinematics -> "Update kinematics for ${bodyId}"'
          assert s.count(old)==1
          s=s.replace(old,old+'\n    is RuntimeCommand.SetBodyProperties -> "Update mass and motion for ${bodyId}"')
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'Solar Gravity Lab repair workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'android: present atomic body-property commands in runtime feedback'
          git push origin "HEAD:refs/heads/candidate/probe-mass-final-${GITHUB_RUN_ID}"
          echo "Product candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test authoritative physics and native presentation contracts
        run: |
          cargo test -p solarlab-runtime -p solarlab-ffi -p solarlab-physics
          g++ -std=c++20 -Wall -Wextra -Werror render/android-vulkan/src/test/cpp/SolarLabPresentationTest.cpp -o /tmp/presentation-test
          /tmp/presentation-test
          python3 render/android-vulkan/src/test/python/test_compute_contract.py
          python3 render/android-vulkan/src/test/python/test_surface_frame.py
