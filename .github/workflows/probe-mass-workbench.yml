name: Probe mass repair workbench
on:
  push:
    branches: [work/probe-mass-20261117]
permissions:
  contents: write
concurrency:
  group: probe-mass-workbench
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repair retained preview identity and native menu interaction
        run: |
          git checkout --detach 342b75ac05cf446b18673fbe1df48be1cb216160
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); source=p.read_text()
              assert source.count(old)==1, (path, source.count(old), old[:90])
              p.write_text(source.replace(old,new))
          root='clients/android/app/src/'
          authoring=root+'main/kotlin/com/sednalabs/solarlab/runtime/ProbeAuthoring.kt'
          replace(authoring, '/** Undo returns to this epoch on a new branch, preserving the abandoned future. */', '''/** A retained forecast is usable only for the exact paused world it predicted. */
          internal fun ProbePreviewResult.isCurrentFor(
              currentCandidate: RuntimeBodyState?,
              currentSessionHandle: Long?,
              snapshot: SnapshotPresentation?,
          ): Boolean = currentCandidate != null && candidate == currentCandidate &&
              sessionHandle == currentSessionHandle && snapshot != null && snapshot.paused &&
              baselineRevision == snapshot.revision &&
              epochSeconds.toBits() == snapshot.epochSeconds.toBits()
          
          /** Undo returns to this epoch on a new branch, preserving the abandoned future. */''')
          stage=root+'main/kotlin/com/sednalabs/solarlab/StageFirstRuntimeExperience.kt'
          replace(stage,'import com.sednalabs.solarlab.runtime.RuntimeFacade','import com.sednalabs.solarlab.runtime.RuntimeFacade\nimport com.sednalabs.solarlab.runtime.isCurrentFor')
          replace(stage,'            if (labInteraction.committing || draft.candidate() != preview.candidate) return', '''            if (labInteraction.committing || !preview.isCurrentFor(
                          draft.candidate(), runtimeFacade.uiState.value.sessionHandle,
                          runtimeFacade.uiState.value.snapshot)) return''')
          replace(stage,'''        LaunchedEffect(labInteraction.draftVersion) {
                      val version = labInteraction.draftVersion
                      val draft = labInteraction.draft ?: return@LaunchedEffect
                      val candidate = draft.candidate() ?: return@LaunchedEffect
                      if (labInteraction.preview?.candidate == candidate && labInteraction.preview?.sessionHandle == runtimeSessionHandle) return@LaunchedEffect
                      labInteraction.previewing = true''', '''        LaunchedEffect(labInteraction.draftVersion, runtimeSessionHandle, uiState.snapshot?.revision) {
                      val version = labInteraction.draftVersion
                      val draft = labInteraction.draft ?: return@LaunchedEffect
                      val candidate = draft.candidate() ?: return@LaunchedEffect
                      if (labInteraction.committing || uiState.snapshot?.paused != true) return@LaunchedEffect
                      if (labInteraction.preview?.isCurrentFor(candidate, runtimeSessionHandle, uiState.snapshot) == true) return@LaunchedEffect
                      // Camera commands during recreation also change native revision.
                      // Never offer Create against an obsolete retained preview.
                      labInteraction.preview = null
                      labInteraction.previewing = true''')
          replace(stage,'''                if (labInteraction.draftVersion == version && result.sessionHandle == runtimeFacade.uiState.value.sessionHandle) {
                              labInteraction.preview = result''', '''                if (labInteraction.draftVersion == version && result.isCurrentFor(candidate,
                                  runtimeFacade.uiState.value.sessionHandle, runtimeFacade.uiState.value.snapshot)) {
                              labInteraction.preview = result''')
          replace(stage,'''                                    syncObserver(selectedBodyId, modeToRestore)''', '''                                    // Restoring a draft's camera is presentation-only. Reissuing
                                              // native observer commands invalidates the retained forecast.
                                              if (labInteraction.draft == null) syncObserver(selectedBodyId, modeToRestore)''')
          replace(stage,'                        canCreate = preview != null && preview.candidate == draft.candidate() && !labInteraction.previewing,',
                  '                        canCreate = preview?.isCurrentFor(draft.candidate(), runtimeSessionHandle, uiState.snapshot) == true && !labInteraction.previewing,')
          test=root+'test/kotlin/com/sednalabs/solarlab/runtime/ProbeAuthoringTest.kt'
          replace(test,'    @Test\n    fun bodyAndPreviewDtoRetainF64ValuesAndRejectMalformedNativePayloads() {', '''    @Test
              fun previewIdentityRejectsChangedWorldAndPreservesOnlyTheExactPausedDraft() {
                  val preview = native().toPreview(42, candidate, "earth")
                  val snapshot = SnapshotPresentation("lab.earth-moon", "main", 3, 0.0, true, 1.0,
                      observerModeLabel = "Free", revision = 7)
                  assertTrue(preview.isCurrentFor(candidate, 42, snapshot))
                  assertTrue(!preview.isCurrentFor(candidate, 43, snapshot))
                  assertTrue(!preview.isCurrentFor(candidate, 42, snapshot.copy(revision = 8)))
                  assertTrue(!preview.isCurrentFor(candidate, 42, snapshot.copy(epochSeconds = 1.0)))
                  assertTrue(!preview.isCurrentFor(candidate, 42, snapshot.copy(paused = false)))
                  assertTrue(!preview.isCurrentFor(candidate.copy(massKg = 2000.0), 42, snapshot))
                  assertTrue(!preview.isCurrentFor(candidate, 42, null))
                  assertTrue(!preview.isCurrentFor(null, 42, snapshot))
              }
          
              @Test
              fun bodyAndPreviewDtoRetainF64ValuesAndRejectMalformedNativePayloads() {''')
          chrome=root+'main/kotlin/com/sednalabs/solarlab/EarthMoonLabChrome.kt'
          replace(chrome,'    const val TOOLS_PANEL = "lab.tools"','    const val TOOLS_PANEL = "lab.tools"\n    const val TOOLS_CLOSE = "lab.tools.close"')
          replace(chrome,'            Text("Your laboratory", style = MaterialTheme.typography.titleLarge)', '''            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Text("Your laboratory", Modifier.weight(1f), style = MaterialTheme.typography.titleLarge)
                          LabTextAction("Done", actions.toggleTools, tag = LabTags.TOOLS_CLOSE,
                              description = "Close laboratory tools")
                      }''')
          camera=root+'androidTest/kotlin/com/sednalabs/solarlab/LabCameraMotionInstrumentationTest.kt'
          replace(camera,'import androidx.test.espresso.Espresso.pressBack\n','')
          replace(camera,'        pressBack()','        composeRule.onNodeWithTag(LabTags.TOOLS_CLOSE).performScrollToIfPossible().performClick()')
          mass=root+'androidTest/kotlin/com/sednalabs/solarlab/LabProbeMassInstrumentationTest.kt'
          replace(mass,'import kotlinx.coroutines.runBlocking','import kotlinx.coroutines.runBlocking\nimport androidx.lifecycle.ViewModelProvider')
          replace(mass,'        composeRule.waitUntil(20_000) { facade.uiState.value.snapshot?.bodyCount == count + 1 && facade.lastProbeCommit.value != null }', '''        fun placementError() = ViewModelProvider(composeRule.activity)[LabInteractionViewModel::class.java].state.error
                  composeRule.waitUntil(20_000) {
                      (facade.uiState.value.snapshot?.bodyCount == count + 1 && facade.lastProbeCommit.value != null) || placementError() != null
                  }
                  if (placementError() != null) capture("placement-rejected.png")
                  assertNull("Native placement must accept the recreated mass preview", placementError())
                  assertEquals(count + 1, facade.uiState.value.snapshot!!.bodyCount)''')
          doc=Path('docs/repair-checkpoint-20261117.md')
          doc.write_text(doc.read_text()+'''
          
          A second native-diagnostics pass found draft creation after Activity recreation
          could offer a forecast from an older command revision. Forecast reuse and
          Create now require matching candidate, native session, revision, paused state
          and exact epoch. Restoration of a draft camera no longer reissues unrelated
          observer commands. Native commit's stale-preview rejection is unchanged.
          Unit cases cover every identity component and the native recreation journey
          still requires successful actual creation. Rejection now captures its error.
          
          Laboratory tools now have an explicit accessible Done action. Native compute
          qualification uses that ordinary control instead of an injected Android Back
          event that failed on the hosted system. GPU pixel, readback, resize and resource
          reuse assertions are unchanged.
          ''')
          PY
          git diff --check
          git config user.name 'Solar Gravity Lab repair workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'lab: retain only current probe previews and expose tools dismissal'
          git push origin "HEAD:refs/heads/candidate/native-repair-${GITHUB_RUN_ID}"
          echo "Product candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test authoritative physics and presentation contracts
        run: |
          cargo test -p solarlab-runtime -p solarlab-ffi -p solarlab-physics
          g++ -std=c++20 -Wall -Wextra -Werror render/android-vulkan/src/test/cpp/SolarLabPresentationTest.cpp -o /tmp/presentation-test
          /tmp/presentation-test
          python3 render/android-vulkan/src/test/python/test_compute_contract.py
          python3 render/android-vulkan/src/test/python/test_surface_frame.py
