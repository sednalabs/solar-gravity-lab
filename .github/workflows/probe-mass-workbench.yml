name: Probe mass repair workbench
on:
  push:
    branches: [work/probe-mass-20261117]
permissions:
  contents: write
concurrency:
  group: probe-mass-workbench
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed follow-up to product source
        if: ${{ hashFiles('.github/probe-mass-followup.py') != '' }}
        run: |
          cp .github/probe-mass-followup.py "$RUNNER_TEMP/probe-mass-followup.py"
          git checkout --detach 52587f709091435b5f38331987e775e654193678
          python3 "$RUNNER_TEMP/probe-mass-followup.py"
          git diff --check
          git config user.name 'Solar Gravity Lab repair workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'lab: qualify mass edits and improve distant tracer visibility'
          git push origin "HEAD:refs/heads/candidate/probe-mass-refine-${GITHUB_RUN_ID}"
          echo "Product candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test authoritative physics and native presentation contracts
        if: ${{ hashFiles('engine/runtime/src/body_properties.rs') != '' }}
        run: |
          cargo test -p solarlab-runtime -p solarlab-ffi -p solarlab-physics
          g++ -std=c++20 -Wall -Wextra -Werror render/android-vulkan/src/test/cpp/SolarLabPresentationTest.cpp -o /tmp/presentation-test
          /tmp/presentation-test
          python3 render/android-vulkan/src/test/python/test_compute_contract.py
          python3 render/android-vulkan/src/test/python/test_surface_frame.py
