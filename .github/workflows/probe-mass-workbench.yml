name: Probe mass repair workbench
on:
  push:
    branches: [work/probe-mass-20261117]
permissions:
  contents: write
concurrency:
  group: probe-mass-workbench
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Correct the borrowed-inspection fixture without changing production semantics
        run: |
          git checkout --detach ab86070c31b3ce1cf635f1a957d6bf9ad027b3b2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/runtime/src/body_properties.rs')
          s=p.read_text()
          assert s.count('body_by_id("probe")')==3
          assert s.count('body.body_id.0 == "probe"')==1
          s=s.replace('body_by_id("probe")','body_by_id("mass-probe")')
          s=s.replace('body.body_id.0 == "probe"','body.body_id.0 == "mass-probe"')
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'Solar Gravity Lab repair workbench'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/runtime/src/body_properties.rs
          git commit -m 'test: inspect the actual mass-probe fixture'
          git push origin "HEAD:refs/heads/candidate/native-repair-${GITHUB_RUN_ID}"
          echo "Product candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test actual runtime and presentation contracts
        run: |
          cargo test -p solarlab-runtime -p solarlab-ffi -p solarlab-physics
          g++ -std=c++20 -Wall -Wextra -Werror render/android-vulkan/src/test/cpp/SolarLabPresentationTest.cpp -o /tmp/presentation-test
          /tmp/presentation-test
          python3 render/android-vulkan/src/test/python/test_compute_contract.py
          python3 render/android-vulkan/src/test/python/test_surface_frame.py
