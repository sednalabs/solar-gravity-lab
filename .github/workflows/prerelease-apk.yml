name: prerelease-apk

on:
  push:
    branches:
      - release/**
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-sanity.yml"
      - ".github/scripts/check_markdown_links.py"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: false
        type: string
      version_name:
        description: Optional versionName override (for example 0.1.0-alpha.11 or 0.1.0)
        required: false
        type: string
      version_code:
        description: Optional versionCode override
        required: false
        type: string
      release_channel:
        description: Release channel metadata override
        required: false
        default: auto
        type: choice
        options:
          - auto
          - prerelease
          - stable
      build_variant:
        description: Android build variant to package
        required: false
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
      publish_release:
        description: Publish or update the GitHub Release page from this run
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-prerelease-apk:
    name: Build internal dev preview APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}

      - name: Resolve checkout metadata
        id: git_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install build toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2

      - name: Assemble prerelease APK
        env:
          SOLARLAB_VERSION_NAME: ${{ inputs.version_name }}
          SOLARLAB_VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          build_variant="${{ inputs.build_variant != '' && inputs.build_variant || 'prerelease' }}"
          ./gradlew -p clients/android --no-daemon ":app:assemble${build_variant^}"

      - name: Derive artifact metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("clients/android/app/build/outputs/apk/prerelease/output-metadata.json").read_text()
          )
          element = metadata["elements"][0]
          version_name = element["versionName"]
          safe_version = "".join(
              ch if ch.isalnum() or ch in "._-" else "-"
              for ch in version_name
          )
          build_variant = "${{ inputs.build_variant != '' && inputs.build_variant || 'prerelease' }}"
          release_channel_input = "${{ inputs.release_channel != '' && inputs.release_channel || 'auto' }}"
          if release_channel_input == "auto":
              inferred_channel = "prerelease" if "-" in version_name else "stable"
          else:
              inferred_channel = release_channel_input
          package_label = "internal-dev-preview" if build_variant == "prerelease" else "release"
          release_name_suffix = " (Internal Dev Preview)" if inferred_channel == "prerelease" else ""
          release_title = f"Solar Gravity Lab {version_name}{release_name_suffix}"
          tag_name = f"v{version_name}"

          print(f"apk_name={element['outputFile']}")
          print(f"version_code={element['versionCode']}")
          print(f"version_name={version_name}")
          print(f"safe_version={safe_version}")
          print(f"tag_name={tag_name}")
          print(f"build_variant={build_variant}")
          print(f"release_channel={inferred_channel}")
          print(f"package_label={package_label}")
          print(f"release_title={release_title}")
          PY

      - name: Stage packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          variant_dir="${{ steps.meta.outputs.build_variant }}"
          artifact_name="solar-gravity-lab-${{ steps.meta.outputs.safe_version }}-${{ steps.meta.outputs.package_label }}.apk"
          cp \
            "clients/android/app/build/outputs/apk/${variant_dir}/${{ steps.meta.outputs.apk_name }}" \
            "dist/${artifact_name}"
          sha256sum "dist/${artifact_name}" > "dist/${artifact_name}.sha256"

      - name: Generate release changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_release_changelog.py \
            --version "${{ steps.meta.outputs.version_name }}" \
            --to "${{ steps.git_meta.outputs.head_sha }}" \
            --json-output "dist/changelog-${{ steps.meta.outputs.safe_version }}.json" \
            --markdown-output "dist/changelog-${{ steps.meta.outputs.safe_version }}.md"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("dist/changelog-${{ steps.meta.outputs.safe_version }}.json").read_text()
          )
          print(f"baseline_tag={payload['baseline_tag']}")
          print(f"commit_count={payload['commit_count']}")
          PY

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator launch smoke for packaged APK
        id: launch_smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash .github/scripts/run_prerelease_android_launch_smoke.sh "${{ steps.meta.outputs.safe_version }}" "${{ steps.meta.outputs.package_label }}"

      - name: Upload prerelease APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-gravity-lab-${{ steps.meta.outputs.safe_version }}-${{ steps.meta.outputs.package_label }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*.json
            dist/*.md
            dist/startup-smoke/**
            clients/android/app/build/outputs/apk/${{ steps.meta.outputs.build_variant }}/output-metadata.json

      - name: Publish GitHub Release
        if: success() && (github.event_name == 'push' || inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ steps.meta.outputs.tag_name }}"
          release_title="${{ steps.meta.outputs.release_title }}"
          release_target="${{ steps.git_meta.outputs.head_sha }}"
          release_notes="dist/changelog-${{ steps.meta.outputs.safe_version }}.md"
          prerelease_flag=""
          if [[ "${{ steps.meta.outputs.release_channel }}" == "prerelease" ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$tag_name" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$tag_name" \
              --repo "${{ github.repository }}" \
              --title "$release_title" \
              --notes-file "$release_notes" \
              --target "$release_target" \
              $prerelease_flag
          else
            gh release create "$tag_name" \
              --repo "${{ github.repository }}" \
              --target "$release_target" \
              --title "$release_title" \
              --notes-file "$release_notes" \
              $prerelease_flag
          fi

          uploaded=false
          for attempt in {1..10}; do
            if gh release upload "$tag_name" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/*; then
              uploaded=true
              break
            fi
            sleep 3
          done

          if [[ "$uploaded" != true ]]; then
            echo "Failed to upload release assets for $tag_name after retries." >&2
            exit 1
          fi

      - name: Emit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## prerelease-apk"
            echo
            echo "- ref: \`${{ inputs.ref != '' && inputs.ref || github.ref_name }}\`"
            echo "- git head: \`${{ steps.git_meta.outputs.head_sha }}\`"
            echo "- version: \`${{ steps.meta.outputs.version_name }}\`"
            echo "- versionCode: \`${{ steps.meta.outputs.version_code }}\`"
            echo "- build type: \`${{ steps.meta.outputs.build_variant }}\`"
            echo "- release channel: \`${{ steps.meta.outputs.release_channel }}\`"
            echo "- release tag: \`${{ steps.meta.outputs.tag_name }}\`"
            echo "- package id: \`${{ steps.meta.outputs.build_variant == 'prerelease' && 'com.sednalabs.solarlab.internal' || 'com.sednalabs.solarlab' }}\`"
            echo "- signing: \`${{ steps.meta.outputs.build_variant == 'prerelease' && 'debug key for internal sideload testing only' || 'unsigned release artifact unless a release signing config is supplied' }}\`"
            echo "- artifact: \`solar-gravity-lab-${{ steps.meta.outputs.safe_version }}-${{ steps.meta.outputs.package_label }}.apk\`"
            echo "- launch smoke: \`${{ steps.launch_smoke.outcome || 'skipped' }}\`"
            echo "- publish release: \`${{ (github.event_name == 'push' || inputs.publish_release == true) && 'enabled' || 'disabled' }}\`"
            echo "- changelog baseline: \`${{ steps.changelog.outputs.baseline_tag }}\`"
            echo "- changelog commits: \`${{ steps.changelog.outputs.commit_count }}\`"
            echo "- changelog (JSON): \`dist/changelog-${{ steps.meta.outputs.safe_version }}.json\`"
            echo "- changelog (markdown): \`dist/changelog-${{ steps.meta.outputs.safe_version }}.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
