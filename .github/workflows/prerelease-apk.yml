name: prerelease-apk
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && 'manual APK release request' ||
    github.ref_name == 'main' && 'main APK release gate' ||
    format('APK release {0}', github.ref_name)
  }}

on:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: false
        type: string
      version_name:
        description: Optional semver versionName override (for example 0.1.0 or 0.1.1-alpha.1)
        required: false
        type: string
      version_code:
        description: Optional versionCode override
        required: false
        type: string
      release_channel:
        description: Release channel metadata override
        required: false
        default: auto
        type: choice
        options:
          - auto
          - prerelease
          - stable
      build_variant:
        description: Android build variant to package
        required: false
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
      publish_release:
        description: Publish or update the GitHub Release page from this run
        required: false
        default: false
        type: boolean
      android_artifact_mode:
        description: Android launch-smoke artifact capture mode
        required: true
        default: failures-only
        type: choice
        options:
          - failures-only
          - always
      emulator_boot_strategy:
        description: Emulator startup strategy for launch smoke
        required: true
        default: cold
        type: choice
        options:
          - snapshot-cache
          - cold
      gradle_configuration_cache:
        description: Gradle configuration-cache mode for Android build steps
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_AVD_NAME: pixel_7_api35_google_apis_x86_64
  ANDROID_AVD_CACHE_VERSION: v3
  ANDROID_SDK_COMPONENT_CACHE_VERSION: v1
  ANDROID_RUST_TOOLCHAIN_CACHE_VERSION: v2
  ANDROID_SDK_ROOT_DEFAULT: /usr/local/lib/android/sdk
  ANDROID_PLATFORM_PACKAGE: "platforms;android-36"
  ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;36.0.0"
  ANDROID_SYSTEM_IMAGE_PACKAGE: "system-images;android-35;google_apis;x86_64"
  ANDROID_CMAKE_PACKAGE: "cmake;3.31.5"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_NDK_PACKAGE: "ndk;27.3.13750724"
  SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
  SCCACHE_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID != '' && secrets.SCCACHE_ACCESS_KEY_ID || secrets.R2_CACHE_ACCESS_KEY_ID }}
  SCCACHE_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY != '' && secrets.SCCACHE_SECRET_ACCESS_KEY || secrets.R2_CACHE_SECRET_ACCESS_KEY }}
  SCCACHE_CREDENTIAL_SOURCE: ${{ secrets.SCCACHE_ACCESS_KEY_ID != '' && 'dedicated-sccache-secrets' || 'shared-r2-secrets' }}

jobs:
  route:
    name: Release request gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_requested: ${{ steps.route.outputs.release_requested }}
      reason: ${{ steps.route.outputs.reason }}
      checkout_ref: ${{ steps.route.outputs.checkout_ref }}
      target_sha: ${{ steps.route.outputs.target_sha }}
      version_name: ${{ steps.route.outputs.version_name }}
      version_code: ${{ steps.route.outputs.version_code }}
      release_channel: ${{ steps.route.outputs.release_channel }}
      build_variant: ${{ steps.route.outputs.build_variant }}
      publish_release: ${{ steps.route.outputs.publish_release }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Resolve release request
        id: route
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          INPUT_BUILD_VARIANT: ${{ inputs.build_variant }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_prerelease_apk_request.py \
            --event-name "${EVENT_NAME}" \
            --event-ref "${EVENT_REF}" \
            --event-sha "${EVENT_SHA}" \
            --event-after "${EVENT_AFTER}" \
            --head-message "${HEAD_MESSAGE}" \
            --input-ref "${INPUT_REF}" \
            --input-version-name "${INPUT_VERSION_NAME}" \
            --input-version-code "${INPUT_VERSION_CODE}" \
            --input-release-channel "${INPUT_RELEASE_CHANNEL}" \
            --input-build-variant "${INPUT_BUILD_VARIANT}" \
            --input-publish-release "${INPUT_PUBLISH_RELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Summarize release gate
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_REQUESTED: ${{ steps.route.outputs.release_requested }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
          CHECKOUT_REF: ${{ steps.route.outputs.checkout_ref }}
          VERSION_NAME: ${{ steps.route.outputs.version_name }}
          VERSION_CODE: ${{ steps.route.outputs.version_code }}
          RELEASE_CHANNEL: ${{ steps.route.outputs.release_channel }}
          BUILD_VARIANT: ${{ steps.route.outputs.build_variant }}
          PUBLISH_RELEASE: ${{ steps.route.outputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REQUESTED:-false}" == "true" ]]; then
            decision="package"
            package_job="will run"
          else
            decision="skip"
            package_job="skipped"
          fi

          {
            echo "## prerelease-apk release gate"
            echo
            echo "- decision: \`${decision}\`"
            echo "- reason: \`${ROUTE_REASON:-unknown}\`"
            echo "- package job: \`${package_job}\`"
            if [[ "${RELEASE_REQUESTED:-false}" == "true" ]]; then
              echo "- checkout ref: \`${CHECKOUT_REF}\`"
              echo "- version: \`${VERSION_NAME:-auto}\`"
              echo "- versionCode: \`${VERSION_CODE:-auto}\`"
              echo "- release channel: \`${RELEASE_CHANNEL:-auto}\`"
              echo "- build variant: \`${BUILD_VARIANT:-prerelease}\`"
              echo "- publish release: \`${PUBLISH_RELEASE:-false}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  build-prerelease-apk:
    name: Build internal dev preview APK
    needs: route
    if: ${{ needs.route.outputs.release_requested == 'true' }}
    outputs:
      head_sha: ${{ steps.git_meta.outputs.head_sha }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      safe_version: ${{ steps.meta.outputs.safe_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      build_variant: ${{ steps.meta.outputs.build_variant }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      package_label: ${{ steps.meta.outputs.package_label }}
      release_title: ${{ steps.meta.outputs.release_title }}
      launch_smoke_outcome: ${{ steps.launch_smoke.outcome }}
      changelog_baseline_tag: ${{ steps.changelog.outputs.baseline_tag }}
      changelog_commit_count: ${{ steps.changelog.outputs.commit_count }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gradle_configuration_cache: ${{ inputs.gradle_configuration_cache != '' && inputs.gradle_configuration_cache || 'disabled' }}
    env:
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USERNAME: ${{ vars.GRADLE_REMOTE_CACHE_USERNAME }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'validation/')) && 'true' || 'false' }}
      GRADLE_CONFIGURATION_CACHE_MODE: ${{ inputs.gradle_configuration_cache != '' && inputs.gradle_configuration_cache || 'disabled' }}
      GRADLE_CONFIGURATION_CACHE_PERSISTENCE: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY != '' && 'github-cache-encrypted' || 'job-local-only' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}

      - name: Initialize prerelease timing
        id: prerelease_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "lane_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve checkout metadata
        id: git_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') && !startsWith(github.ref_name, 'validation/')) }}
          cache-cleanup: on-success
          add-job-summary: on-failure
          cache-encryption-key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android emulator AVD cache
        id: avd-cache
        if: ${{ inputs.emulator_boot_strategy == 'snapshot-cache' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ env.ANDROID_AVD_NAME }}-${{ env.ANDROID_AVD_CACHE_VERSION }}

      - name: Restore Android SDK emulator packages cache
        id: android-sdk-components-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/google_apis
          key: android-sdk-components-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_SDK_COMPONENT_CACHE_VERSION }}

      - name: Seed Android emulator snapshot
        if: ${{ inputs.emulator_boot_strategy == 'snapshot-cache' && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for ${ANDROID_AVD_NAME}."

      - name: Accept Android SDK licenses and install build toolchain
        id: android_sdk_install
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - id: prerelease_rust_shared_cache
        uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-android-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: prerelease_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Prepare Rust Android toolchain
        id: rust_android_toolchain
        uses: ./.github/actions/prepare-rust-android-toolchain
        with:
          cache-version: ${{ env.ANDROID_RUST_TOOLCHAIN_CACHE_VERSION }}
          shared-cache-hit: ${{ steps.prerelease_rust_shared_cache.outputs.cache-hit }}

      - name: Resolve prerelease version defaults
        id: resolved_version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ needs.route.outputs.version_name != '' && needs.route.outputs.version_name || inputs.version_name }}
          INPUT_VERSION_CODE: ${{ needs.route.outputs.version_code != '' && needs.route.outputs.version_code || inputs.version_code }}
        run: |
          set -euo pipefail
          version_name_override="${INPUT_VERSION_NAME:-}"
          version_code_override="${INPUT_VERSION_CODE:-}"

          if [[ -z "${version_name_override}" ]]; then
            git fetch --force --prune origin '+refs/tags/v*:refs/tags/v*'
            version_name_override="0.1.0"
          fi

          {
            echo "version_name=${version_name_override}"
            echo "version_code=${version_code_override}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble prerelease APK
        id: assemble_prerelease
        env:
          SOLARLAB_VERSION_NAME: ${{ steps.resolved_version.outputs.version_name }}
          SOLARLAB_VERSION_CODE: ${{ steps.resolved_version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gradle
          phase_start="$(date +%s)"
          build_variant="${{ needs.route.outputs.build_variant != '' && needs.route.outputs.build_variant || inputs.build_variant || 'prerelease' }}"
          mapfile -t gradle_configuration_cache_args < <(
            bash .github/scripts/gradle_configuration_cache_args.sh "${GRADLE_CONFIGURATION_CACHE_MODE}"
          )
          ./gradlew -p clients/android ":app:assemble${build_variant^}" \
            "${gradle_configuration_cache_args[@]}" \
            2>&1 | tee dist/gradle/prerelease-assemble.log
          phase_end="$(date +%s)"
          from_cache_count="$(grep -c 'FROM-CACHE' dist/gradle/prerelease-assemble.log || true)"
          configuration_cache_status="$(
            bash .github/scripts/gradle_configuration_cache_status.sh \
              dist/gradle/prerelease-assemble.log \
              "${GRADLE_CONFIGURATION_CACHE_MODE}"
          )"
          {
            echo "assemble_seconds=$((phase_end - phase_start))"
            echo "from_cache_count=${from_cache_count}"
            echo "configuration_cache_status=${configuration_cache_status}"
          } >> "$GITHUB_OUTPUT"

      - name: Derive artifact metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          build_variant = "${{ needs.route.outputs.build_variant != '' && needs.route.outputs.build_variant || inputs.build_variant || 'prerelease' }}"
          metadata = json.loads(
              Path(f"clients/android/app/build/outputs/apk/{build_variant}/output-metadata.json").read_text()
          )
          element = metadata["elements"][0]
          version_name = element["versionName"]
          safe_version = "".join(
              ch if ch.isalnum() or ch in "._-" else "-"
              for ch in version_name
          )
          release_channel_input = "${{ needs.route.outputs.release_channel != '' && needs.route.outputs.release_channel || inputs.release_channel || 'auto' }}"
          if release_channel_input == "auto":
              inferred_channel = "prerelease" if "-" in version_name else "stable"
          else:
              inferred_channel = release_channel_input
          package_label = "internal-dev-preview" if build_variant == "prerelease" else "release"
          release_name_suffix = " (Internal Dev Preview)" if inferred_channel == "prerelease" else ""
          release_title = f"Solar Gravity Lab {version_name}{release_name_suffix}"
          tag_name = f"v{version_name}"

          print(f"apk_name={element['outputFile']}")
          print(f"version_code={element['versionCode']}")
          print(f"version_name={version_name}")
          print(f"safe_version={safe_version}")
          print(f"tag_name={tag_name}")
          print(f"build_variant={build_variant}")
          print(f"release_channel={inferred_channel}")
          print(f"package_label={package_label}")
          print(f"release_title={release_title}")
          PY

      - name: Stage packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          variant_dir="${{ steps.meta.outputs.build_variant }}"
          artifact_name="solar-gravity-lab-${{ steps.meta.outputs.safe_version }}-${{ steps.meta.outputs.package_label }}.apk"
          cp \
            "clients/android/app/build/outputs/apk/${variant_dir}/${{ steps.meta.outputs.apk_name }}" \
            "dist/${artifact_name}"
          sha256sum "dist/${artifact_name}" > "dist/${artifact_name}.sha256"

      - name: Emulator launch smoke for packaged APK
        id: launch_smoke
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: ${{ inputs.emulator_boot_strategy == 'snapshot-cache' && 'false' || 'true' }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run_prerelease_android_launch_smoke.sh "${{ steps.meta.outputs.safe_version }}" "${{ steps.meta.outputs.package_label }}"
        env:
          ANDROID_LAUNCH_ARTIFACT_MODE: ${{ inputs.android_artifact_mode }}

      - name: Prepare full git history for authoritative changelog
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --prune --unshallow origin
          else
            git fetch --prune origin
          fi
          git fetch --force --prune origin '+refs/tags/v*:refs/tags/*'

      - name: Generate release changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_release_changelog.py \
            --version "${{ steps.meta.outputs.version_name }}" \
            --to "${{ steps.git_meta.outputs.head_sha }}" \
            --json-output "dist/changelog-${{ steps.meta.outputs.safe_version }}.json" \
            --markdown-output "dist/changelog-${{ steps.meta.outputs.safe_version }}.md"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("dist/changelog-${{ steps.meta.outputs.safe_version }}.json").read_text()
          )
          print(f"baseline_tag={payload['baseline_tag']}")
          print(f"commit_count={payload['commit_count']}")
          PY

      - name: Generate build provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          safe_version = "${{ steps.meta.outputs.safe_version }}"
          artifact_name = f"solar-gravity-lab-{safe_version}-${{ steps.meta.outputs.package_label }}.apk"
          sha_path = Path(f"dist/{artifact_name}.sha256")
          payload = {
              "schema_version": 1,
              "provenance_kind": "android-build",
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "checkout_ref": "${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}",
              "commit_sha": "${{ steps.git_meta.outputs.head_sha }}",
              "version_name": "${{ steps.meta.outputs.version_name }}",
              "version_code": "${{ steps.meta.outputs.version_code }}",
              "build_variant": "${{ steps.meta.outputs.build_variant }}",
              "release_channel": "${{ steps.meta.outputs.release_channel }}",
              "artifact_name": artifact_name,
              "artifact_sha256": sha_path.read_text(encoding="utf-8").split()[0],
              "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          output = Path(f"dist/build-provenance-{safe_version}.json")
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Emit prerelease Android timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_end_epoch="$(date +%s)"
          lane_start_epoch="${{ steps.prerelease_timing.outputs.lane_start_epoch }}"
          lane_total="$((lane_end_epoch - lane_start_epoch))"
          gradle_cache_configured='false'
          gradle_cache_mode='disabled'
          if [[ -n "${GRADLE_REMOTE_CACHE_URL:-}" ]]; then
            gradle_cache_configured='true'
            if [[ "${GRADLE_REMOTE_CACHE_PUSH}" == "true" ]]; then
              gradle_cache_mode='write-enabled'
            else
              gradle_cache_mode='read-only'
            fi
          fi
          {
            echo "## prerelease android timings"
            echo "- sdk setup: \`${{ steps.android_sdk_install.outputs.sdk_setup_seconds || 'n/a' }}s\`"
            echo "- rust/android toolchain: \`${{ steps.rust_android_toolchain.outputs.rust_android_toolchain_seconds || 'n/a' }}s\`"
            echo "- assemble APK: \`${{ steps.assemble_prerelease.outputs.assemble_seconds || 'n/a' }}s\`"
            echo "- lane total (including emulator + launch smoke): \`${lane_total}s\`"
            echo "- emulator boot strategy: \`${{ inputs.emulator_boot_strategy }}\`"
            echo "- launch artifact mode: \`${{ inputs.android_artifact_mode }}\`"
            echo "- avd cache key: \`avd-${{ runner.os }}-${{ env.ANDROID_AVD_NAME }}-${{ env.ANDROID_AVD_CACHE_VERSION }}\`"
            echo "- avd cache result: \`${{ inputs.emulator_boot_strategy == 'snapshot-cache' && (steps.avd-cache.outputs.cache-hit == 'true' && 'hit' || 'miss') || 'skipped' }}\`"
            echo "- remote gradle cache configured: \`${gradle_cache_configured}\`"
            echo "- remote gradle cache mode: \`${gradle_cache_mode}\`"
            echo "- remote gradle cache push: \`${{ env.GRADLE_REMOTE_CACHE_PUSH }}\`"
            echo "- gradle configuration cache: \`${{ env.GRADLE_CONFIGURATION_CACHE_MODE }}\`"
            echo "- gradle configuration cache persistence: \`${{ env.GRADLE_CONFIGURATION_CACHE_PERSISTENCE }}\`"
            echo "- gradle configuration cache result: \`${{ steps.assemble_prerelease.outputs.configuration_cache_status || 'n/a' }}\`"
            echo "- assemble FROM-CACHE lines: \`${{ steps.assemble_prerelease.outputs.from_cache_count || 'n/a' }}\`"
            echo "- rust/android target cache hit: \`${{ steps.rust_android_toolchain.outputs.target_cache_hit || 'false' }}\`"
            echo "- rust/android target status: \`${{ steps.rust_android_toolchain.outputs.target_status || 'n/a' }}\`"
            echo "- cargo-ndk status: \`${{ steps.rust_android_toolchain.outputs.cargo_ndk_status || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit prerelease sccache stats
        if: always() && steps.prerelease_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/prerelease-build.txt
          {
            echo "## prerelease-build sccache"
            cat dist/sccache/prerelease-build.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prerelease APK artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solar-gravity-lab-${{ steps.meta.outputs.safe_version }}-${{ steps.meta.outputs.package_label }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*provenance*.json
            dist/*.json
            dist/*.md
            dist/gradle/**
            dist/startup-smoke/**
            dist/sccache/**
            clients/android/app/build/outputs/apk/${{ steps.meta.outputs.build_variant }}/output-metadata.json

  isa-prerelease-proof:
    name: ARM64 ISA prerelease proof
    needs:
      - route
      - build-prerelease-apk
    if: needs.build-prerelease-apk.result == 'success'
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: isa_proof_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run ARM64 ISA activation + scalar oracle proof
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/run_arm64_isa_proof.sh

      - name: Emit ISA proof sccache stats
        if: always() && steps.isa_proof_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/isa-prerelease-proof.txt
          {
            echo "## isa-prerelease-proof sccache"
            cat dist/sccache/isa-prerelease-proof.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ARM64 ISA proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-isa-proof-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            dist/arm64-isa-proof/**
            dist/sccache/**

  publish-prerelease-apk:
    name: Publish GitHub release
    needs:
      - route
      - build-prerelease-apk
      - isa-prerelease-proof
    if: |
      always() &&
      needs.build-prerelease-apk.result == 'success' &&
      needs.isa-prerelease-proof.result == 'success' &&
      needs.route.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: solar-gravity-lab-${{ needs.build-prerelease-apk.outputs.safe_version }}-${{ needs.build-prerelease-apk.outputs.package_label }}-${{ github.run_id }}
          path: dist

      - name: Resolve downloaded changelog artifacts
        id: release_artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Artifacts are downloaded with a nested folder today, so resolve paths
          # by filename rather than assuming they sit directly under dist/.
          changelog_json="$(find dist -type f -name 'changelog-*.json' | sort | head -n 1)"
          changelog_md="$(find dist -type f -name 'changelog-*.md' | sort | head -n 1)"
          metadata_path="$(find dist -type f -name 'output-metadata.json' | sort | head -n 1)"

          if [[ -z "$changelog_json" || -z "$changelog_md" || -z "$metadata_path" ]]; then
            echo "Missing release artifacts in downloaded dist directory." >&2
            find dist -type f || true
            exit 1
          fi

          {
            echo "changelog_json=$changelog_json"
            echo "changelog_md=$changelog_md"
            echo "metadata_path=$metadata_path"
          } >> "$GITHUB_OUTPUT"

      - name: Validate promoted release target
        shell: bash
        env:
          INPUT_REF: ${{ needs.route.outputs.checkout_ref }}
          RELEASE_TARGET: ${{ needs.build-prerelease-apk.outputs.head_sha }}
        run: |
          set -euo pipefail
          echo "Validate promoted release target"

          requested_ref="${INPUT_REF:-${GITHUB_REF_NAME}}"
          case "${GITHUB_EVENT_NAME}:${requested_ref}" in
            push:release/*|push:refs/heads/release/*)
              exit 0
              ;;
          esac

          if [[ "${requested_ref}" =~ ^[0-9a-fA-F]{40}$ && "${requested_ref}" == "${RELEASE_TARGET}" ]]; then
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "Release publishing is only allowed from release pushes or explicitly validated manual dispatches." >&2
            exit 1
          fi

          case "${requested_ref}" in
            main|refs/heads/main|release/*|refs/heads/release/*|v*|refs/tags/v*)
              exit 0
              ;;
          esac

          echo "Refuses to publish a release from unpromoted ref: ${requested_ref}" >&2
          exit 1

      - name: Generate release provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          safe_version = "${{ needs.build-prerelease-apk.outputs.safe_version }}"
          artifact_name = f"solar-gravity-lab-{safe_version}-${{ needs.build-prerelease-apk.outputs.package_label }}.apk"
          sha_candidates = sorted(Path("dist").rglob(f"{artifact_name}.sha256"))
          if not sha_candidates:
              raise SystemExit(f"Missing SHA-256 file for {artifact_name}")
          payload = {
              "schema_version": 1,
              "provenance_kind": "github-release",
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "release_tag": "${{ needs.build-prerelease-apk.outputs.tag_name }}",
              "release_target": "${{ needs.build-prerelease-apk.outputs.head_sha }}",
              "checkout_ref": "${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}",
              "version_name": "${{ needs.build-prerelease-apk.outputs.version_name }}",
              "version_code": "${{ needs.build-prerelease-apk.outputs.version_code }}",
              "build_variant": "${{ needs.build-prerelease-apk.outputs.build_variant }}",
              "release_channel": "${{ needs.build-prerelease-apk.outputs.release_channel }}",
              "artifact_name": artifact_name,
              "artifact_sha256": sha_candidates[0].read_text(encoding="utf-8").split()[0],
              "launch_smoke_outcome": "${{ needs.build-prerelease-apk.outputs.launch_smoke_outcome }}",
              "arm64_isa_proof": "${{ needs.isa-prerelease-proof.result }}",
              "changelog_baseline_tag": "${{ needs.build-prerelease-apk.outputs.changelog_baseline_tag }}",
              "changelog_commit_count": "${{ needs.build-prerelease-apk.outputs.changelog_commit_count }}",
              "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
          }
          output = Path("dist") / f"release-provenance-{safe_version}.json"
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build-prerelease-apk.outputs.tag_name }}
          RELEASE_TITLE: ${{ needs.build-prerelease-apk.outputs.release_title }}
          RELEASE_TARGET: ${{ needs.build-prerelease-apk.outputs.head_sha }}
          SAFE_VERSION: ${{ needs.build-prerelease-apk.outputs.safe_version }}
          RELEASE_CHANNEL: ${{ needs.build-prerelease-apk.outputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes="${{ steps.release_artifacts.outputs.changelog_md }}"
          metadata_path="${{ steps.release_artifacts.outputs.metadata_path }}"
          release_provenance_path="$(find dist -type f -name 'release-provenance-*.json' | sort | head -n 1)"
          if [[ -z "$release_provenance_path" ]]; then
            echo "Missing release provenance asset under dist/." >&2
            exit 1
          fi

          prerelease_flag=""
          if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
            prerelease_flag="--prerelease"
          fi

          mapfile -t release_assets < <(find dist -type f \( -name '*.apk' -o -name '*.sha256' -o -name '*.json' -o -name '*.md' \) | sort)
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "No release assets found under dist/." >&2
            exit 1
          fi
          release_assets+=( "$metadata_path" )
          release_assets+=( "$release_provenance_path" )
          mapfile -t release_assets < <(printf '%s\n' "${release_assets[@]}" | sort -u)

          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              --target "$RELEASE_TARGET" \
              $prerelease_flag
          else
            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file "$release_notes" \
              $prerelease_flag
          fi

          uploaded=false
          # shellcheck disable=SC2034
          for attempt in {1..10}; do
            if gh release upload "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${release_assets[@]}"; then
              uploaded=true
              break
            fi
            sleep 3
          done

          if [[ "$uploaded" != true ]]; then
            echo "Failed to upload release assets for $TAG_NAME after retries." >&2
            exit 1
          fi

      - name: Emit release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## prerelease-apk"
            echo
            echo "- ref: \`${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}\`"
            echo "- git head: \`${{ needs.build-prerelease-apk.outputs.head_sha }}\`"
            echo "- version: \`${{ needs.build-prerelease-apk.outputs.version_name }}\`"
            echo "- versionCode: \`${{ needs.build-prerelease-apk.outputs.version_code }}\`"
            echo "- build type: \`${{ needs.build-prerelease-apk.outputs.build_variant }}\`"
            echo "- release channel: \`${{ needs.build-prerelease-apk.outputs.release_channel }}\`"
            echo "- release tag: \`${{ needs.build-prerelease-apk.outputs.tag_name }}\`"
            echo "- package label: \`${{ needs.build-prerelease-apk.outputs.package_label }}\`"
            echo "- artifact: \`solar-gravity-lab-${{ needs.build-prerelease-apk.outputs.safe_version }}-${{ needs.build-prerelease-apk.outputs.package_label }}.apk\`"
            echo "- launch smoke: \`${{ needs.build-prerelease-apk.outputs.launch_smoke_outcome }}\`"
            echo "- emulator boot strategy: \`${{ inputs.emulator_boot_strategy }}\`"
            echo "- launch artifact mode: \`${{ inputs.android_artifact_mode }}\`"
            echo "- arm64 ISA proof: \`${{ needs.isa-prerelease-proof.result }}\`"
            echo "- emulator boot strategy: \`${{ inputs.emulator_boot_strategy }}\`"
            echo "- launch artifact mode: \`${{ inputs.android_artifact_mode }}\`"
            echo "- publish release: \`${{ needs.route.outputs.publish_release == 'true' && 'enabled' || 'disabled' }}\`"
            echo "- changelog baseline: \`${{ needs.build-prerelease-apk.outputs.changelog_baseline_tag }}\`"
            echo "- changelog commits: \`${{ needs.build-prerelease-apk.outputs.changelog_commit_count }}\`"
            echo "- changelog (JSON): \`${{ steps.release_artifacts.outputs.changelog_json }}\`"
            echo "- changelog (markdown): \`${{ steps.release_artifacts.outputs.changelog_md }}\`"
            echo "- artifact metadata: \`${{ steps.release_artifacts.outputs.metadata_path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Publish prerelease summary
    needs:
      - route
      - build-prerelease-apk
      - isa-prerelease-proof
      - publish-prerelease-apk
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}

      - name: Build prerelease summary payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/prerelease-summary
          python3 .github/scripts/write_validation_summary.py \
            --workflow prerelease-apk \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --checkout-ref "${{ needs.route.outputs.checkout_ref != '' && needs.route.outputs.checkout_ref || github.ref_name }}" \
            --profile "prerelease" \
            --profile-intent "checkpoint" \
            --profile-notes "Packages installable artifacts and launch-smoke evidence for remote validation." \
            --lane-set "prerelease-apk" \
            --lane-summary "build_variant=${{ needs.build-prerelease-apk.outputs.build_variant || 'n/a' }}, release_channel=${{ needs.build-prerelease-apk.outputs.release_channel || 'n/a' }}, publish_release=${{ needs.route.outputs.publish_release == 'true' }}" \
            --android-test-scope "launch-smoke" \
            --android-validation-mode "${{ needs.build-prerelease-apk.outputs.build_variant || 'prerelease' }}" \
            --android-artifact-mode "${{ inputs.android_artifact_mode }}" \
            --emulator-boot-strategy "${{ inputs.emulator_boot_strategy }}" \
            --gradle-configuration-cache "${{ inputs.gradle_configuration_cache }}" \
            --job build-prerelease-apk=${{ needs.build-prerelease-apk.result }} \
            --job isa-prerelease-proof=${{ needs.isa-prerelease-proof.result }} \
            --job publish-prerelease-apk=${{ needs.publish-prerelease-apk.result }} \
            --output-json dist/prerelease-summary/prerelease-summary.json \
            --output-md dist/prerelease-summary/prerelease-summary.md

      - name: Emit prerelease summary
        shell: bash
        run: cat dist/prerelease-summary/prerelease-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prerelease summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prerelease-summary
          if-no-files-found: error
          path: dist/prerelease-summary/**
