name: Code Coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/code-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/code-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-coverage-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  python-tools:
    name: Python tool coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install coverage

      - name: Run Python tool tests with coverage
        run: |
          set -euo pipefail
          for test_file in .github/scripts/test_*.py; do
            coverage run --append --source=.github/scripts "${test_file}"
          done
          coverage xml -o coverage-python-tools.xml

      - name: Upload Python tool coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-tool-coverage
          path: coverage-python-tools.xml
          if-no-files-found: error
