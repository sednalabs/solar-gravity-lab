name: interactive-android-session

on:
  workflow_dispatch:
    inputs:
      session_mode:
        description: Live tunnel or isolated baseline capture
        required: true
        type: choice
        options:
          - live
          - capture-only
        default: live
      build_source:
        description: Whether to reuse a remote-built artifact or assemble inline inside the session workflow
        required: true
        type: choice
        options:
          - artifact
          - inline
          - qualified-prerelease
        default: artifact
      build_run_id:
        description: Optional interactive-android-build workflow run id to install into the live session
        required: false
        type: string
      artifact_name:
        description: Optional artifact name override for the reusable interactive APK bundle
        required: false
        type: string
      prerelease_artifact_id:
        description: Exact GitHub artifact ID for qualified-prerelease
        required: false
        type: string
      prerelease_source_sha:
        description: Exact APK source commit SHA for qualified-prerelease
        required: false
        type: string
      android_validation_mode:
        description: Which Android runtime posture to boot for live debugging
        required: true
        type: choice
        options:
          - shell-v2
          - stage-first-runtime
        default: stage-first-runtime
      interactive_debug_profile:
        description: Runtime posture for the hosted debug session
        required: true
        type: choice
        options:
          - hosted-debug-lite
          - full-fidelity
        default: hosted-debug-lite
      emulator_boot_strategy:
        description: Emulator startup strategy
        required: true
        type: choice
        options:
          - cold
        default: cold
      session_timeout_minutes:
        description: Interactive session timeout window in minutes (30-180)
        required: true
        type: string
        default: "90"
      keep_session_on_failure:
        description: Keep the live session available when preflight fails
        required: true
        type: boolean
        default: true

concurrency:
  # The named tunnel has fixed ingress hostnames across checkout refs.
  group: ${{ github.repository }}-${{ github.workflow }}${{ inputs.session_mode == 'capture-only' && '-capture' || '' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  ANDROID_AVD_NAME: pixel_7_api35_google_apis_x86_64
  ANDROID_SDK_ROOT_DEFAULT: /usr/local/lib/android/sdk
  ANDROID_PLATFORM_PACKAGE: "platforms;android-36"
  ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;36.0.0"
  ANDROID_SYSTEM_IMAGE_PACKAGE: "system-images;android-35;google_apis;x86_64"
  ANDROID_CMAKE_PACKAGE: "cmake;3.31.5"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_NDK_PACKAGE: "ndk;27.3.13750724"
  INTERACTIVE_EMULATOR_GRPC_PORT: "8554"
  INTERACTIVE_MCP_BIND_ADDR: 127.0.0.1:9526
  INTERACTIVE_DEBUG_TTYD_PORT: "7681"
  INTERACTIVE_SESSION_ROOT: dist/interactive-session
  INTERACTIVE_APP_PACKAGE: com.sednalabs.solarlab
  INTERACTIVE_APP_ACTIVITY: com.sednalabs.solarlab.MainActivity

jobs:
  interactive-session:
    name: Hosted interactive Android emulator session
    runs-on: ubuntu-24.04
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/interactive-gradle-home
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: ${{ inputs.session_mode != 'capture-only' }}
          ref: ${{ github.sha }}

      - name: Resolve interactive session plan
        id: session_plan
        shell: bash
        env:
          INPUT_BUILD_SOURCE: ${{ inputs.build_source }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_VALIDATION_MODE: ${{ inputs.android_validation_mode }}
          INPUT_DEBUG_PROFILE: ${{ inputs.interactive_debug_profile }}
          INPUT_BOOT_STRATEGY: ${{ inputs.emulator_boot_strategy }}
          INPUT_TIMEOUT_MINUTES: ${{ inputs.session_timeout_minutes }}
          INPUT_KEEP_SESSION_ON_FAILURE: ${{ inputs.keep_session_on_failure }}
        run: |
          set -euo pipefail

          checkout_ref="${GITHUB_REF}"
          commit_sha="$(git rev-parse HEAD)"
          if [[ "${commit_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Checkout does not match the selected workflow commit" >&2
            exit 1
          fi
          if [[ "${INPUT_BOOT_STRATEGY}" != "cold" ]]; then
            echo "Only cold emulator boot is supported" >&2
            exit 1
          fi

          session_timeout_minutes="${INPUT_TIMEOUT_MINUTES:-90}"
          if ! [[ "${session_timeout_minutes}" =~ ^[0-9]+$ ]]; then
            echo "session_timeout_minutes must be an integer minute count" >&2
            exit 1
          fi
          if (( session_timeout_minutes < 30 )); then
            session_timeout_minutes=30
          fi
          if (( session_timeout_minutes > 180 )); then
            session_timeout_minutes=180
          fi

          debug_stage_first_client="true"
          preferred_gpu_backend="vulkan"
          hosted_debug_lite_mode="false"
          case "${INPUT_VALIDATION_MODE}" in
            shell-v2)
              debug_stage_first_client="false"
              preferred_gpu_backend="none"
              ;;
            stage-first-runtime)
              debug_stage_first_client="true"
              preferred_gpu_backend="vulkan"
              ;;
            *)
              echo "Unsupported android_validation_mode: ${INPUT_VALIDATION_MODE}" >&2
              exit 1
              ;;
          esac

          case "${INPUT_DEBUG_PROFILE}" in
            full-fidelity)
              hosted_debug_lite_mode="false"
              ;;
            hosted-debug-lite)
              hosted_debug_lite_mode="true"
              ;;
            *)
              echo "Unsupported interactive_debug_profile: ${INPUT_DEBUG_PROFILE}" >&2
              exit 1
              ;;
          esac

          build_source="${INPUT_BUILD_SOURCE:-artifact}"
          if [[ "${{ inputs.session_mode }}" == "capture-only" && "${build_source}" != "qualified-prerelease" ]]; then
            echo "capture-only requires a qualified prerelease" >&2
            exit 1
          fi
          case "${build_source}" in
            artifact|inline|qualified-prerelease)
              ;;
            *)
              echo "Unsupported build_source: ${build_source}" >&2
              exit 1
              ;;
          esac

          artifact_name="${INPUT_ARTIFACT_NAME:-}"
          if [[ -z "${artifact_name}" ]]; then
            artifact_name="interactive-android-build-${INPUT_VALIDATION_MODE}-${INPUT_DEBUG_PROFILE}"
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "commit_sha=${commit_sha}"
            echo "build_source=${build_source}"
            echo "build_run_id=${INPUT_BUILD_RUN_ID}"
            echo "artifact_name=${artifact_name}"
            echo "android_validation_mode=${INPUT_VALIDATION_MODE}"
            echo "interactive_debug_profile=${INPUT_DEBUG_PROFILE}"
            echo "emulator_boot_strategy=${INPUT_BOOT_STRATEGY}"
            echo "session_timeout_minutes=${session_timeout_minutes}"
            echo "keep_session_on_failure=${INPUT_KEEP_SESSION_ON_FAILURE}"
            echo "debug_stage_first_client=${debug_stage_first_client}"
            echo "preferred_gpu_backend=${preferred_gpu_backend}"
            echo "hosted_debug_lite_mode=${hosted_debug_lite_mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Initialize interactive session timing
        id: session_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "session_start_epoch=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        if: ${{ steps.session_plan.outputs.build_source != 'artifact' }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        with:
          cache-disabled: true
          add-job-summary: on-failure

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Android emulator runtime prerequisites
        id: android_sdk_runtime_install
        if: ${{ steps.session_plan.outputs.build_source != 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}"

      - name: Accept Android SDK licenses and install Android build toolchain
        id: android_sdk_build_install
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - name: Install Rust Android toolchain
        id: rust_android_toolchain
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          rustup target add aarch64-linux-android x86_64-linux-android
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk already available."
          else
            cargo install cargo-ndk --locked
          fi
          phase_end="$(date +%s)"
          echo "rust_android_toolchain_seconds=$((phase_end - phase_start))" >> "${GITHUB_OUTPUT}"

      - name: Install provider and image dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick protobuf-compiler

      - name: Install interactive live-access dependencies
        if: ${{ inputs.session_mode != 'capture-only' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ttyd
          sudo systemctl disable --now ttyd.service >/dev/null 2>&1 || true
          sudo systemctl reset-failed ttyd.service >/dev/null 2>&1 || true
          sudo pkill -x ttyd >/dev/null 2>&1 || true
          mkdir -p "$HOME/.local/bin"
          bash .github/scripts/install_cloudflared.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Checkout android-computer-use-mcp workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sednalabs/android-computer-use-mcp
          ref: 0e5a3dc692f39022fa84d88c927e4a59801673e4
          fetch-depth: 1
          persist-credentials: false
          path: mcp-workspace/servers/android-computer-use-mcp

      - name: Stage isolated MCP workspace
        id: stage_mcp_workspace
        shell: bash
        run: |
          set -euo pipefail
          isolated_root="${RUNNER_TEMP}/interactive-mcp-root"
          rm -rf "${isolated_root}"
          mkdir -p "${isolated_root}/mcp-workspace/servers"
          cp -a \
            mcp-workspace/servers/android-computer-use-mcp \
            "${isolated_root}/mcp-workspace/servers/android-computer-use-mcp"
          echo "server_dir=${isolated_root}/mcp-workspace/servers/android-computer-use-mcp" >> "${GITHUB_OUTPUT}"

      - name: Resolve interactive MCP revisions
        id: interactive_mcp_revision
        shell: bash
        run: |
          set -euo pipefail
          toolkit_sha="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          revisions = set(
              re.findall(
                  r'git\+https://github\.com/sednalabs/mcp-toolkit-rs[^"#]*#[^"#]*?([0-9a-f]{40})',
                  Path("mcp-workspace/servers/android-computer-use-mcp/Cargo.lock").read_text(),
              )
          )
          if len(revisions) != 1:
              raise SystemExit(
                  f"expected one pinned sednalabs/mcp-toolkit-rs revision, found {sorted(revisions)}"
              )
          print(revisions.pop())
          PY
          )"
          server_sha="$(git -C mcp-workspace/servers/android-computer-use-mcp rev-parse HEAD)"
          if [[ "${server_sha}" != "0e5a3dc692f39022fa84d88c927e4a59801673e4" ]]; then
            echo "Provider checkout does not match the pinned revision" >&2
            exit 1
          fi
          {
            echo "server_sha=${server_sha}"
            echo "toolkit_sha=${toolkit_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download reusable interactive build artifact
        id: resolve_build_artifact
        if: ${{ steps.session_plan.outputs.build_source == 'artifact' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_dir="${INTERACTIVE_SESSION_ROOT}/build-cache"
          if [[ -n "${{ steps.session_plan.outputs.build_run_id }}" ]]; then
            output_dir="${output_dir}/run-${{ steps.session_plan.outputs.build_run_id }}/${{ steps.session_plan.outputs.artifact_name }}"
            python3 .github/scripts/download_interactive_build_artifact.py \
              --repository "${{ github.repository }}" \
              --workflow-run-id "${{ steps.session_plan.outputs.build_run_id }}" \
              --artifact-name "${{ steps.session_plan.outputs.artifact_name }}" \
              --output-dir "${output_dir}" \
              --expected-android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
              --expected-interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
              --expected-preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            output_dir="${output_dir}/run-search-${{ steps.session_plan.outputs.commit_sha }}/${{ steps.session_plan.outputs.artifact_name }}"
            python3 .github/scripts/download_interactive_build_artifact.py \
              --repository "${{ github.repository }}" \
              --workflow-file "interactive-android-build.yml" \
              --commit-sha "${{ steps.session_plan.outputs.commit_sha }}" \
              --artifact-name "${{ steps.session_plan.outputs.artifact_name }}" \
              --output-dir "${output_dir}" \
              --expected-android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
              --expected-interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
              --expected-preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Admit qualified prerelease APK
        id: qualified_prerelease
        if: ${{ steps.session_plan.outputs.build_source == 'qualified-prerelease' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE_RUN_ID: ${{ inputs.build_run_id }}
          PRERELEASE_ARTIFACT_ID: ${{ inputs.prerelease_artifact_id }}
          PRERELEASE_SOURCE_SHA: ${{ inputs.prerelease_source_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/intake_qualified_prerelease.py

      - name: Assemble debug APK for interactive session
        id: assemble_debug
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          ./gradlew -p clients/android \
            :app:assembleDebug --no-build-cache --no-configuration-cache \
            -Psolarlab.debugStageFirstClient=${{ steps.session_plan.outputs.debug_stage_first_client }} \
            -Psolarlab.preferredGpuBackend=${{ steps.session_plan.outputs.preferred_gpu_backend }} \
            -Psolarlab.hostedDebugProfile=${{ steps.session_plan.outputs.interactive_debug_profile }}
          phase_end="$(date +%s)"
          echo "assemble_seconds=$((phase_end - phase_start))" >> "${GITHUB_OUTPUT}"

      - name: Derive debug APK metadata
        id: apk_meta
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("clients/android/app/build/outputs/apk/debug/output-metadata.json").read_text()
          )
          element = metadata["elements"][0]
          version_name = element["versionName"]
          safe_version = "".join(
              ch if ch.isalnum() or ch in "._-" else "-"
              for ch in version_name
          )
          print(f"apk_name={element['outputFile']}")
          print(f"version_name={version_name}")
          print(f"safe_version={safe_version}")
          PY

      - name: Stage inline interactive build bundle
        id: stage_inline_build
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/stage_interactive_build_bundle.py \
            --apk-path "clients/android/app/build/outputs/apk/debug/${{ steps.apk_meta.outputs.apk_name }}" \
            --output-dir "${INTERACTIVE_SESSION_ROOT}/build-cache/run-${{ github.run_id }}/${{ steps.session_plan.outputs.artifact_name }}" \
            --artifact-name "${{ steps.session_plan.outputs.artifact_name }}" \
            --repository "${{ github.repository }}" \
            --workflow "interactive-android-session" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --checkout-ref "${{ steps.session_plan.outputs.checkout_ref }}" \
            --commit-sha "${{ steps.session_plan.outputs.commit_sha }}" \
            --android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
            --interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
            --preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
            --package-name "${INTERACTIVE_APP_PACKAGE}" \
            --activity-name "${INTERACTIVE_APP_ACTIVITY}" \
            --version-name "${{ steps.apk_meta.outputs.version_name }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Resolve interactive build inputs
        id: active_build
        shell: bash
        env:
          QUALIFIED_ARTIFACT_NAME: ${{ steps.qualified_prerelease.outputs.artifact_name }}
          QUALIFIED_RUN_ID: ${{ steps.qualified_prerelease.outputs.build_run_id }}
          QUALIFIED_RUN_ATTEMPT: ${{ steps.qualified_prerelease.outputs.build_run_attempt }}
          QUALIFIED_COMMIT_SHA: ${{ steps.qualified_prerelease.outputs.build_commit_sha }}
          QUALIFIED_BUNDLE_DIR: ${{ steps.qualified_prerelease.outputs.bundle_dir }}
          QUALIFIED_MANIFEST_PATH: ${{ steps.qualified_prerelease.outputs.manifest_path }}
          QUALIFIED_APK_PATH: ${{ steps.qualified_prerelease.outputs.apk_path }}
          QUALIFIED_APK_SHA: ${{ steps.qualified_prerelease.outputs.apk_sha256 }}
          QUALIFIED_PACKAGE: ${{ steps.qualified_prerelease.outputs.package_name }}
          QUALIFIED_ACTIVITY: ${{ steps.qualified_prerelease.outputs.activity_name }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.session_plan.outputs.build_source }}" == "artifact" ]]; then
            {
              echo "artifact_name=${{ steps.resolve_build_artifact.outputs.artifact_name }}"
              echo "build_run_id=${{ steps.resolve_build_artifact.outputs.build_run_id }}"
              echo "build_run_attempt=${{ steps.resolve_build_artifact.outputs.build_run_attempt }}"
              echo "build_commit_sha=${{ steps.resolve_build_artifact.outputs.build_commit_sha }}"
              echo "bundle_dir=${{ steps.resolve_build_artifact.outputs.bundle_dir }}"
              echo "manifest_path=${{ steps.resolve_build_artifact.outputs.manifest_path }}"
              echo "apk_path=${{ steps.resolve_build_artifact.outputs.apk_path }}"
              echo "apk_sha256=${{ steps.resolve_build_artifact.outputs.apk_sha256 }}"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${{ steps.session_plan.outputs.build_source }}" == "qualified-prerelease" ]]; then
            {
              echo "artifact_name=${QUALIFIED_ARTIFACT_NAME}"
              echo "build_run_id=${QUALIFIED_RUN_ID}"
              echo "build_run_attempt=${QUALIFIED_RUN_ATTEMPT}"
              echo "build_commit_sha=${QUALIFIED_COMMIT_SHA}"
              echo "bundle_dir=${QUALIFIED_BUNDLE_DIR}"
              echo "manifest_path=${QUALIFIED_MANIFEST_PATH}"
              echo "apk_path=${QUALIFIED_APK_PATH}"
              echo "apk_sha256=${QUALIFIED_APK_SHA}"
              echo "package_name=${QUALIFIED_PACKAGE}"
              echo "activity_name=${QUALIFIED_ACTIVITY}"
              echo "validation_mode=prerelease"
              echo "debug_profile=prerelease-non-debuggable"
              echo "gpu_backend=unknown"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "artifact_name=${{ steps.stage_inline_build.outputs.artifact_name }}"
              echo "build_run_id=${{ github.run_id }}"
              echo "build_run_attempt=${{ github.run_attempt }}"
              echo "build_commit_sha=${{ steps.session_plan.outputs.commit_sha }}"
              echo "bundle_dir=${{ steps.stage_inline_build.outputs.bundle_dir }}"
              echo "manifest_path=${{ steps.stage_inline_build.outputs.manifest_path }}"
              echo "apk_path=${{ steps.stage_inline_build.outputs.apk_path }}"
              echo "apk_sha256=${{ steps.stage_inline_build.outputs.apk_sha256 }}"
            } >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${{ steps.session_plan.outputs.build_source }}" != "qualified-prerelease" ]]; then
            {
              echo "package_name=${INTERACTIVE_APP_PACKAGE}"
              echo "activity_name=${INTERACTIVE_APP_ACTIVITY}"
              echo "validation_mode=${{ steps.session_plan.outputs.android_validation_mode }}"
              echo "debug_profile=${{ steps.session_plan.outputs.interactive_debug_profile }}"
              echo "gpu_backend=${{ steps.session_plan.outputs.preferred_gpu_backend }}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate android-computer-use-mcp provider contracts
        shell: bash
        working-directory: ${{ steps.stage_mcp_workspace.outputs.server_dir }}
        run: |
          set -euo pipefail
          cargo test --locked -- --test-threads=1

      - name: Build android-computer-use-mcp release binary
        id: build_mcp
        shell: bash
        working-directory: ${{ steps.stage_mcp_workspace.outputs.server_dir }}
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          cargo build --release --locked
          phase_end="$(date +%s)"
          echo "build_seconds=$((phase_end - phase_start))" >> "${GITHUB_OUTPUT}"

      - name: Emit interactive bootstrap summary
        shell: bash
        run: |
          {
            echo "## interactive bootstrap"
            echo "- build source: \`${{ steps.session_plan.outputs.build_source }}\`"
            echo "- Android build setup: \`${{ steps.session_plan.outputs.build_source == 'inline' && 'enabled' || 'skipped' }}\`"
            echo "- Rust Android toolchain: \`${{ steps.session_plan.outputs.build_source == 'inline' && 'enabled' || 'skipped' }}\`"
            echo "- cross-run caches: \`disabled\`"
            echo "- android-computer-use-mcp provider contracts: \`passed\`"
            echo "- android-computer-use-mcp build completed: \`true\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run hosted interactive Android session
        id: interactive_session
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: true
          emulator-options: -grpc ${{ env.INTERACTIVE_EMULATOR_GRPC_PORT }} -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run_interactive_android_session.sh
        env:
          INTERACTIVE_SESSION_MODE: ${{ inputs.session_mode }}
          INTERACTIVE_WORKFLOW_SHA: ${{ github.sha }}
          INTERACTIVE_CHECKOUT_SHA: ${{ steps.session_plan.outputs.commit_sha }}
          INTERACTIVE_TOOLKIT_SHA: ${{ steps.interactive_mcp_revision.outputs.toolkit_sha }}
          INTERACTIVE_APP_APK: ${{ steps.active_build.outputs.apk_path }}
          INTERACTIVE_BUILD_MANIFEST: ${{ steps.active_build.outputs.manifest_path }}
          INTERACTIVE_APP_PACKAGE: ${{ steps.active_build.outputs.package_name }}
          INTERACTIVE_APP_ACTIVITY: ${{ steps.active_build.outputs.activity_name }}
          INTERACTIVE_MCP_WORKSPACE_DIR: ${{ steps.stage_mcp_workspace.outputs.server_dir }}
          INTERACTIVE_MCP_ADAPTER_REVISION: ${{ steps.interactive_mcp_revision.outputs.server_sha }}
          INTERACTIVE_MCP_ENVIRONMENT_ID: github-actions/${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}
          INTERACTIVE_MCP_PROVIDER_INSTANCE_ID: android-computer-use-mcp/${{ steps.interactive_mcp_revision.outputs.server_sha }}
          INTERACTIVE_MCP_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          INTERACTIVE_CLOUDFLARED_BIN: ${{ inputs.session_mode != 'capture-only' && 'cloudflared' || '' }}
          INTERACTIVE_TTYD_BIN: ${{ inputs.session_mode != 'capture-only' && '/usr/bin/ttyd' || '' }}
          INTERACTIVE_DEBUG_HOSTNAME: ${{ inputs.session_mode != 'capture-only' && secrets.SGL_INTERACTIVE_DEBUG_HOSTNAME || '' }}
          INTERACTIVE_DEBUG_TUNNEL_TOKEN: ${{ inputs.session_mode != 'capture-only' && secrets.SGL_INTERACTIVE_DEBUG_TUNNEL_TOKEN || '' }}
          INTERACTIVE_MCP_PUBLIC_HOSTNAME: ${{ inputs.session_mode != 'capture-only' && secrets.SGL_INTERACTIVE_MCP_HOSTNAME || '' }}
          INTERACTIVE_SESSION_TIMEOUT_MINUTES: ${{ steps.session_plan.outputs.session_timeout_minutes }}
          INTERACTIVE_KEEP_SESSION_ON_FAILURE: ${{ steps.session_plan.outputs.keep_session_on_failure }}
          INTERACTIVE_EMULATOR_GRPC_PORT: ${{ env.INTERACTIVE_EMULATOR_GRPC_PORT }}
          INTERACTIVE_MCP_BIND_ADDR: ${{ env.INTERACTIVE_MCP_BIND_ADDR }}
          INTERACTIVE_SESSION_GITHUB_REPOSITORY: ${{ github.repository }}
          INTERACTIVE_SESSION_GITHUB_TOKEN: ${{ inputs.session_mode != 'capture-only' && github.token || '' }}

      - name: Ensure capture status exists
        if: ${{ always() && inputs.session_mode == 'capture-only' }}
        shell: bash
        env:
          CAPTURE_STEP_OUTCOME: ${{ steps.interactive_session.outcome }}
        run: |
          mkdir -p dist/interactive-capture
          if [[ ! -f dist/interactive-capture/status.json ]]; then
            printf '%s\n' '{"status":"failed","reason":"capture_not_completed","response_session_identity":"unknown"}' > dist/interactive-capture/status.json
          elif [[ "${CAPTURE_STEP_OUTCOME}" != "success" ]]; then
            python3 .github/scripts/capture_interactive_baseline.py --mark-failed
          fi

      - name: Upload curated stage inspection
        if: ${{ always() && inputs.session_mode == 'capture-only' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interactive-android-capture-${{ github.run_id }}
          if-no-files-found: error
          path: dist/interactive-capture/

      - name: Build interactive session summary payload
        if: ${{ always() && inputs.session_mode != 'capture-only' }}
        shell: bash
        env:
          ACTIVE_ARTIFACT_NAME: ${{ steps.active_build.outputs.artifact_name }}
          ACTIVE_RUN_ID: ${{ steps.active_build.outputs.build_run_id }}
          ACTIVE_COMMIT_SHA: ${{ steps.active_build.outputs.build_commit_sha }}
          ACTIVE_VALIDATION_MODE: ${{ steps.active_build.outputs.validation_mode }}
          ACTIVE_DEBUG_PROFILE: ${{ steps.active_build.outputs.debug_profile }}
          ACTIVE_GPU_BACKEND: ${{ steps.active_build.outputs.gpu_backend }}
        run: |
          set -euo pipefail
          mkdir -p dist/interactive-session-summary
          python3 .github/scripts/write_interactive_session_summary.py \
            --workflow interactive-android-session \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --checkout-ref "${{ steps.session_plan.outputs.checkout_ref }}" \
            --workflow-commit-sha "${{ github.sha }}" \
            --checkout-commit-sha "${{ steps.session_plan.outputs.commit_sha }}" \
            --build-source "${{ steps.session_plan.outputs.build_source }}" \
            --artifact-name "${ACTIVE_ARTIFACT_NAME}" \
            --build-run-id "${ACTIVE_RUN_ID}" \
            --build-commit-sha "${ACTIVE_COMMIT_SHA}" \
            --android-computer-use-mcp-pin "0e5a3dc692f39022fa84d88c927e4a59801673e4" \
            --android-computer-use-mcp-sha "${{ steps.interactive_mcp_revision.outputs.server_sha }}" \
            --mcp-toolkit-rs-sha "${{ steps.interactive_mcp_revision.outputs.toolkit_sha }}" \
            --android-validation-mode "${ACTIVE_VALIDATION_MODE}" \
            --interactive-debug-profile "${ACTIVE_DEBUG_PROFILE}" \
            --preferred-gpu-backend "${ACTIVE_GPU_BACKEND}" \
            --emulator-boot-strategy "${{ steps.session_plan.outputs.emulator_boot_strategy }}" \
            --session-timeout-minutes "${{ steps.session_plan.outputs.session_timeout_minutes }}" \
            --keep-session-on-failure "${{ steps.session_plan.outputs.keep_session_on_failure }}" \
            --job-result "${{ steps.interactive_session.outcome }}" \
            --artifacts-dir "${INTERACTIVE_SESSION_ROOT}" \
            --output-json dist/interactive-session-summary/interactive-session-summary.json \
            --output-md dist/interactive-session-summary/interactive-session-summary.md

      - name: Emit interactive session summary
        if: ${{ always() && inputs.session_mode != 'capture-only' }}
        shell: bash
        run: cat dist/interactive-session-summary/interactive-session-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload interactive session artifacts
        if: ${{ always() && inputs.session_mode != 'capture-only' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interactive-android-session-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/interactive-session/**
            dist/interactive-session-summary/**

      - name: Fail on action-required interactive session summary
        if: ${{ always() && inputs.session_mode != 'capture-only' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          summary_path = pathlib.Path("dist/interactive-session-summary/interactive-session-summary.json")
          if not summary_path.exists():
              print("interactive session summary is missing", file=sys.stderr)
              raise SystemExit(1)

          summary = json.loads(summary_path.read_text())
          status = summary.get("summary", {}).get("status")
          if status != "success":
              print(f"interactive session summary status is {status!r}", file=sys.stderr)
              raise SystemExit(1)
          PY
