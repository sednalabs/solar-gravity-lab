name: interactive-android-session

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to use for the interactive session
        required: false
        type: string
      build_source:
        description: Whether to reuse a remote-built artifact or assemble inline inside the session workflow
        required: true
        type: choice
        options:
          - artifact
          - inline
        default: artifact
      build_run_id:
        description: Optional interactive-android-build workflow run id to install into the live session
        required: false
        type: string
      artifact_name:
        description: Optional artifact name override for the reusable interactive APK bundle
        required: false
        type: string
      android_emulator_mcp_ref:
        description: Branch, tag, or commit from sednalabs/android-emulator-mcp
        required: true
        type: string
        default: 3740621bfde6e76bf11f08fc730982676a9df3e8
      mcp_toolkit_rs_ref:
        description: Branch, tag, or commit from GraciousGazelles/toolkits-mcp-toolkit-rs
        required: true
        type: string
        default: e5fffbd11480661e588cc03b6590726963986a95
      android_validation_mode:
        description: Which Android runtime posture to boot for live debugging
        required: true
        type: choice
        options:
          - shell-v2
          - stage-first-runtime
        default: stage-first-runtime
      interactive_debug_profile:
        description: Runtime posture for the hosted debug session
        required: true
        type: choice
        options:
          - hosted-debug-lite
          - full-fidelity
        default: hosted-debug-lite
      emulator_boot_strategy:
        description: Emulator startup strategy
        required: true
        type: choice
        options:
          - snapshot-cache
          - cold
        default: snapshot-cache
      session_timeout_minutes:
        description: Interactive session timeout window in minutes (30-180)
        required: true
        type: string
        default: "90"
      keep_session_on_failure:
        description: Keep the live session available when preflight fails
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  STANDALONE_GRADLE_CACHE_DIR: ~/.cache/standalone-gradle
  ANDROID_AVD_NAME: pixel_7_api35_google_apis_x86_64
  ANDROID_AVD_CACHE_VERSION: v3
  ANDROID_SDK_COMPONENT_CACHE_VERSION: v1
  ANDROID_SDK_ROOT_DEFAULT: /usr/local/lib/android/sdk
  ANDROID_PLATFORM_PACKAGE: "platforms;android-36"
  ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;36.0.0"
  ANDROID_SYSTEM_IMAGE_PACKAGE: "system-images;android-35;google_apis;x86_64"
  ANDROID_CMAKE_PACKAGE: "cmake;3.31.5"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_NDK_PACKAGE: "ndk;27.3.13750724"
  INTERACTIVE_EMULATOR_GRPC_PORT: "8554"
  INTERACTIVE_MCP_BIND_ADDR: 127.0.0.1:9526
  INTERACTIVE_DEBUG_TTYD_PORT: "7681"
  INTERACTIVE_SESSION_ROOT: dist/interactive-session
  INTERACTIVE_APP_PACKAGE: com.sednalabs.solarlab
  INTERACTIVE_APP_ACTIVITY: com.sednalabs.solarlab.MainActivity
  SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
  SCCACHE_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID != '' && secrets.SCCACHE_ACCESS_KEY_ID || secrets.R2_CACHE_ACCESS_KEY_ID }}
  SCCACHE_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY != '' && secrets.SCCACHE_SECRET_ACCESS_KEY || secrets.R2_CACHE_SECRET_ACCESS_KEY }}
  SCCACHE_CREDENTIAL_SOURCE: ${{ secrets.SCCACHE_ACCESS_KEY_ID != '' && 'dedicated-sccache-secrets' || 'shared-r2-secrets' }}

jobs:
  interactive-session:
    name: Hosted interactive Android emulator session
    runs-on: ubuntu-24.04
    env:
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USERNAME: ${{ vars.GRADLE_REMOTE_CACHE_USERNAME }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: "false"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}

      - name: Resolve interactive session plan
        id: session_plan
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BUILD_SOURCE: ${{ inputs.build_source }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          INPUT_MCP_REF: ${{ inputs.android_emulator_mcp_ref }}
          INPUT_TOOLKIT_REF: ${{ inputs.mcp_toolkit_rs_ref }}
          INPUT_VALIDATION_MODE: ${{ inputs.android_validation_mode }}
          INPUT_DEBUG_PROFILE: ${{ inputs.interactive_debug_profile }}
          INPUT_BOOT_STRATEGY: ${{ inputs.emulator_boot_strategy }}
          INPUT_TIMEOUT_MINUTES: ${{ inputs.session_timeout_minutes }}
          INPUT_KEEP_SESSION_ON_FAILURE: ${{ inputs.keep_session_on_failure }}
        run: |
          set -euo pipefail

          checkout_ref="${INPUT_REF:-}"
          if [[ -z "${checkout_ref}" ]]; then
            checkout_ref="${GITHUB_REF_NAME}"
          fi
          commit_sha="$(git rev-parse HEAD)"

          session_timeout_minutes="${INPUT_TIMEOUT_MINUTES:-90}"
          if ! [[ "${session_timeout_minutes}" =~ ^[0-9]+$ ]]; then
            echo "session_timeout_minutes must be an integer minute count" >&2
            exit 1
          fi
          if (( session_timeout_minutes < 30 )); then
            session_timeout_minutes=30
          fi
          if (( session_timeout_minutes > 180 )); then
            session_timeout_minutes=180
          fi

          debug_stage_first_client="true"
          preferred_gpu_backend="vulkan"
          hosted_debug_lite_mode="false"
          case "${INPUT_VALIDATION_MODE}" in
            shell-v2)
              debug_stage_first_client="false"
              preferred_gpu_backend="none"
              ;;
            stage-first-runtime)
              debug_stage_first_client="true"
              preferred_gpu_backend="vulkan"
              ;;
            *)
              echo "Unsupported android_validation_mode: ${INPUT_VALIDATION_MODE}" >&2
              exit 1
              ;;
          esac

          case "${INPUT_DEBUG_PROFILE}" in
            full-fidelity)
              hosted_debug_lite_mode="false"
              ;;
            hosted-debug-lite)
              hosted_debug_lite_mode="true"
              ;;
            *)
              echo "Unsupported interactive_debug_profile: ${INPUT_DEBUG_PROFILE}" >&2
              exit 1
              ;;
          esac

          build_source="${INPUT_BUILD_SOURCE:-artifact}"
          case "${build_source}" in
            artifact|inline)
              ;;
            *)
              echo "Unsupported build_source: ${build_source}" >&2
              exit 1
              ;;
          esac

          artifact_name="${INPUT_ARTIFACT_NAME:-}"
          if [[ -z "${artifact_name}" ]]; then
            artifact_name="interactive-android-build-${INPUT_VALIDATION_MODE}-${INPUT_DEBUG_PROFILE}"
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "commit_sha=${commit_sha}"
            echo "build_source=${build_source}"
            echo "build_run_id=${INPUT_BUILD_RUN_ID}"
            echo "artifact_name=${artifact_name}"
            echo "android_emulator_mcp_ref=${INPUT_MCP_REF}"
            echo "mcp_toolkit_rs_ref=${INPUT_TOOLKIT_REF}"
            echo "android_validation_mode=${INPUT_VALIDATION_MODE}"
            echo "interactive_debug_profile=${INPUT_DEBUG_PROFILE}"
            echo "emulator_boot_strategy=${INPUT_BOOT_STRATEGY}"
            echo "session_timeout_minutes=${session_timeout_minutes}"
            echo "keep_session_on_failure=${INPUT_KEEP_SESSION_ON_FAILURE}"
            echo "debug_stage_first_client=${debug_stage_first_client}"
            echo "preferred_gpu_backend=${preferred_gpu_backend}"
            echo "hosted_debug_lite_mode=${hosted_debug_lite_mode}"
          } >> "${GITHUB_OUTPUT}"

      - name: Initialize interactive session timing
        id: session_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "session_start_epoch=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        with:
          cache-read-only: true
          cache-cleanup: on-success
          add-job-summary: on-failure
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android emulator AVD cache
        id: avd-cache
        if: ${{ steps.session_plan.outputs.emulator_boot_strategy == 'snapshot-cache' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ env.ANDROID_AVD_NAME }}-${{ env.ANDROID_AVD_CACHE_VERSION }}

      - name: Restore Android SDK emulator packages cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/google_apis
          key: android-sdk-components-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_SDK_COMPONENT_CACHE_VERSION }}

      - name: Seed Android emulator snapshot
        if: ${{ steps.session_plan.outputs.emulator_boot_strategy == 'snapshot-cache' && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for ${ANDROID_AVD_NAME}."

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-interactive-android-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: interactive_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Install Android emulator runtime prerequisites
        id: android_sdk_runtime_install
        if: ${{ steps.session_plan.outputs.build_source == 'artifact' }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}"

      - name: Accept Android SDK licenses and install Android build toolchain
        id: android_sdk_build_install
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - name: Install Rust Android toolchain
        id: rust_android_toolchain
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          rustup target add aarch64-linux-android x86_64-linux-android
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk already available."
          else
            cargo install cargo-ndk --locked
          fi
          phase_end="$(date +%s)"
          echo "rust_android_toolchain_seconds=$((phase_end - phase_start))" >> "${GITHUB_OUTPUT}"

      - name: Install interactive live-access dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ttyd
          sudo systemctl disable --now ttyd.service >/dev/null 2>&1 || true
          sudo systemctl reset-failed ttyd.service >/dev/null 2>&1 || true
          sudo pkill -x ttyd >/dev/null 2>&1 || true
          mkdir -p "$HOME/.local/bin"
          bash .github/scripts/install_cloudflared.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Checkout android-emulator-mcp workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: sednalabs/android-emulator-mcp
          ref: ${{ steps.session_plan.outputs.android_emulator_mcp_ref }}
          token: ${{ secrets.SGL_ANDROID_EMULATOR_MCP_READ_TOKEN }}
          fetch-depth: 1
          path: mcp-workspace/servers/android-emulator-mcp

      - name: Checkout mcp-toolkit-rs workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: GraciousGazelles/toolkits-mcp-toolkit-rs
          ref: ${{ steps.session_plan.outputs.mcp_toolkit_rs_ref }}
          token: ${{ secrets.SGL_MCP_TOOLKIT_RS_READ_TOKEN }}
          fetch-depth: 1
          path: mcp-workspace/toolkits/mcp-toolkit-rs

      - name: Stage isolated MCP workspace
        id: stage_mcp_workspace
        shell: bash
        run: |
          set -euo pipefail
          isolated_root="${RUNNER_TEMP}/interactive-mcp-root"
          rm -rf "${isolated_root}"
          mkdir -p \
            "${isolated_root}/mcp-workspace/servers" \
            "${isolated_root}/mcp-workspace/toolkits"
          cp -a \
            mcp-workspace/servers/android-emulator-mcp \
            "${isolated_root}/mcp-workspace/servers/android-emulator-mcp"
          cp -a \
            mcp-workspace/toolkits/mcp-toolkit-rs \
            "${isolated_root}/mcp-workspace/toolkits/mcp-toolkit-rs"
          echo "server_dir=${isolated_root}/mcp-workspace/servers/android-emulator-mcp" >> "${GITHUB_OUTPUT}"

      - name: Resolve interactive MCP build cache inputs
        id: interactive_mcp_cache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "server_sha=$(git -C mcp-workspace/servers/android-emulator-mcp rev-parse HEAD)"
            echo "toolkit_sha=$(git -C mcp-workspace/toolkits/mcp-toolkit-rs rev-parse HEAD)"
            echo "rustc_release=$(rustc -Vv | awk '/^release: / { print $2 }')"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore android-emulator-mcp target cache
        id: interactive_mcp_target_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.stage_mcp_workspace.outputs.server_dir }}/target
          key: interactive-mcp-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.interactive_mcp_cache.outputs.rustc_release }}-${{ steps.interactive_mcp_cache.outputs.server_sha }}-${{ steps.interactive_mcp_cache.outputs.toolkit_sha }}

      - name: Download reusable interactive build artifact
        id: resolve_build_artifact
        if: ${{ steps.session_plan.outputs.build_source == 'artifact' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_dir="${INTERACTIVE_SESSION_ROOT}/build-cache"
          if [[ -n "${{ steps.session_plan.outputs.build_run_id }}" ]]; then
            output_dir="${output_dir}/run-${{ steps.session_plan.outputs.build_run_id }}/${{ steps.session_plan.outputs.artifact_name }}"
            python3 .github/scripts/download_interactive_build_artifact.py \
              --repository "${{ github.repository }}" \
              --workflow-run-id "${{ steps.session_plan.outputs.build_run_id }}" \
              --artifact-name "${{ steps.session_plan.outputs.artifact_name }}" \
              --output-dir "${output_dir}" \
              --expected-android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
              --expected-interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
              --expected-preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            output_dir="${output_dir}/run-search-${{ steps.session_plan.outputs.commit_sha }}/${{ steps.session_plan.outputs.artifact_name }}"
            python3 .github/scripts/download_interactive_build_artifact.py \
              --repository "${{ github.repository }}" \
              --workflow-file "interactive-android-build.yml" \
              --commit-sha "${{ steps.session_plan.outputs.commit_sha }}" \
              --artifact-name "${{ steps.session_plan.outputs.artifact_name }}" \
              --output-dir "${output_dir}" \
              --expected-android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
              --expected-interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
              --expected-preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Assemble debug APK for interactive session
        id: assemble_debug
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          ./gradlew -p clients/android \
            :app:assembleDebug \
            -Psolarlab.debugStageFirstClient=${{ steps.session_plan.outputs.debug_stage_first_client }} \
            -Psolarlab.preferredGpuBackend=${{ steps.session_plan.outputs.preferred_gpu_backend }} \
            -Psolarlab.hostedDebugProfile=${{ steps.session_plan.outputs.interactive_debug_profile }}
          phase_end="$(date +%s)"
          echo "assemble_seconds=$((phase_end - phase_start))" >> "${GITHUB_OUTPUT}"

      - name: Derive debug APK metadata
        id: apk_meta
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("clients/android/app/build/outputs/apk/debug/output-metadata.json").read_text()
          )
          element = metadata["elements"][0]
          version_name = element["versionName"]
          safe_version = "".join(
              ch if ch.isalnum() or ch in "._-" else "-"
              for ch in version_name
          )
          print(f"apk_name={element['outputFile']}")
          print(f"version_name={version_name}")
          print(f"safe_version={safe_version}")
          PY

      - name: Stage inline interactive build bundle
        id: stage_inline_build
        if: ${{ steps.session_plan.outputs.build_source == 'inline' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/stage_interactive_build_bundle.py \
            --apk-path "clients/android/app/build/outputs/apk/debug/${{ steps.apk_meta.outputs.apk_name }}" \
            --output-dir "${INTERACTIVE_SESSION_ROOT}/build-cache/run-${{ github.run_id }}/${{ steps.session_plan.outputs.artifact_name }}" \
            --artifact-name "${{ steps.session_plan.outputs.artifact_name }}" \
            --repository "${{ github.repository }}" \
            --workflow "interactive-android-session" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --checkout-ref "${{ steps.session_plan.outputs.checkout_ref }}" \
            --commit-sha "${{ steps.session_plan.outputs.commit_sha }}" \
            --android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
            --interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
            --preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
            --package-name "${INTERACTIVE_APP_PACKAGE}" \
            --activity-name "${INTERACTIVE_APP_ACTIVITY}" \
            --version-name "${{ steps.apk_meta.outputs.version_name }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Resolve interactive build inputs
        id: active_build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.session_plan.outputs.build_source }}" == "artifact" ]]; then
            {
              echo "artifact_name=${{ steps.resolve_build_artifact.outputs.artifact_name }}"
              echo "build_run_id=${{ steps.resolve_build_artifact.outputs.build_run_id }}"
              echo "build_run_attempt=${{ steps.resolve_build_artifact.outputs.build_run_attempt }}"
              echo "build_commit_sha=${{ steps.resolve_build_artifact.outputs.build_commit_sha }}"
              echo "bundle_dir=${{ steps.resolve_build_artifact.outputs.bundle_dir }}"
              echo "manifest_path=${{ steps.resolve_build_artifact.outputs.manifest_path }}"
              echo "apk_path=${{ steps.resolve_build_artifact.outputs.apk_path }}"
              echo "apk_sha256=${{ steps.resolve_build_artifact.outputs.apk_sha256 }}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "artifact_name=${{ steps.stage_inline_build.outputs.artifact_name }}"
              echo "build_run_id=${{ github.run_id }}"
              echo "build_run_attempt=${{ github.run_attempt }}"
              echo "build_commit_sha=${{ steps.session_plan.outputs.commit_sha }}"
              echo "bundle_dir=${{ steps.stage_inline_build.outputs.bundle_dir }}"
              echo "manifest_path=${{ steps.stage_inline_build.outputs.manifest_path }}"
              echo "apk_path=${{ steps.stage_inline_build.outputs.apk_path }}"
              echo "apk_sha256=${{ steps.stage_inline_build.outputs.apk_sha256 }}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate android-emulator-mcp provider contracts
        shell: bash
        working-directory: ${{ steps.stage_mcp_workspace.outputs.server_dir }}
        run: |
          set -euo pipefail
          cargo test --locked -- --test-threads=1

      - name: Build android-emulator-mcp release binary
        id: build_mcp
        shell: bash
        working-directory: ${{ steps.stage_mcp_workspace.outputs.server_dir }}
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          cargo build --release --locked
          phase_end="$(date +%s)"
          echo "build_seconds=$((phase_end - phase_start))" >> "${GITHUB_OUTPUT}"

      - name: Emit interactive bootstrap summary
        shell: bash
        run: |
          {
            echo "## interactive bootstrap"
            echo "- build source: \`${{ steps.session_plan.outputs.build_source }}\`"
            echo "- Android build setup: \`${{ steps.session_plan.outputs.build_source == 'inline' && 'enabled' || 'skipped' }}\`"
            echo "- Rust Android toolchain: \`${{ steps.session_plan.outputs.build_source == 'inline' && 'enabled' || 'skipped' }}\`"
            echo "- android-emulator-mcp cache reuse: \`${{ steps.interactive_mcp_target_cache.outputs.cache-hit == 'true' && 'reused' || 'rebuilt' }}\`"
            echo "- android-emulator-mcp provider contracts: \`passed\`"
            echo "- android-emulator-mcp build completed: \`true\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run hosted interactive Android session
        id: interactive_session
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: ${{ steps.session_plan.outputs.emulator_boot_strategy == 'snapshot-cache' && 'false' || 'true' }}
          emulator-options: -grpc ${{ env.INTERACTIVE_EMULATOR_GRPC_PORT }} -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run_interactive_android_session.sh
        env:
          INTERACTIVE_APP_APK: ${{ steps.active_build.outputs.apk_path }}
          INTERACTIVE_BUILD_MANIFEST: ${{ steps.active_build.outputs.manifest_path }}
          INTERACTIVE_APP_PACKAGE: ${{ env.INTERACTIVE_APP_PACKAGE }}
          INTERACTIVE_APP_ACTIVITY: ${{ env.INTERACTIVE_APP_ACTIVITY }}
          INTERACTIVE_MCP_WORKSPACE_DIR: ${{ steps.stage_mcp_workspace.outputs.server_dir }}
          INTERACTIVE_MCP_ADAPTER_REVISION: ${{ steps.interactive_mcp_cache.outputs.server_sha }}
          INTERACTIVE_CLOUDFLARED_BIN: cloudflared
          INTERACTIVE_TTYD_BIN: /usr/bin/ttyd
          INTERACTIVE_DEBUG_HOSTNAME: ${{ secrets.SGL_INTERACTIVE_DEBUG_HOSTNAME }}
          INTERACTIVE_DEBUG_TUNNEL_TOKEN: ${{ secrets.SGL_INTERACTIVE_DEBUG_TUNNEL_TOKEN }}
          INTERACTIVE_MCP_PUBLIC_HOSTNAME: ${{ secrets.SGL_INTERACTIVE_MCP_HOSTNAME }}
          INTERACTIVE_SESSION_TIMEOUT_MINUTES: ${{ steps.session_plan.outputs.session_timeout_minutes }}
          INTERACTIVE_KEEP_SESSION_ON_FAILURE: ${{ steps.session_plan.outputs.keep_session_on_failure }}
          INTERACTIVE_EMULATOR_GRPC_PORT: ${{ env.INTERACTIVE_EMULATOR_GRPC_PORT }}
          INTERACTIVE_MCP_BIND_ADDR: ${{ env.INTERACTIVE_MCP_BIND_ADDR }}
          INTERACTIVE_SESSION_GITHUB_REPOSITORY: ${{ github.repository }}
          INTERACTIVE_SESSION_GITHUB_TOKEN: ${{ github.token }}

      - name: Build interactive session summary payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/interactive-session-summary
          python3 .github/scripts/write_interactive_session_summary.py \
            --workflow interactive-android-session \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --checkout-ref "${{ steps.session_plan.outputs.checkout_ref }}" \
            --build-source "${{ steps.session_plan.outputs.build_source }}" \
            --artifact-name "${{ steps.active_build.outputs.artifact_name }}" \
            --build-run-id "${{ steps.active_build.outputs.build_run_id }}" \
            --build-commit-sha "${{ steps.active_build.outputs.build_commit_sha }}" \
            --android-emulator-mcp-ref "${{ steps.session_plan.outputs.android_emulator_mcp_ref }}" \
            --mcp-toolkit-rs-ref "${{ steps.session_plan.outputs.mcp_toolkit_rs_ref }}" \
            --android-validation-mode "${{ steps.session_plan.outputs.android_validation_mode }}" \
            --interactive-debug-profile "${{ steps.session_plan.outputs.interactive_debug_profile }}" \
            --preferred-gpu-backend "${{ steps.session_plan.outputs.preferred_gpu_backend }}" \
            --emulator-boot-strategy "${{ steps.session_plan.outputs.emulator_boot_strategy }}" \
            --session-timeout-minutes "${{ steps.session_plan.outputs.session_timeout_minutes }}" \
            --keep-session-on-failure "${{ steps.session_plan.outputs.keep_session_on_failure }}" \
            --job-result "${{ steps.interactive_session.outcome }}" \
            --artifacts-dir "${INTERACTIVE_SESSION_ROOT}" \
            --output-json dist/interactive-session-summary/interactive-session-summary.json \
            --output-md dist/interactive-session-summary/interactive-session-summary.md

      - name: Emit interactive session summary
        if: always()
        shell: bash
        run: cat dist/interactive-session-summary/interactive-session-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload interactive session artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interactive-android-session-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/interactive-session/**
            dist/interactive-session-summary/**

      - name: Fail on action-required interactive session summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          summary_path = pathlib.Path("dist/interactive-session-summary/interactive-session-summary.json")
          if not summary_path.exists():
              print("interactive session summary is missing", file=sys.stderr)
              raise SystemExit(1)

          summary = json.loads(summary_path.read_text())
          status = summary.get("summary", {}).get("status")
          if status != "success":
              print(f"interactive session summary status is {status!r}", file=sys.stderr)
              raise SystemExit(1)
          PY
