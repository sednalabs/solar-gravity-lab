name: rust-nextest-archive-pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-nextest-archive-pilot-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nextest-archive:
    name: Build nextest archive
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ github.ref_name }}
      head_sha: ${{ steps.git_meta.outputs.head_sha }}
      archive_bytes: ${{ steps.archive.outputs.archive_bytes }}
      archive_seconds: ${{ steps.archive.outputs.archive_seconds }}
      rust_cache_hit: ${{ steps.rust_shared_cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve checkout metadata
        id: git_meta
        shell: bash
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - id: rust_shared_cache
        uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-nextest-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419
        with:
          tool: nextest@0.9.128
          fallback: none

      - name: Build workspace nextest archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nextest
          archive_file="dist/nextest/solarlab-rust-workspace.tar.zst"
          phase_start="$(date +%s)"
          cargo nextest archive \
            --workspace \
            --archive-file "${archive_file}"
          phase_end="$(date +%s)"
          archive_bytes="$(wc -c < "${archive_file}")"
          {
            echo "archive_seconds=$((phase_end - phase_start))"
            echo "archive_bytes=${archive_bytes}"
          } >> "$GITHUB_OUTPUT"
          du -h "${archive_file}"

      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: solarlab-rust-nextest-archive-${{ github.run_id }}
          if-no-files-found: error
          path: dist/nextest/solarlab-rust-workspace.tar.zst

  nextest-run:
    name: Run archived tests
    needs: nextest-archive
    runs-on: ubuntu-24.04
    outputs:
      run_seconds: ${{ steps.run_nextest.outputs.run_seconds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419
        with:
          tool: nextest@0.9.128
          fallback: none

      - name: Download nextest archive
        uses: actions/download-artifact@v8
        with:
          name: solarlab-rust-nextest-archive-${{ github.run_id }}
          path: dist/nextest

      - name: Run archived workspace tests
        id: run_nextest
        shell: bash
        env:
          RUST_BACKTRACE: 1
        run: |
          set +e
          mkdir -p dist/nextest
          archive_file="dist/nextest/solarlab-rust-workspace.tar.zst"
          phase_start="$(date +%s)"
          cargo nextest run \
            --archive-file "${archive_file}" \
            --workspace-remap "$PWD" \
            --no-fail-fast \
            2>&1 | tee dist/nextest/nextest-run.log
          status=${PIPESTATUS[0]}
          phase_end="$(date +%s)"
          {
            echo "run_seconds=$((phase_end - phase_start))"
            echo "exit_status=${status}"
          } >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Upload nextest run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solarlab-rust-nextest-run-${{ github.run_id }}
          if-no-files-found: warn
          path: dist/nextest/nextest-run.log

  doctests:
    name: Measure doctests separately
    needs: nextest-archive
    runs-on: ubuntu-24.04
    outputs:
      doctest_seconds: ${{ steps.doctest.outputs.doctest_seconds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - id: doctest_rust_shared_cache
        uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-nextest-${{ runner.os }}-${{ runner.arch }}

      - name: Run workspace doctests
        id: doctest
        shell: bash
        run: |
          set +e
          mkdir -p dist/nextest
          phase_start="$(date +%s)"
          cargo test --workspace --doc 2>&1 | tee dist/nextest/doctest.log
          status=${PIPESTATUS[0]}
          phase_end="$(date +%s)"
          {
            echo "doctest_seconds=$((phase_end - phase_start))"
            echo "exit_status=${status}"
          } >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Upload doctest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solarlab-rust-nextest-doctest-${{ github.run_id }}
          if-no-files-found: warn
          path: dist/nextest/doctest.log

  summary:
    name: Publish nextest pilot summary
    needs:
      - nextest-archive
      - nextest-run
      - doctests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Build nextest pilot summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nextest-summary
          cat > dist/nextest-summary/summary.json <<JSON
          {
            "workflow": "rust-nextest-archive-pilot",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "checkout_ref": "${{ needs.nextest-archive.outputs.checkout_ref }}",
            "head_sha": "${{ needs.nextest-archive.outputs.head_sha }}",
            "jobs": {
              "nextest_archive": "${{ needs.nextest-archive.result }}",
              "nextest_run": "${{ needs.nextest-run.result }}",
              "doctests": "${{ needs.doctests.result }}"
            },
            "timings": {
              "archive_seconds": "${{ needs.nextest-archive.outputs.archive_seconds }}",
              "run_seconds": "${{ needs.nextest-run.outputs.run_seconds }}",
              "doctest_seconds": "${{ needs.doctests.outputs.doctest_seconds }}"
            },
            "cache": {
              "rust_shared_cache_hit": "${{ needs.nextest-archive.outputs.rust_cache_hit }}"
            },
            "archive": {
              "bytes": "${{ needs.nextest-archive.outputs.archive_bytes }}"
            }
          }
          JSON
          {
            echo "## rust-nextest-archive-pilot"
            echo "- ref: \`${{ needs.nextest-archive.outputs.checkout_ref }}\`"
            echo "- head: \`${{ needs.nextest-archive.outputs.head_sha }}\`"
            echo "- archive job: \`${{ needs.nextest-archive.result }}\`"
            echo "- run job: \`${{ needs.nextest-run.result }}\`"
            echo "- doctests: \`${{ needs.doctests.result }}\`"
            echo "- archive seconds: \`${{ needs.nextest-archive.outputs.archive_seconds || 'n/a' }}\`"
            echo "- run seconds: \`${{ needs.nextest-run.outputs.run_seconds || 'n/a' }}\`"
            echo "- doctest seconds: \`${{ needs.doctests.outputs.doctest_seconds || 'n/a' }}\`"
            echo "- archive bytes: \`${{ needs.nextest-archive.outputs.archive_bytes || 'n/a' }}\`"
            echo "- rust shared cache hit: \`${{ needs.nextest-archive.outputs.rust_cache_hit || 'false' }}\`"
          } | tee dist/nextest-summary/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nextest pilot summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solarlab-rust-nextest-summary-${{ github.run_id }}
          if-no-files-found: error
          path: dist/nextest-summary/**

      - name: Verify nextest pilot result
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ needs.nextest-archive.result }}' == 'success' ]] || exit 1
          [[ '${{ needs.nextest-run.result }}' == 'success' ]] || exit 1
          [[ '${{ needs.doctests.result }}' == 'success' ]] || exit 1
