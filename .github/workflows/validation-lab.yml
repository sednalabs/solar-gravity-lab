name: validation-lab

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "clients/android/**"
      - "engine/**"
      - "feature-lab/**"
      - "labs/**"
      - "proto/**"
      - "render/**"
      - "render-core/**"
      - "core-math/**"
      - "core-model/**"
      - "core-simulation/**"
      - "services/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: false
        type: string
      profile:
        description: Validation profile
        required: true
        type: choice
        options:
          - targeted
          - frontier
          - broad
          - full
        default: targeted
      lane_set:
        description: Which lane bundle to run
        required: true
        type: choice
        options:
          - auto
          - bootstrap
          - rust-workspace
          - rust-workspace-arm64
          - ffi-abi
          - android-unit
          - android-lint
          - android-shell
          - runtime-scene-telemetry
          - full
        default: auto
      write_wrapper:
        description: Commit generated wrapper files back to the branch
        required: true
        type: boolean
        default: false
      android_test_scope:
        description: Android instrumentation suite scope
        required: true
        type: choice
        options:
          - core
          - full
        default: core
      android_validation_mode:
        description: Android validation mode or matrix selection
        required: true
        type: choice
        options:
          - auto
          - shell-v2
          - stage-first-mirror-off
          - stage-first-mirror-on
        default: auto
      android_artifact_mode:
        description: Android artifact capture mode
        required: true
        type: choice
        options:
          - failures-only
          - always
        default: failures-only
      emulator_boot_strategy:
        description: Emulator startup strategy
        required: true
        type: choice
        options:
          - cold
          - snapshot-cache
        default: cold

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STANDALONE_GRADLE_CACHE_DIR: ~/.cache/standalone-gradle
  ANDROID_AVD_NAME: pixel_7_api35_google_apis_x86_64
  ANDROID_AVD_CACHE_VERSION: v3
  ANDROID_SDK_COMPONENT_CACHE_VERSION: v1
  ANDROID_SDK_ROOT_DEFAULT: /usr/local/lib/android/sdk
  ANDROID_PLATFORM_PACKAGE: "platforms;android-36"
  ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;36.0.0"
  ANDROID_SYSTEM_IMAGE_PACKAGE: "system-images;android-35;google_apis;x86_64"
  ANDROID_CMAKE_PACKAGE: "cmake;3.31.5"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_NDK_PACKAGE: "ndk;27.3.13750724"
  SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}

jobs:
  metadata:
    name: Resolve validation plan
    runs-on: ubuntu-24.04
    outputs:
      checkout_repository: ${{ steps.plan.outputs.checkout_repository }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      profile: ${{ steps.plan.outputs.profile }}
      lane_set: ${{ steps.plan.outputs.lane_set }}
      android_test_scope: ${{ steps.plan.outputs.android_test_scope }}
      android_validation_mode: ${{ steps.plan.outputs.android_validation_mode }}
      android_artifact_mode: ${{ steps.plan.outputs.android_artifact_mode }}
      emulator_boot_strategy: ${{ steps.plan.outputs.emulator_boot_strategy }}
      gradle_cache_push: ${{ steps.plan.outputs.gradle_cache_push }}
      gradle_cache_read_only: ${{ steps.plan.outputs.gradle_cache_read_only }}
      profile_intent: ${{ steps.plan.outputs.profile_intent }}
      profile_notes: ${{ steps.plan.outputs.profile_notes }}
      wrapper_bootstrap: ${{ steps.plan.outputs.wrapper_bootstrap }}
      rust_workspace: ${{ steps.plan.outputs.rust_workspace }}
      rust_workspace_arm64: ${{ steps.plan.outputs.rust_workspace_arm64 }}
      ffi_abi: ${{ steps.plan.outputs.ffi_abi }}
      android_unit: ${{ steps.plan.outputs.android_unit }}
      android_lint: ${{ steps.plan.outputs.android_lint }}
      android_shell: ${{ steps.plan.outputs.android_shell }}
      android_shell_matrix: ${{ steps.plan.outputs.android_shell_matrix }}
      runtime_scene_telemetry: ${{ steps.plan.outputs.runtime_scene_telemetry }}
      lane_summary: ${{ steps.plan.outputs.lane_summary }}
    steps:
      - name: Compute active lanes
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          checkout_ref='${{ inputs.ref }}'
          checkout_repository='${{ github.repository }}'
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            checkout_ref='${{ github.event.pull_request.head.sha }}'
            checkout_repository='${{ github.event.pull_request.head.repo.full_name }}'
          elif [[ -z "$checkout_ref" ]]; then
            checkout_ref='${{ github.ref_name }}'
          fi

          profile='${{ inputs.profile }}'
          if [[ -z "$profile" ]]; then
            if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
              profile='full'
            else
              profile='targeted'
            fi
          fi
          lane_set='${{ inputs.lane_set }}'
          if [[ -z "$lane_set" ]]; then
            if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
              lane_set='full'
            else
              lane_set='auto'
            fi
          fi
          write_wrapper='${{ inputs.write_wrapper }}'
          if [[ -z "$write_wrapper" ]]; then
            write_wrapper='false'
          fi
          android_test_scope='${{ inputs.android_test_scope }}'
          if [[ -z "$android_test_scope" ]]; then
            android_test_scope='core'
          fi
          android_validation_mode='${{ inputs.android_validation_mode }}'
          if [[ -z "$android_validation_mode" ]]; then
            android_validation_mode='auto'
          fi
          android_artifact_mode='${{ inputs.android_artifact_mode }}'
          if [[ -z "$android_artifact_mode" ]]; then
            android_artifact_mode='failures-only'
          fi
          emulator_boot_strategy='${{ inputs.emulator_boot_strategy }}'
          if [[ -z "$emulator_boot_strategy" ]]; then
            emulator_boot_strategy='cold'
          fi

          gradle_cache_push='false'
          gradle_cache_read_only='true'
          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then
            case "$checkout_ref" in
              main|refs/heads/main|release/*|refs/heads/release/*|validation/*|refs/heads/validation/*)
                gradle_cache_push='true'
                gradle_cache_read_only='false'
                ;;
            esac
          fi

          wrapper_bootstrap='false'
          rust_workspace='false'
          rust_workspace_arm64='false'
          ffi_abi='false'
          android_unit='false'
          android_lint='false'
          android_shell='false'
          runtime_scene_telemetry='false'
          profile_intent='targeted'
          profile_notes='One active slice only; use this to prove the current canonical seam before widening.'
          android_shell_matrix='[]'

          case "$profile" in
            targeted)
              profile_intent='targeted'
              profile_notes='One active slice only; use this to prove the current canonical seam before widening.'
              ;;
            frontier)
              profile_intent='frontier'
              profile_notes='Bounded next-blocker harvest; keep the Rust baseline and add the Android shell when appropriate.'
              ;;
            broad|full)
              profile_intent='checkpoint'
              profile_notes='Explicit checkpoint mode; use sparingly for milestone passes rather than routine iteration.'
              ;;
            *)
              echo "Unknown profile: ${profile}" >&2
              exit 1
              ;;
          esac

          case "$lane_set" in
            auto)
              rust_workspace='true'
              if [[ "$profile" == 'frontier' || "$profile" == 'broad' || "$profile" == 'full' ]]; then
                android_shell='true'
              fi
              if [[ "$profile" == 'broad' || "$profile" == 'full' ]]; then
                ffi_abi='true'
                rust_workspace_arm64='true'
                android_unit='true'
                android_lint='true'
              fi
              ;;
            bootstrap)
              wrapper_bootstrap='true'
              ;;
            rust-workspace)
              rust_workspace='true'
              ;;
            rust-workspace-arm64)
              rust_workspace_arm64='true'
              ;;
            ffi-abi)
              ffi_abi='true'
              ;;
            android-unit)
              android_unit='true'
              ;;
            android-lint)
              android_lint='true'
              ;;
            android-shell)
              android_shell='true'
              ;;
            runtime-scene-telemetry)
              runtime_scene_telemetry='true'
              ;;
            full)
              rust_workspace='true'
              rust_workspace_arm64='true'
              ffi_abi='true'
              android_unit='true'
              android_lint='true'
              android_shell='true'
              runtime_scene_telemetry='true'
              ;;
            *)
              echo "Unknown lane_set: ${lane_set}" >&2
              exit 1
              ;;
          esac

          if [[ "$write_wrapper" == 'true' ]]; then
            wrapper_bootstrap='true'
          fi

          if [[ "$android_shell" == 'true' ]]; then
            case "$android_validation_mode" in
              shell-v2)
                android_shell_matrix='[{"validation_mode":"shell-v2","debug_stage_first_client":"false","stage_first_runtime_mirror":"false"}]'
                ;;
              stage-first-mirror-off)
                android_shell_matrix='[{"validation_mode":"stage-first-mirror-off","debug_stage_first_client":"true","stage_first_runtime_mirror":"false"}]'
                ;;
              stage-first-mirror-on)
                android_shell_matrix='[{"validation_mode":"stage-first-mirror-on","debug_stage_first_client":"true","stage_first_runtime_mirror":"true"}]'
                ;;
              auto)
                if [[ "$android_test_scope" == 'full' ]]; then
                  android_shell_matrix='[{"validation_mode":"shell-v2","debug_stage_first_client":"false","stage_first_runtime_mirror":"false"}]'
                else
                  case "$profile" in
                    targeted)
                      android_shell_matrix='[{"validation_mode":"stage-first-mirror-on","debug_stage_first_client":"true","stage_first_runtime_mirror":"true"}]'
                      ;;
                    frontier)
                      android_shell_matrix='[{"validation_mode":"shell-v2","debug_stage_first_client":"false","stage_first_runtime_mirror":"false"},{"validation_mode":"stage-first-mirror-on","debug_stage_first_client":"true","stage_first_runtime_mirror":"true"}]'
                      ;;
                    broad|full)
                      android_shell_matrix='[{"validation_mode":"shell-v2","debug_stage_first_client":"false","stage_first_runtime_mirror":"false"},{"validation_mode":"stage-first-mirror-off","debug_stage_first_client":"true","stage_first_runtime_mirror":"false"},{"validation_mode":"stage-first-mirror-on","debug_stage_first_client":"true","stage_first_runtime_mirror":"true"}]'
                      ;;
                    *)
                      echo "Unknown profile for android shell matrix: ${profile}" >&2
                      exit 1
                      ;;
                  esac
                fi
                ;;
              *)
                echo "Unknown android_validation_mode: ${android_validation_mode}" >&2
                exit 1
                ;;
            esac
          fi

          lane_summary="$(printf 'intent=%s, wrapper_bootstrap=%s, rust_workspace=%s, rust_workspace_arm64=%s, ffi_abi=%s, android_unit=%s, android_lint=%s, android_shell=%s, runtime_scene_telemetry=%s, android_validation_mode=%s' \
            "$profile_intent" "$wrapper_bootstrap" "$rust_workspace" "$rust_workspace_arm64" "$ffi_abi" "$android_unit" "$android_lint" "$android_shell" "$runtime_scene_telemetry" "$android_validation_mode")"

          echo "checkout_repository=${checkout_repository}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "lane_set=${lane_set}" >> "$GITHUB_OUTPUT"
          echo "android_test_scope=${android_test_scope}" >> "$GITHUB_OUTPUT"
          echo "android_validation_mode=${android_validation_mode}" >> "$GITHUB_OUTPUT"
          echo "android_artifact_mode=${android_artifact_mode}" >> "$GITHUB_OUTPUT"
          echo "emulator_boot_strategy=${emulator_boot_strategy}" >> "$GITHUB_OUTPUT"
          echo "gradle_cache_push=${gradle_cache_push}" >> "$GITHUB_OUTPUT"
          echo "gradle_cache_read_only=${gradle_cache_read_only}" >> "$GITHUB_OUTPUT"
          echo "profile_intent=${profile_intent}" >> "$GITHUB_OUTPUT"
          echo "profile_notes=${profile_notes}" >> "$GITHUB_OUTPUT"
          echo "wrapper_bootstrap=${wrapper_bootstrap}" >> "$GITHUB_OUTPUT"
          echo "rust_workspace=${rust_workspace}" >> "$GITHUB_OUTPUT"
          echo "rust_workspace_arm64=${rust_workspace_arm64}" >> "$GITHUB_OUTPUT"
          echo "ffi_abi=${ffi_abi}" >> "$GITHUB_OUTPUT"
          echo "android_unit=${android_unit}" >> "$GITHUB_OUTPUT"
          echo "android_lint=${android_lint}" >> "$GITHUB_OUTPUT"
          echo "android_shell=${android_shell}" >> "$GITHUB_OUTPUT"
          echo "android_shell_matrix=${android_shell_matrix}" >> "$GITHUB_OUTPUT"
          echo "runtime_scene_telemetry=${runtime_scene_telemetry}" >> "$GITHUB_OUTPUT"
          echo "lane_summary=${lane_summary}" >> "$GITHUB_OUTPUT"

  wrapper-bootstrap:
    name: Wrapper bootstrap
    needs: metadata
    if: ${{ needs.metadata.outputs.wrapper_bootstrap == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore standalone Gradle cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STANDALONE_GRADLE_CACHE_DIR }}
          key: standalone-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup standalone Gradle
        shell: bash
        run: ./.github/scripts/setup-standalone-gradle.sh "$PWD"

      - name: Generate Gradle wrapper files
        shell: bash
        run: |
          set -euo pipefail
          "${STANDALONE_GRADLE}" --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          git status --short

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@v7
        with:
          name: gradle-wrapper-${{ github.run_id }}
          if-no-files-found: error
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.properties
            gradle/wrapper/gradle-wrapper.jar

      - name: Commit wrapper files back to branch
        if: ${{ inputs.write_wrapper }}
        shell: bash
        run: |
          set -euo pipefail

          checkout_ref='${{ needs.metadata.outputs.checkout_ref }}'
          if [[ "$checkout_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refuses to push wrapper files back to a detached SHA ref: ${checkout_ref}" >&2
            exit 1
          fi

          branch_name="$checkout_ref"
          if [[ "$branch_name" == refs/heads/* ]]; then
            branch_name="${branch_name#refs/heads/}"
          fi
          if [[ "$branch_name" == refs/tags/* ]]; then
            echo "Refuses to push wrapper files back to a tag ref: ${checkout_ref}" >&2
            exit 1
          fi

          git checkout -B "$branch_name"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar

          if git diff --cached --quiet; then
            echo "No wrapper changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Gradle wrapper jar"
          git push origin "HEAD:${branch_name}"

  parity-matrix:
    name: Validate parity matrix
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Validate parity matrix schema
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_parity_matrix.py labs/parity/matrix.json

  rust-workspace:
    name: Rust workspace tests
    needs: metadata
    if: ${{ needs.metadata.outputs.rust_workspace == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: rust_workspace_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run canonical workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace

      - name: Emit rust workspace sccache stats
        if: always() && steps.rust_workspace_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/rust-workspace.txt
          {
            echo "## rust-workspace sccache"
            cat dist/sccache/rust-workspace.txt
          } >> "$GITHUB_STEP_SUMMARY"

  rust-workspace-arm64:
    name: Rust workspace tests (Arm64)
    needs: metadata
    if: ${{ needs.metadata.outputs.rust_workspace_arm64 == 'true' }}
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: rust_workspace_arm64_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run canonical workspace tests on Arm64
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace

      - name: Emit rust workspace arm64 sccache stats
        if: always() && steps.rust_workspace_arm64_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/rust-workspace-arm64.txt
          {
            echo "## rust-workspace-arm64 sccache"
            cat dist/sccache/rust-workspace-arm64.txt
          } >> "$GITHUB_STEP_SUMMARY"

  ffi-abi:
    name: FFI ABI tests
    needs: metadata
    if: ${{ needs.metadata.outputs.ffi_abi == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: ffi_abi_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run focused FFI ABI tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p solarlab-ffi

      - name: Emit FFI ABI sccache stats
        if: always() && steps.ffi_abi_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/ffi-abi.txt
          {
            echo "## ffi-abi sccache"
            cat dist/sccache/ffi-abi.txt
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-scene-telemetry:
    name: Runtime scene + telemetry tests
    needs: metadata
    if: ${{ needs.metadata.outputs.runtime_scene_telemetry == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: runtime_scene_telemetry_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run focused runtime scene + telemetry tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p solarlab-runtime --lib render_scene
          cargo test -p solarlab-runtime --lib telemetry

      - name: Emit runtime scene sccache stats
        if: always() && steps.runtime_scene_telemetry_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/runtime-scene-telemetry.txt
          {
            echo "## runtime-scene-telemetry sccache"
            cat dist/sccache/runtime-scene-telemetry.txt
          } >> "$GITHUB_STEP_SUMMARY"

  android-unit:
    name: Android JVM and host-side unit tests
    needs: metadata
    if: ${{ needs.metadata.outputs.android_unit == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USERNAME: ${{ vars.GRADLE_REMOTE_CACHE_USERNAME }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: ${{ needs.metadata.outputs.gradle_cache_push }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Initialize Android unit lane timing
        id: android_unit_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "lane_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ needs.metadata.outputs.gradle_cache_read_only == 'true' }}
          cache-cleanup: on-success
          add-job-summary: on-failure
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Accept Android SDK licenses and install build toolchain
        id: android_unit_sdk_install
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-android-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: android_unit_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Install Rust Android toolchain
        id: android_unit_rust_android_toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android x86_64-linux-android
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk already available."
          else
            cargo install cargo-ndk --locked
          fi

      - name: Run Android host-side unit suites
        id: android_unit_tests
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          ./gradlew -p clients/android \
            :app:testDebugUnitTest \
            :feature-lab:testDebugUnitTest \
            :render-core:test \
            :core-math:test \
            :core-model:test \
            :core-simulation:test
          phase_end="$(date +%s)"
          echo "unit_seconds=$((phase_end - phase_start))" >> "$GITHUB_OUTPUT"

      - name: Emit Android unit timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_end_epoch="$(date +%s)"
          lane_start_epoch="${{ steps.android_unit_timing.outputs.lane_start_epoch }}"
          lane_total="$((lane_end_epoch - lane_start_epoch))"
          {
            echo "## android-unit timings"
            echo "- sdk setup: \`${{ steps.android_unit_sdk_install.outputs.sdk_setup_seconds || 'n/a' }}s\`"
            echo "- unit suites: \`${{ steps.android_unit_tests.outputs.unit_seconds || 'n/a' }}s\`"
            echo "- lane total: \`${lane_total}s\`"
            echo "- remote gradle cache push: \`${{ env.GRADLE_REMOTE_CACHE_PUSH }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit Android unit sccache stats
        if: always() && steps.android_unit_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/android-unit.txt
          {
            echo "## android-unit sccache"
            cat dist/sccache/android-unit.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android unit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            clients/android/app/build/reports/tests/**
            feature-lab/build/reports/tests/**
            render-core/build/reports/tests/**
            core-math/build/reports/tests/**
            core-model/build/reports/tests/**
            core-simulation/build/reports/tests/**
            clients/android/app/build/test-results/**
            feature-lab/build/test-results/**
            render-core/build/test-results/**
            core-math/build/test-results/**
            core-model/build/test-results/**
            core-simulation/build/test-results/**
            dist/sccache/**

