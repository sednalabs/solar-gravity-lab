  android-unit:
    name: Android JVM and host-side unit tests
    needs: metadata
    if: ${{ needs.metadata.outputs.android_unit == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gradle_configuration_cache: ${{ needs.metadata.outputs.gradle_configuration_cache }}
    env:
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USERNAME: ${{ vars.GRADLE_REMOTE_CACHE_USERNAME }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'validation/')) && 'true' || 'false' }}
      GRADLE_CONFIGURATION_CACHE_MODE: ${{ needs.metadata.outputs.gradle_configuration_cache }}
      GRADLE_CONFIGURATION_CACHE_PERSISTENCE: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY != '' && 'github-cache-encrypted' || 'job-local-only' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Initialize Android unit lane timing
        id: android_unit_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "lane_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') && !startsWith(github.ref_name, 'validation/')) }}
          cache-cleanup: on-success
          add-job-summary: on-failure
          cache-encryption-key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Accept Android SDK licenses and install build toolchain
        id: android_unit_sdk_install
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - id: android_unit_rust_shared_cache
        uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-android-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: android_unit_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Prepare Rust Android toolchain
        id: android_unit_rust_android_toolchain
        uses: ./.github/actions/prepare-rust-android-toolchain
        with:
          cache-version: ${{ env.ANDROID_RUST_TOOLCHAIN_CACHE_VERSION }}
          shared-cache-hit: ${{ steps.android_unit_rust_shared_cache.outputs.cache-hit }}

      - name: Run Android host-side unit suites
        id: android_unit_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gradle
          phase_start="$(date +%s)"
          mapfile -t gradle_configuration_cache_args < <(
            bash .github/scripts/gradle_configuration_cache_args.sh "${GRADLE_CONFIGURATION_CACHE_MODE}"
          )
          ./gradlew -p clients/android \
            :app:testDebugUnitTest \
            :feature-lab:testDebugUnitTest \
            :render-core:test \
            :core-math:test \
            :core-model:test \
            :core-simulation:test \
            "${gradle_configuration_cache_args[@]}" \
            2>&1 | tee dist/gradle/android-unit.log
          phase_end="$(date +%s)"
          from_cache_count="$(grep -c 'FROM-CACHE' dist/gradle/android-unit.log || true)"
          configuration_cache_status="$(
            bash .github/scripts/gradle_configuration_cache_status.sh \
              dist/gradle/android-unit.log \
              "${GRADLE_CONFIGURATION_CACHE_MODE}"
          )"
          {
            echo "unit_seconds=$((phase_end - phase_start))"
            echo "from_cache_count=${from_cache_count}"
            echo "configuration_cache_status=${configuration_cache_status}"
          } >> "$GITHUB_OUTPUT"

      - name: Emit Android unit timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_end_epoch="$(date +%s)"
          lane_start_epoch="${{ steps.android_unit_timing.outputs.lane_start_epoch }}"
          lane_total="$((lane_end_epoch - lane_start_epoch))"
          gradle_cache_configured='false'
          gradle_cache_mode='disabled'
          if [[ -n "${GRADLE_REMOTE_CACHE_URL:-}" ]]; then
            gradle_cache_configured='true'
            if [[ "${GRADLE_REMOTE_CACHE_PUSH}" == "true" ]]; then
              gradle_cache_mode='write-enabled'
            else
              gradle_cache_mode='read-only'
            fi
          fi
          {
            echo "## android-unit timings"
            echo "- sdk setup: \`${{ steps.android_unit_sdk_install.outputs.sdk_setup_seconds || 'n/a' }}s\`"
            echo "- rust/android toolchain: \`${{ steps.android_unit_rust_android_toolchain.outputs.rust_android_toolchain_seconds || 'n/a' }}s\`"
            echo "- unit suites: \`${{ steps.android_unit_tests.outputs.unit_seconds || 'n/a' }}s\`"
            echo "- lane total: \`${lane_total}s\`"
            echo "- remote gradle cache configured: \`${gradle_cache_configured}\`"
            echo "- remote gradle cache mode: \`${gradle_cache_mode}\`"
            echo "- remote gradle cache push: \`${{ env.GRADLE_REMOTE_CACHE_PUSH }}\`"
            echo "- gradle configuration cache: \`${{ env.GRADLE_CONFIGURATION_CACHE_MODE }}\`"
            echo "- gradle configuration cache persistence: \`${{ env.GRADLE_CONFIGURATION_CACHE_PERSISTENCE }}\`"
            echo "- gradle configuration cache result: \`${{ steps.android_unit_tests.outputs.configuration_cache_status || 'n/a' }}\`"
            echo "- gradle FROM-CACHE lines: \`${{ steps.android_unit_tests.outputs.from_cache_count || 'n/a' }}\`"
            echo "- rust/android target cache hit: \`${{ steps.android_unit_rust_android_toolchain.outputs.target_cache_hit || 'false' }}\`"
            echo "- rust/android target status: \`${{ steps.android_unit_rust_android_toolchain.outputs.target_status || 'n/a' }}\`"
            echo "- cargo-ndk status: \`${{ steps.android_unit_rust_android_toolchain.outputs.cargo_ndk_status || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit Android unit sccache stats
        if: always() && steps.android_unit_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/android-unit.txt
          {
            echo "## android-unit sccache"
            cat dist/sccache/android-unit.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android unit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            clients/android/app/build/reports/tests/**
            feature-lab/build/reports/tests/**
            render-core/build/reports/tests/**
            core-math/build/reports/tests/**
            core-model/build/reports/tests/**
            core-simulation/build/reports/tests/**
            clients/android/app/build/test-results/**
            feature-lab/build/test-results/**
            render-core/build/test-results/**
            core-math/build/test-results/**
            core-model/build/test-results/**
            core-simulation/build/test-results/**
            dist/gradle/**
            dist/sccache/**

