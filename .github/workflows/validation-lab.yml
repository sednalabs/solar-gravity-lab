name: validation-lab

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate
        required: false
        type: string
      profile:
        description: Validation profile
        required: true
        type: choice
        options:
          - targeted
          - frontier
          - broad
          - full
        default: targeted
      lane_set:
        description: Which lane bundle to run
        required: true
        type: choice
        options:
          - auto
          - bootstrap
          - rust-workspace
          - ffi-abi
          - android-shell
          - runtime-scene-telemetry
          - full
        default: auto
      write_wrapper:
        description: Commit generated wrapper files back to the branch
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref != '' && inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STANDALONE_GRADLE_CACHE_DIR: ~/.cache/standalone-gradle

jobs:
  metadata:
    name: Resolve validation plan
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      profile_intent: ${{ steps.plan.outputs.profile_intent }}
      profile_notes: ${{ steps.plan.outputs.profile_notes }}
      wrapper_bootstrap: ${{ steps.plan.outputs.wrapper_bootstrap }}
      rust_workspace: ${{ steps.plan.outputs.rust_workspace }}
      ffi_abi: ${{ steps.plan.outputs.ffi_abi }}
      android_shell: ${{ steps.plan.outputs.android_shell }}
      runtime_scene_telemetry: ${{ steps.plan.outputs.runtime_scene_telemetry }}
      lane_summary: ${{ steps.plan.outputs.lane_summary }}
    steps:
      - name: Compute active lanes
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          checkout_ref='${{ inputs.ref }}'
          if [[ -z "$checkout_ref" ]]; then
            checkout_ref='${{ github.ref_name }}'
          fi

          profile='${{ inputs.profile }}'
          lane_set='${{ inputs.lane_set }}'
          write_wrapper='${{ inputs.write_wrapper }}'

          wrapper_bootstrap='false'
          rust_workspace='false'
          ffi_abi='false'
          android_shell='false'
          runtime_scene_telemetry='false'
          profile_intent='targeted'
          profile_notes='One active slice only; use this to prove the current canonical seam before widening.'

          case "$profile" in
            targeted)
              profile_intent='targeted'
              profile_notes='One active slice only; use this to prove the current canonical seam before widening.'
              ;;
            frontier)
              profile_intent='frontier'
              profile_notes='Bounded next-blocker harvest; keep the Rust baseline and add the Android shell when appropriate.'
              ;;
            broad|full)
              profile_intent='checkpoint'
              profile_notes='Explicit checkpoint mode; use sparingly for milestone passes rather than routine iteration.'
              ;;
            *)
              echo "Unknown profile: ${profile}" >&2
              exit 1
              ;;
          esac

          case "$lane_set" in
            auto)
              rust_workspace='true'
              if [[ "$profile" == 'frontier' || "$profile" == 'broad' || "$profile" == 'full' ]]; then
                android_shell='true'
              fi
            if [[ "$profile" == 'broad' || "$profile" == 'full' ]]; then
              ffi_abi='true'
              fi
              ;;
            bootstrap)
              wrapper_bootstrap='true'
              ;;
            rust-workspace)
              rust_workspace='true'
              ;;
            ffi-abi)
              ffi_abi='true'
              ;;
            android-shell)
              android_shell='true'
              ;;
            runtime-scene-telemetry)
              runtime_scene_telemetry='true'
              ;;
            full)
              rust_workspace='true'
              ffi_abi='true'
              android_shell='true'
              runtime_scene_telemetry='true'
              ;;
            *)
              echo "Unknown lane_set: ${lane_set}" >&2
              exit 1
              ;;
          esac

          if [[ "$write_wrapper" == 'true' ]]; then
            wrapper_bootstrap='true'
          fi

          lane_summary="$(printf 'intent=%s, wrapper_bootstrap=%s, rust_workspace=%s, ffi_abi=%s, android_shell=%s, runtime_scene_telemetry=%s' \
            "$profile_intent" "$wrapper_bootstrap" "$rust_workspace" "$ffi_abi" "$android_shell" "$runtime_scene_telemetry")"

          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "profile_intent=${profile_intent}" >> "$GITHUB_OUTPUT"
          echo "profile_notes=${profile_notes}" >> "$GITHUB_OUTPUT"
          echo "wrapper_bootstrap=${wrapper_bootstrap}" >> "$GITHUB_OUTPUT"
          echo "rust_workspace=${rust_workspace}" >> "$GITHUB_OUTPUT"
          echo "ffi_abi=${ffi_abi}" >> "$GITHUB_OUTPUT"
          echo "android_shell=${android_shell}" >> "$GITHUB_OUTPUT"
          echo "runtime_scene_telemetry=${runtime_scene_telemetry}" >> "$GITHUB_OUTPUT"
          echo "lane_summary=${lane_summary}" >> "$GITHUB_OUTPUT"

  wrapper-bootstrap:
    name: Wrapper bootstrap
    needs: metadata
    if: ${{ needs.metadata.outputs.wrapper_bootstrap == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore standalone Gradle cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STANDALONE_GRADLE_CACHE_DIR }}
          key: standalone-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup standalone Gradle
        shell: bash
        run: ./.github/scripts/setup-standalone-gradle.sh "$PWD"

      - name: Generate Gradle wrapper files
        shell: bash
        run: |
          set -euo pipefail
          "${STANDALONE_GRADLE}" --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          git status --short

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-${{ github.run_id }}
          if-no-files-found: error
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.properties
            gradle/wrapper/gradle-wrapper.jar

      - name: Commit wrapper files back to branch
        if: ${{ inputs.write_wrapper }}
        shell: bash
        run: |
          set -euo pipefail

          checkout_ref='${{ needs.metadata.outputs.checkout_ref }}'
          if [[ "$checkout_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refuses to push wrapper files back to a detached SHA ref: ${checkout_ref}" >&2
            exit 1
          fi

          branch_name="$checkout_ref"
          if [[ "$branch_name" == refs/heads/* ]]; then
            branch_name="${branch_name#refs/heads/}"
          fi
          if [[ "$branch_name" == refs/tags/* ]]; then
            echo "Refuses to push wrapper files back to a tag ref: ${checkout_ref}" >&2
            exit 1
          fi

          git checkout -B "$branch_name"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar

          if git diff --cached --quiet; then
            echo "No wrapper changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Gradle wrapper jar"
          git push origin "HEAD:${branch_name}"

  rust-workspace:
    name: Rust workspace tests
    needs: metadata
    if: ${{ needs.metadata.outputs.rust_workspace == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Run canonical workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace

  ffi-abi:
    name: FFI ABI tests
    needs: metadata
    if: ${{ needs.metadata.outputs.ffi_abi == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Run focused FFI ABI tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p solarlab-ffi

  runtime-scene-telemetry:
    name: Runtime scene + telemetry tests
    needs: metadata
    if: ${{ needs.metadata.outputs.runtime_scene_telemetry == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Run focused runtime scene + telemetry tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p solarlab-runtime --lib render_scene
          cargo test -p solarlab-runtime --lib telemetry

  android-shell:
    name: Android shell emulator smoke
    needs: metadata
    if: ${{ needs.metadata.outputs.android_shell == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Accept Android SDK licenses and install build toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Install Rust Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Assemble debug Android shell and androidTest
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p clients/android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android shell smoke and continuity tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash .github/scripts/run_validation_android_shell_smoke.sh

      - name: Upload Android shell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shell-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            clients/android/app/build/outputs/**
            clients/android/**/build/reports/**

  summary:
    name: Validation summary
    needs:
      - metadata
      - wrapper-bootstrap
      - rust-workspace
      - ffi-abi
      - android-shell
      - runtime-scene-telemetry
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Emit summary
        shell: bash
        run: |
          {
            echo "## validation-lab"
            echo
            echo "- ref: \`${{ needs.metadata.outputs.checkout_ref }}\`"
            echo "- profile: \`${{ inputs.profile }}\`"
            echo "- intent: \`${{ needs.metadata.outputs.profile_intent }}\`"
            echo "- lanes: \`${{ needs.metadata.outputs.lane_summary }}\`"
            echo "- notes: ${{ needs.metadata.outputs.profile_notes }}"
            echo "- wrapper-bootstrap: \`${{ needs['wrapper-bootstrap'].result }}\`"
            echo "- rust-workspace: \`${{ needs['rust-workspace'].result }}\`"
            echo "- ffi-abi: \`${{ needs['ffi-abi'].result }}\`"
            echo "- android-shell: \`${{ needs['android-shell'].result }}\`"
            echo "- runtime-scene-telemetry: \`${{ needs['runtime-scene-telemetry'].result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
