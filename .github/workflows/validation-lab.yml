name: validation-lab

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/android/**"
      - "core-math/**"
      - "core-model/**"
      - "core-simulation/**"
      - "engine/**"
      - "feature-lab/**"
      - "render-core/**"
      - "proto/**"
      - "render/**"
      - "services/**"
      - "labs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "clients/android/**"
      - "feature-lab/**"
      - "render-core/**"
      - "core-math/**"
      - "core-model/**"
      - "core-simulation/**"
      - "engine/**"
      - "proto/**"
      - "render/**"
      - "services/**"
      - "labs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        type: choice
        options:
          - targeted
          - frontier
          - broad
          - full
        default: targeted
      lane_set:
        description: Which lane bundle to run
        required: true
        type: choice
        options:
          - auto
          - bootstrap
          - rust-workspace
          - rust-workspace-arm64
          - arm64-capability-census
          - arm64-isa-proof
          - runtime-cpu-truth
          - ffi-abi
          - android-unit
          - android-lint
          - android-shell
          - runtime-scene-telemetry
          - full
        default: auto
      write_wrapper:
        description: Commit generated wrapper files back to the branch
        required: true
        type: boolean
        default: false
      android_test_scope:
        description: Android instrumentation suite scope
        required: true
        type: choice
        options:
          - core
          - full
        default: core
      android_validation_mode:
        description: Android validation mode or matrix selection
        required: true
        type: choice
        options:
          - auto
          - shell-v2
          - stage-first-mirror-off
          - stage-first-mirror-on
        default: auto
      android_artifact_mode:
        description: Android artifact capture mode
        required: true
        type: choice
        options:
          - failures-only
          - always
        default: failures-only
      emulator_boot_strategy:
        description: Emulator startup strategy
        required: true
        type: choice
        options:
          - cold
          - snapshot-cache
        default: cold
      gradle_configuration_cache:
        description: Gradle configuration-cache mode for Android lanes
        required: true
        type: choice
        options:
          - disabled
          - enabled
        default: disabled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  STANDALONE_GRADLE_CACHE_DIR: ~/.cache/standalone-gradle
  ANDROID_AVD_NAME: pixel_7_api35_google_apis_x86_64
  ANDROID_AVD_CACHE_VERSION: v3
  ANDROID_SDK_COMPONENT_CACHE_VERSION: v1
  ANDROID_RUST_TOOLCHAIN_CACHE_VERSION: v2
  ANDROID_SDK_ROOT_DEFAULT: /usr/local/lib/android/sdk
  ANDROID_PLATFORM_PACKAGE: "platforms;android-36"
  ANDROID_BUILD_TOOLS_PACKAGE: "build-tools;36.0.0"
  ANDROID_SYSTEM_IMAGE_PACKAGE: "system-images;android-35;google_apis;x86_64"
  ANDROID_CMAKE_PACKAGE: "cmake;3.31.5"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_NDK_PACKAGE: "ndk;27.3.13750724"
  SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE_S3_KEY_PREFIX: ${{ vars.SCCACHE_S3_KEY_PREFIX }}
  SCCACHE_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID != '' && secrets.SCCACHE_ACCESS_KEY_ID || secrets.R2_CACHE_ACCESS_KEY_ID }}
  SCCACHE_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY != '' && secrets.SCCACHE_SECRET_ACCESS_KEY || secrets.R2_CACHE_SECRET_ACCESS_KEY }}
  SCCACHE_CREDENTIAL_SOURCE: ${{ secrets.SCCACHE_ACCESS_KEY_ID != '' && 'dedicated-sccache-secrets' || 'shared-r2-secrets' }}

jobs:
  metadata:
    name: Resolve validation plan
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      profile: ${{ steps.plan.outputs.profile }}
      lane_set: ${{ steps.plan.outputs.lane_set }}
      android_test_scope: ${{ steps.plan.outputs.android_test_scope }}
      android_validation_mode: ${{ steps.plan.outputs.android_validation_mode }}
      android_artifact_mode: ${{ steps.plan.outputs.android_artifact_mode }}
      emulator_boot_strategy: ${{ steps.plan.outputs.emulator_boot_strategy }}
      gradle_configuration_cache: ${{ steps.plan.outputs.gradle_configuration_cache }}
      profile_intent: ${{ steps.plan.outputs.profile_intent }}
      profile_notes: ${{ steps.plan.outputs.profile_notes }}
      wrapper_bootstrap: ${{ steps.plan.outputs.wrapper_bootstrap }}
      rust_workspace: ${{ steps.plan.outputs.rust_workspace }}
      rust_workspace_arm64: ${{ steps.plan.outputs.rust_workspace_arm64 }}
      arm64_capability_census: ${{ steps.plan.outputs.arm64_capability_census }}
      arm64_isa_proof: ${{ steps.plan.outputs.arm64_isa_proof }}
      ffi_abi: ${{ steps.plan.outputs.ffi_abi }}
      android_unit: ${{ steps.plan.outputs.android_unit }}
      android_lint: ${{ steps.plan.outputs.android_lint }}
      android_shell: ${{ steps.plan.outputs.android_shell }}
      android_shell_matrix: ${{ steps.plan.outputs.android_shell_matrix }}
      runtime_scene_telemetry: ${{ steps.plan.outputs.runtime_scene_telemetry }}
      lane_summary: ${{ steps.plan.outputs.lane_summary }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      effective_changed_files_source: ${{ steps.plan.outputs.effective_changed_files_source }}
      prior_evidence_reused: ${{ steps.plan.outputs.prior_evidence_reused }}
      prior_evidence_sha: ${{ steps.plan.outputs.prior_evidence_sha }}
      prior_evidence_run_url: ${{ steps.plan.outputs.prior_evidence_run_url }}
      prior_evidence_reason: ${{ steps.plan.outputs.prior_evidence_reason }}
      merge_checkpoint_required: ${{ steps.plan.outputs.merge_checkpoint_required }}
      route_reason: ${{ steps.plan.outputs.route_reason }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$EVENT_SHA" ]]; then
            echo "github.sha was empty; cannot resolve a trusted checkout target." >&2
            exit 1
          fi
          echo "checkout_ref=${EVENT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Collect changed files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          event_name='${{ github.event_name }}'
          base_sha=''
          head_sha="$(git rev-parse HEAD)"
          before_sha=''

          if [[ "$event_name" == 'pull_request' ]]; then
            base_sha='${{ github.event.pull_request.base.sha }}'
            head_sha='${{ github.event.pull_request.head.sha }}'
            before_sha='${{ github.event.before }}'
            git fetch --no-tags --prune origin '${{ github.event.pull_request.base.ref }}' || true
          elif [[ "$event_name" == 'push' ]]; then
            base_sha='${{ github.event.before }}'
            head_sha='${{ github.sha }}'
          elif [[ "$event_name" == 'merge_group' ]]; then
            base_sha='${{ github.event.merge_group.base_sha }}'
            head_sha='${{ github.sha }}'
          fi

          mkdir -p dist/validation-plan
          : > dist/validation-plan/primary-files.txt
          : > dist/validation-plan/latest-files.txt

          if [[ -n "$base_sha" ]] && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git diff --name-only "$base_sha" "$head_sha" > dist/validation-plan/primary-files.txt
          else
            git diff --name-only HEAD~1 "$head_sha" > dist/validation-plan/primary-files.txt || true
          fi

          if [[ "$event_name" == 'pull_request' && -n "$before_sha" && "$before_sha" != '0000000000000000000000000000000000000000' ]] && \
             git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            git diff --name-only "$before_sha" "$head_sha" > dist/validation-plan/latest-files.txt
          else
            cp dist/validation-plan/primary-files.txt dist/validation-plan/latest-files.txt
          fi

          {
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
            echo "before_sha=${before_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve prior validation evidence
        id: prior_evidence
        if: ${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || github.event.action == 'ready_for_review') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ steps.files.outputs.before_sha }}
          BASE_SHA: ${{ steps.files.outputs.base_sha }}
          HEAD_SHA: ${{ steps.files.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/validation-plan/prior-evidence
          : > dist/validation-plan/prior-evidence/validation-summary.json

          candidate_sha="$BEFORE_SHA"
          candidate_reason="immediate previous head"
          if [[ "$EVENT_ACTION" == 'ready_for_review' ]]; then
            candidate_sha="$HEAD_SHA"
            candidate_reason="exact ready-for-review head"
            : > dist/validation-plan/latest-files.txt
          fi

          if [[ -z "$candidate_sha" || "$candidate_sha" == '0000000000000000000000000000000000000000' ]]; then
            echo "No immediate previous PR head SHA is available."
            exit 0
          fi

          run_list_json="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow validation-lab.yml \
              --event pull_request \
              --limit 50 \
              --json databaseId,headSha,conclusion,status,headBranch 2>/dev/null || true
          )"
          if [[ -z "$run_list_json" ]]; then
            echo "Could not list prior validation-lab runs."
            exit 0
          fi

          candidate_run_id="$(
            jq -r --arg candidate "$candidate_sha" --arg current "$CURRENT_RUN_ID" '
              map(select((.databaseId|tostring) != $current))
              | map(select(.headSha == $candidate and .status == "completed" and .conclusion == "success"))
              | .[0].databaseId // empty
            ' <<< "$run_list_json"
          )"

          if [[ -z "$candidate_run_id" ]]; then
            echo "No successful validation-lab run found for ${candidate_reason} ${candidate_sha}."
            exit 0
          fi

          if ! gh run download "$candidate_run_id" \
              --repo "$REPOSITORY" \
              --name validation-summary \
              --dir dist/validation-plan/prior-evidence/download >/dev/null 2>&1; then
            echo "Could not download validation-summary artifact from run ${candidate_run_id}."
            exit 0
          fi

          candidate_summary="$(
            find dist/validation-plan/prior-evidence/download -type f -name 'validation-summary.json' | sort | head -n 1
          )"
          if [[ -z "$candidate_summary" ]]; then
            echo "Downloaded artifact did not contain validation-summary.json."
            exit 0
          fi

          if jq -e --arg candidate "$candidate_sha" --arg base "$BASE_SHA" --arg profile "${{ inputs.profile || 'targeted' }}" --arg lane_set "${{ inputs.lane_set || 'auto' }}" '
              .summary.status == "success" and
              (.run.head_sha // .validation_context.head_sha // .ci_proof_v1.head_sha // "") == $candidate and
              (.run.base_sha // .validation_context.base_sha // .ci_proof_v1.base_sha // "") == $base and
              (.ci_proof_v1.schema_version // "ci-proof-v1") == "ci-proof-v1" and
              (.ci_proof_v1.profile // .validation_context.profile // "") == $profile and
              (.ci_proof_v1.lane // .validation_context.lane_set // "") == $lane_set
            ' "$candidate_summary" >/dev/null; then
            if jq -e --arg pr "$PR_NUMBER" '
                (.run.pull_request_number // .validation_context.pull_request_number // .ci_proof_v1.pull_request_number // "") == $pr
              ' "$candidate_summary" >/dev/null; then
              cp "$candidate_summary" dist/validation-plan/prior-evidence/validation-summary.json
              echo "Reusing prior validation evidence from run ${candidate_run_id}."
            else
              echo "Prior validation summary matched the head/base but not this PR number."
            fi
          else
            echo "Prior validation summary did not match this PR base and immediate previous head."
          fi

      - name: Compute active lanes
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/resolve_validation_lab_plan.py \
            --event-name '${{ github.event_name }}' \
            --checkout-ref '${{ steps.checkout_ref.outputs.checkout_ref }}' \
            --profile '${{ inputs.profile }}' \
            --lane-set '${{ inputs.lane_set }}' \
            --write-wrapper '${{ inputs.write_wrapper }}' \
            --android-test-scope '${{ inputs.android_test_scope }}' \
            --android-validation-mode '${{ inputs.android_validation_mode }}' \
            --android-artifact-mode '${{ inputs.android_artifact_mode }}' \
            --emulator-boot-strategy '${{ inputs.emulator_boot_strategy }}' \
            --gradle-configuration-cache '${{ inputs.gradle_configuration_cache }}' \
            --base-sha '${{ steps.files.outputs.base_sha }}' \
            --head-sha '${{ steps.files.outputs.head_sha }}' \
            --pull-request-number '${{ github.event.pull_request.number }}'

          cat dist/validation-plan/outputs.env >> "$GITHUB_OUTPUT"

      - name: Emit validation routing breadcrumb
        shell: bash
        run: |
          {
            echo "## validation-lab routing"
            echo
            echo "- route reason: \`${{ steps.plan.outputs.route_reason }}\`"
            echo "- changed files source: \`${{ steps.plan.outputs.effective_changed_files_source }}\`"
            echo "- prior evidence reused: \`${{ steps.plan.outputs.prior_evidence_reused }}\`"
            echo "- prior evidence SHA: \`${{ steps.plan.outputs.prior_evidence_sha || 'n/a' }}\`"
            echo "- prior evidence run: \`${{ steps.plan.outputs.prior_evidence_run_url || 'n/a' }}\`"
            echo "- merge checkpoint required: \`${{ steps.plan.outputs.merge_checkpoint_required }}\`"
            if [[ '${{ steps.plan.outputs.merge_checkpoint_required }}' == 'true' ]]; then
              echo
              echo "Full validation remains required on the merge/default-branch checkpoint; PR-local evidence reuse never satisfies that final checkpoint."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  wrapper-bootstrap:
    name: Wrapper bootstrap
    needs: metadata
    if: ${{ needs.metadata.outputs.wrapper_bootstrap == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore standalone Gradle cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.STANDALONE_GRADLE_CACHE_DIR }}
          key: standalone-gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup standalone Gradle
        shell: bash
        run: ./.github/scripts/setup-standalone-gradle.sh "$PWD"

      - name: Generate Gradle wrapper files
        shell: bash
        run: |
          set -euo pipefail
          "${STANDALONE_GRADLE}" --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          git status --short

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gradle-wrapper-${{ github.run_id }}
          if-no-files-found: error
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.properties
            gradle/wrapper/gradle-wrapper.jar

      - name: Commit wrapper files back to branch
        if: ${{ inputs.write_wrapper }}
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_REF" != refs/heads/* ]]; then
            echo "Refuses to push wrapper files back to non-branch ref: ${EVENT_REF}" >&2
            exit 1
          fi

          branch_name="$EVENT_REF_NAME"
          if [[ -z "$branch_name" ]]; then
            echo "github.ref_name was empty; cannot resolve wrapper push branch." >&2
            exit 1
          fi

          git checkout -B "$branch_name"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar

          if git diff --cached --quiet; then
            echo "No wrapper changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Gradle wrapper jar"
          git push origin "HEAD:${branch_name}"

  parity-matrix:
    name: Validate parity matrix
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Validate parity matrix schema
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_parity_matrix.py labs/parity/matrix.json

  rust-workspace:
    name: Rust workspace tests
    needs: metadata
    if: ${{ needs.metadata.outputs.rust_workspace == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: rust_workspace_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run canonical workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace

      - name: Emit rust workspace sccache stats
        if: always() && steps.rust_workspace_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/rust-workspace.txt
          {
            echo "## rust-workspace sccache"
            cat dist/sccache/rust-workspace.txt
          } >> "$GITHUB_STEP_SUMMARY"

  rust-workspace-arm64:
    name: Rust workspace tests (Arm64)
    needs: metadata
    if: ${{ needs.metadata.outputs.rust_workspace_arm64 == 'true' }}
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: rust_workspace_arm64_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run canonical workspace tests on Arm64
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace

      - name: Emit rust workspace arm64 sccache stats
        if: always() && steps.rust_workspace_arm64_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/rust-workspace-arm64.txt
          {
            echo "## rust-workspace-arm64 sccache"
            cat dist/sccache/rust-workspace-arm64.txt
          } >> "$GITHUB_STEP_SUMMARY"

  arm64-isa-proof:
    name: Arm64 ISA proof
    needs: metadata
    if: ${{ needs.metadata.outputs.arm64_isa_proof == 'true' }}
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-native-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: arm64_isa_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Run Arm64 ISA activation proof
        shell: bash
        run: bash .github/scripts/run_arm64_isa_proof.sh

      - name: Emit Arm64 ISA sccache stats
        if: always() && steps.arm64_isa_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/arm64-isa-proof.txt
          {
            echo "## arm64-isa-proof sccache"
            cat dist/sccache/arm64-isa-proof.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Arm64 ISA proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arm64-isa-proof-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/arm64-isa-proof/**
            dist/sccache/arm64-isa-proof.txt

  arm64-capability-census:
    name: Arm64 capability census
    needs: metadata
    if: ${{ needs.metadata.outputs.arm64_capability_census == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Collect hosted Arm64 capability census
        shell: bash
        run: |
