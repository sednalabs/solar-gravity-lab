      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.metadata.outputs.android_shell_matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Initialize Android lane timing
        id: android_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "lane_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') && !startsWith(github.ref_name, 'validation/')) }}
          cache-cleanup: on-success
          add-job-summary: on-failure
          cache-encryption-key: ${{ secrets.GRADLE_CONFIGURATION_CACHE_KEY }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android emulator AVD cache
        id: avd-cache
        if: ${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ env.ANDROID_AVD_NAME }}-${{ env.ANDROID_AVD_CACHE_VERSION }}

      - name: Restore Android SDK emulator packages cache
        id: android-sdk-components-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/google_apis
          key: android-sdk-components-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_SDK_COMPONENT_CACHE_VERSION }}

      - name: Seed Android emulator snapshot
        if: ${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for ${ANDROID_AVD_NAME}."

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - id: android_shell_rust_shared_cache
        uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-android-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: android_shell_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Accept Android SDK licenses and install build toolchain
        id: android_sdk_install
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - name: Prepare Rust Android toolchain
        id: rust_android_toolchain
        uses: ./.github/actions/prepare-rust-android-toolchain
        with:
          cache-version: ${{ env.ANDROID_RUST_TOOLCHAIN_CACHE_VERSION }}
          shared-cache-hit: ${{ steps.android_shell_rust_shared_cache.outputs.cache-hit }}

      - name: Resolve Android validation mode props
        id: android_mode
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "validation_mode=${{ matrix.validation_mode }}"
            echo "debug_stage_first_client=${{ matrix.debug_stage_first_client }}"
            echo "stage_first_runtime_mirror=${{ matrix.stage_first_runtime_mirror }}"
            echo "preferred_gpu_backend=${{ matrix.preferred_gpu_backend }}"
            echo "hosted_debug_profile=${{ matrix.hosted_debug_profile }}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble debug Android shell and androidTest
        id: android_assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gradle
          phase_start="$(date +%s)"
          mapfile -t gradle_configuration_cache_args < <(
            bash .github/scripts/gradle_configuration_cache_args.sh "${GRADLE_CONFIGURATION_CACHE_MODE}"
          )
          ./gradlew -p clients/android \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            -Psolarlab.debugStageFirstClient=${{ steps.android_mode.outputs.debug_stage_first_client }} \
            -Psolarlab.stageFirstRuntimeMirror=${{ steps.android_mode.outputs.stage_first_runtime_mirror }} \
            -Psolarlab.preferredGpuBackend=${{ steps.android_mode.outputs.preferred_gpu_backend }} \
            -Psolarlab.hostedDebugProfile=${{ steps.android_mode.outputs.hosted_debug_profile }} \
            "${gradle_configuration_cache_args[@]}" \
            2>&1 | tee dist/gradle/android-shell-assemble-${{ matrix.validation_mode }}.log
          phase_end="$(date +%s)"
          from_cache_count="$(grep -c 'FROM-CACHE' dist/gradle/android-shell-assemble-${{ matrix.validation_mode }}.log || true)"
          configuration_cache_status="$(
            bash .github/scripts/gradle_configuration_cache_status.sh \
              dist/gradle/android-shell-assemble-${{ matrix.validation_mode }}.log \
              "${GRADLE_CONFIGURATION_CACHE_MODE}"
          )"
          {
            echo "assemble_seconds=$((phase_end - phase_start))"
            echo "from_cache_count=${from_cache_count}"
            echo "configuration_cache_status=${configuration_cache_status}"
          } >> "$GITHUB_OUTPUT"

      - name: Run connected Android shell smoke and continuity tests
        id: android_connected_tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: ${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' && 'false' || 'true' }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run_validation_android_shell_smoke.sh
        env:
          ANDROID_TEST_SCOPE: ${{ needs.metadata.outputs.android_test_scope }}
          ANDROID_ARTIFACT_MODE: ${{ needs.metadata.outputs.android_artifact_mode }}
          ANDROID_VALIDATION_MODE: ${{ steps.android_mode.outputs.validation_mode }}
          GRADLE_CONFIGURATION_CACHE_MODE: ${{ env.GRADLE_CONFIGURATION_CACHE_MODE }}
          ORG_GRADLE_PROJECT_solarlab_debugStageFirstClient: ${{ steps.android_mode.outputs.debug_stage_first_client }}
          ORG_GRADLE_PROJECT_solarlab_stageFirstRuntimeMirror: ${{ steps.android_mode.outputs.stage_first_runtime_mirror }}
          ORG_GRADLE_PROJECT_solarlab_preferredGpuBackend: ${{ steps.android_mode.outputs.preferred_gpu_backend }}
          ORG_GRADLE_PROJECT_solarlab_hostedDebugProfile: ${{ steps.android_mode.outputs.hosted_debug_profile }}

      - name: Emit Android lane timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_end_epoch="$(date +%s)"
          lane_start_epoch="${{ steps.android_timing.outputs.lane_start_epoch }}"
          lane_total="$((lane_end_epoch - lane_start_epoch))"
          status_file="clients/android/app/build/reports/emulator-smoke/instrumentation-batch/status.txt"
          if [[ ! -f "${status_file}" ]]; then
            status_file=''
            if [[ -d clients/android/app/build/reports/emulator-smoke ]]; then
              status_file="$(find clients/android/app/build/reports/emulator-smoke -path '*/status.txt' | sort | tail -n 1)"
            fi
          fi
          instrumentation_from_cache_count='n/a'
          instrumentation_configuration_cache_status='n/a'
          total_from_cache_count='n/a'
          assemble_from_cache_count='${{ steps.android_assemble.outputs.from_cache_count || 'n/a' }}'
          if [[ -f "${status_file}" ]]; then
            instrumentation_from_cache_count="$(awk -F= '/^from_cache_count=/{print $2}' "${status_file}")"
            instrumentation_configuration_cache_status="$(awk -F= '/^configuration_cache_status=/{print $2}' "${status_file}")"
          fi
          if [[ -z "${instrumentation_configuration_cache_status}" ]]; then
            instrumentation_configuration_cache_status='n/a'
          fi
          if [[ "${assemble_from_cache_count}" =~ ^[0-9]+$ && "${instrumentation_from_cache_count}" =~ ^[0-9]+$ ]]; then
            total_from_cache_count="$((assemble_from_cache_count + instrumentation_from_cache_count))"
          fi
          gradle_cache_configured='false'
          gradle_cache_mode='disabled'
          if [[ -n "${GRADLE_REMOTE_CACHE_URL:-}" ]]; then
            gradle_cache_configured='true'
            if [[ "${GRADLE_REMOTE_CACHE_PUSH}" == "true" ]]; then
              gradle_cache_mode='write-enabled'
            else
              gradle_cache_mode='read-only'
            fi
          fi
          {
            echo "## android-shell timings"
            echo "- validation mode: \`${{ steps.android_mode.outputs.validation_mode }}\`"
            echo "- stage-first client: \`${{ steps.android_mode.outputs.debug_stage_first_client }}\`"
            echo "- stage-first runtime mirror: \`${{ steps.android_mode.outputs.stage_first_runtime_mirror }}\`"
            echo "- preferred GPU backend: \`${{ steps.android_mode.outputs.preferred_gpu_backend }}\`"
            echo "- hosted debug profile: \`${{ steps.android_mode.outputs.hosted_debug_profile }}\`"
            echo "- sdk setup: \`${{ steps.android_sdk_install.outputs.sdk_setup_seconds || 'n/a' }}s\`"
            echo "- rust/android toolchain: \`${{ steps.rust_android_toolchain.outputs.rust_android_toolchain_seconds || 'n/a' }}s\`"
            echo "- assemble debug + androidTest: \`${{ steps.android_assemble.outputs.assemble_seconds || 'n/a' }}s\`"
            echo "- lane total (including emulator + instrumentation): \`${lane_total}s\`"
            echo "- scope: \`${{ needs.metadata.outputs.android_test_scope }}\`"
            echo "- artifact mode: \`${{ needs.metadata.outputs.android_artifact_mode }}\`"
            echo "- emulator boot strategy: \`${{ needs.metadata.outputs.emulator_boot_strategy }}\`"
            echo "- avd cache key: \`avd-${{ runner.os }}-${{ env.ANDROID_AVD_NAME }}-${{ env.ANDROID_AVD_CACHE_VERSION }}\`"
            echo "- avd cache result: \`${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' && (steps.avd-cache.outputs.cache-hit == 'true' && 'hit' || 'miss') || 'skipped' }}\`"
            echo "- remote gradle cache configured: \`${gradle_cache_configured}\`"
            echo "- remote gradle cache mode: \`${gradle_cache_mode}\`"
            echo "- remote gradle cache push: \`${{ env.GRADLE_REMOTE_CACHE_PUSH }}\`"
            echo "- gradle configuration cache: \`${{ env.GRADLE_CONFIGURATION_CACHE_MODE }}\`"
            echo "- gradle configuration cache persistence: \`${{ env.GRADLE_CONFIGURATION_CACHE_PERSISTENCE }}\`"
            echo "- assemble config cache result: \`${{ steps.android_assemble.outputs.configuration_cache_status || 'n/a' }}\`"
            echo "- instrumentation config cache result: \`${instrumentation_configuration_cache_status}\`"
            echo "- assemble FROM-CACHE lines: \`${assemble_from_cache_count}\`"
            echo "- instrumentation FROM-CACHE lines: \`${instrumentation_from_cache_count}\`"
            echo "- total FROM-CACHE lines: \`${total_from_cache_count}\`"
            echo "- rust/android target cache hit: \`${{ steps.rust_android_toolchain.outputs.target_cache_hit || 'false' }}\`"
            echo "- rust/android target status: \`${{ steps.rust_android_toolchain.outputs.target_status || 'n/a' }}\`"
            echo "- cargo-ndk status: \`${{ steps.rust_android_toolchain.outputs.cargo_ndk_status || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit Android shell sccache stats
        if: always() && steps.android_shell_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/android-shell-${{ matrix.validation_mode }}.txt
          {
            echo "## android-shell sccache"
            cat dist/sccache/android-shell-${{ matrix.validation_mode }}.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android shell artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-shell-${{ matrix.validation_mode }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            clients/android/app/build/reports/androidTests/**
            clients/android/app/build/reports/emulator-smoke/**
            clients/android/app/build/outputs/androidTest-results/**
            clients/android/app/build/outputs/apk/debug/**
            clients/android/app/build/outputs/apk/androidTest/**
            dist/gradle/**
            dist/sccache/**

  summary:
    name: Publish validation summary
    needs:
      - metadata
      - parity-matrix
      - wrapper-bootstrap
      - rust-workspace
      - rust-workspace-arm64
      - arm64-capability-census
      - arm64-isa-proof
      - ffi-abi
      - android-unit
      - android-lint
      - android-shell
      - runtime-scene-telemetry
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          persist-credentials: false

      - name: Download Android shell artifacts for summary enrichment
        if: ${{ needs.android-shell.result != 'skipped' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: android-shell-*-${{ github.run_id }}
          path: dist/android-shell-artifacts

      - name: Build validation summary payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/validation-summary
          python3 .github/scripts/write_validation_summary.py \
            --workflow validation-lab \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --checkout-ref "${{ needs.metadata.outputs.checkout_ref }}" \
            --pull-request-number "${{ github.event.pull_request.number }}" \
            --profile "${{ needs.metadata.outputs.profile }}" \
            --profile-intent "${{ needs.metadata.outputs.profile_intent }}" \
            --profile-notes "${{ needs.metadata.outputs.profile_notes }}" \
            --lane-set "${{ needs.metadata.outputs.lane_set }}" \
            --lane-summary "${{ needs.metadata.outputs.lane_summary }}" \
            --android-test-scope "${{ needs.metadata.outputs.android_test_scope }}" \
            --android-validation-mode "${{ needs.metadata.outputs.android_validation_mode }}" \
            --android-artifact-mode "${{ needs.metadata.outputs.android_artifact_mode }}" \
            --emulator-boot-strategy "${{ needs.metadata.outputs.emulator_boot_strategy }}" \
            --gradle-configuration-cache "${{ needs.metadata.outputs.gradle_configuration_cache }}" \
            --base-sha "${{ needs.metadata.outputs.base_sha }}" \
            --head-sha "${{ needs.metadata.outputs.head_sha }}" \
            --effective-changed-files-source "${{ needs.metadata.outputs.effective_changed_files_source }}" \
            --prior-evidence-reused "${{ needs.metadata.outputs.prior_evidence_reused }}" \
            --prior-evidence-sha "${{ needs.metadata.outputs.prior_evidence_sha }}" \
            --prior-evidence-run-url "${{ needs.metadata.outputs.prior_evidence_run_url }}" \
            --prior-evidence-reason "${{ needs.metadata.outputs.prior_evidence_reason }}" \
            --merge-checkpoint-required "${{ needs.metadata.outputs.merge_checkpoint_required }}" \
            --route-reason "${{ needs.metadata.outputs.route_reason }}" \
            --android-shell-artifacts-dir dist/android-shell-artifacts \
            --job parity-matrix=${{ needs.parity-matrix.result }} \
            --job wrapper-bootstrap=${{ needs.wrapper-bootstrap.result || 'skipped' }} \
            --job rust-workspace=${{ needs.rust-workspace.result || 'skipped' }} \
            --job rust-workspace-arm64=${{ needs.rust-workspace-arm64.result || 'skipped' }} \
            --job arm64-capability-census=${{ needs.arm64-capability-census.result || 'skipped' }} \
            --job arm64-isa-proof=${{ needs.arm64-isa-proof.result || 'skipped' }} \
            --job ffi-abi=${{ needs.ffi-abi.result || 'skipped' }} \
            --job android-unit=${{ needs.android-unit.result || 'skipped' }} \
            --job android-lint=${{ needs.android-lint.result || 'skipped' }} \
            --job android-shell=${{ needs.android-shell.result || 'skipped' }} \
            --job runtime-scene-telemetry=${{ needs.runtime-scene-telemetry.result || 'skipped' }} \
            --output-json dist/validation-summary/validation-summary.json \
            --output-md dist/validation-summary/validation-summary.md

      - name: Emit validation summary
        shell: bash
        run: cat dist/validation-summary/validation-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-summary
          if-no-files-found: error
          path: dist/validation-summary/**

      - name: Upload CI proof artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-proof-v1-validation-lab-pr${{ github.event.pull_request.number || 'none' }}-${{ needs.metadata.outputs.base_sha || 'no-base' }}-${{ needs.metadata.outputs.head_sha }}-${{ needs.metadata.outputs.profile }}-${{ needs.metadata.outputs.lane_set }}
          if-no-files-found: error
          path: dist/validation-summary/validation-summary.json
