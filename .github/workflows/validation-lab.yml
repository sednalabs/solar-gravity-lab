            clients/android/app/build/reports/lint-results-*.txt
            clients/android/app/build/intermediates/lint_intermediate_text_report/**
            feature-lab/build/reports/lint-results-*.html
            feature-lab/build/reports/lint-results-*.xml
            feature-lab/build/reports/lint-results-*.txt
            feature-lab/build/intermediates/lint_intermediate_text_report/**
            dist/sccache/**

  android-shell:
    name: Android shell emulator smoke (${{ matrix.validation_mode }})
    needs: metadata
    if: ${{ needs.metadata.outputs.android_shell == 'true' }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USERNAME: ${{ vars.GRADLE_REMOTE_CACHE_USERNAME }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: ${{ needs.metadata.outputs.gradle_cache_push }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.metadata.outputs.android_shell_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Initialize Android lane timing
        id: android_timing
        shell: bash
        run: |
          set -euo pipefail
          echo "lane_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ needs.metadata.outputs.gradle_cache_read_only == 'true' }}
          cache-cleanup: on-success
          add-job-summary: on-failure
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: ${{ env.ANDROID_SDK_ROOT_DEFAULT }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore Android emulator AVD cache
        id: avd-cache
        if: ${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: avd-${{ runner.os }}-${{ env.ANDROID_AVD_NAME }}-${{ env.ANDROID_AVD_CACHE_VERSION }}

      - name: Restore Android SDK emulator packages cache
        id: android-sdk-components-cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/google_apis
          key: android-sdk-components-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_SDK_COMPONENT_CACHE_VERSION }}

      - name: Seed Android emulator snapshot
        if: ${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' && steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          emulator-boot-timeout: 1200
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated AVD snapshot for ${ANDROID_AVD_NAME}."

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/rust-shared-cache
        with:
          shared-key: solarlab-rust-android-${{ runner.os }}-${{ runner.arch }}

      - uses: ./.github/actions/install-sccache
        with:
          version: v0.10.0

      - name: Configure sccache
        id: android_shell_sccache
        shell: bash
        run: bash .github/scripts/configure_sccache.sh

      - name: Accept Android SDK licenses and install build toolchain
        id: android_sdk_install
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ensure_android_sdk_packages.sh \
            "emulator" \
            "platform-tools" \
            "${ANDROID_PLATFORM_PACKAGE}" \
            "${ANDROID_BUILD_TOOLS_PACKAGE}" \
            "${ANDROID_SYSTEM_IMAGE_PACKAGE}" \
            "${ANDROID_CMAKE_PACKAGE}" \
            "${ANDROID_NDK_PACKAGE}"

      - name: Install Rust Android toolchain
        id: rust_android_toolchain
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          rustup target add aarch64-linux-android x86_64-linux-android
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk already available."
          else
            cargo install cargo-ndk --locked
          fi
          phase_end="$(date +%s)"
          echo "rust_android_toolchain_seconds=$((phase_end - phase_start))" >> "$GITHUB_OUTPUT"

      - name: Resolve Android validation mode props
        id: android_mode
        shell: bash
        run: |
          set -euo pipefail
          echo "validation_mode=${{ matrix.validation_mode }}" >> "$GITHUB_OUTPUT"
          echo "debug_stage_first_client=${{ matrix.debug_stage_first_client }}" >> "$GITHUB_OUTPUT"
          echo "stage_first_runtime_mirror=${{ matrix.stage_first_runtime_mirror }}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug Android shell and androidTest
        id: android_assemble
        shell: bash
        run: |
          set -euo pipefail
          phase_start="$(date +%s)"
          ./gradlew -p clients/android \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            -Psolarlab.debugStageFirstClient=${{ steps.android_mode.outputs.debug_stage_first_client }} \
            -Psolarlab.stageFirstRuntimeMirror=${{ steps.android_mode.outputs.stage_first_runtime_mirror }}
          phase_end="$(date +%s)"
          echo "assemble_seconds=$((phase_end - phase_start))" >> "$GITHUB_OUTPUT"

      - name: Run connected Android shell smoke and continuity tests
        id: android_connected_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-boot-timeout: 1200
          force-avd-creation: ${{ needs.metadata.outputs.emulator_boot_strategy == 'snapshot-cache' && 'false' || 'true' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run_validation_android_shell_smoke.sh
        env:
          ANDROID_TEST_SCOPE: ${{ needs.metadata.outputs.android_test_scope }}
          ANDROID_ARTIFACT_MODE: ${{ needs.metadata.outputs.android_artifact_mode }}
          ANDROID_VALIDATION_MODE: ${{ steps.android_mode.outputs.validation_mode }}
          ORG_GRADLE_PROJECT_solarlab_debugStageFirstClient: ${{ steps.android_mode.outputs.debug_stage_first_client }}
          ORG_GRADLE_PROJECT_solarlab_stageFirstRuntimeMirror: ${{ steps.android_mode.outputs.stage_first_runtime_mirror }}

      - name: Emit Android shell batch status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_dir="clients/android/app/build/reports/emulator-smoke/instrumentation-batch"
          status_file="${run_dir}/status.txt"
          if [[ ! -f "${status_file}" ]]; then
            echo "No instrumentation status file captured."
            exit 0
          fi

          echo "::group::AndroidShellBatchStatus"
          cat "${status_file}"

          exit_code="$(awk -F= '/^exit_code=/{print $2}' "${status_file}")"
          if [[ "${exit_code}" != "0" ]]; then
            if [[ -f "${run_dir}/gradle-output.txt" ]]; then
              echo
              echo "Recent gradle output:"
              tail -n 120 "${run_dir}/gradle-output.txt" || true
            fi
            if [[ -f "${run_dir}/live-logcat.txt" ]]; then
              echo
              echo "Recent live logcat:"
              tail -n 160 "${run_dir}/live-logcat.txt" || true
            fi
            if [[ -d "${run_dir}/host-emulator" ]]; then
              echo
              echo "Captured host-emulator logs:"
              find "${run_dir}/host-emulator" -maxdepth 1 -type f | sort || true
            fi
          fi
          echo "::endgroup::"

      - name: Emit Android lane timing summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane_end_epoch="$(date +%s)"
          lane_start_epoch="${{ steps.android_timing.outputs.lane_start_epoch }}"
          lane_total="$((lane_end_epoch - lane_start_epoch))"
          status_file="clients/android/app/build/reports/emulator-smoke/instrumentation-batch/status.txt"
          test_class_count='n/a'
          timeout_seconds='n/a'
          exit_code='n/a'
          if [[ -f "${status_file}" ]]; then
            test_class_count="$(awk -F= '/^test_class_count=/{print $2}' "${status_file}")"
            timeout_seconds="$(awk -F= '/^timeout_seconds=/{print $2}' "${status_file}")"
            exit_code="$(awk -F= '/^exit_code=/{print $2}' "${status_file}")"
          fi
          {
            echo "## android-shell timings"
            echo "- validation mode: \`${{ steps.android_mode.outputs.validation_mode }}\`"
            echo "- stage-first client: \`${{ steps.android_mode.outputs.debug_stage_first_client }}\`"
            echo "- stage-first runtime mirror: \`${{ steps.android_mode.outputs.stage_first_runtime_mirror }}\`"
            echo "- sdk setup: \`${{ steps.android_sdk_install.outputs.sdk_setup_seconds || 'n/a' }}s\`"
            echo "- rust/android toolchain: \`${{ steps.rust_android_toolchain.outputs.rust_android_toolchain_seconds || 'n/a' }}s\`"
            echo "- assemble debug + androidTest: \`${{ steps.android_assemble.outputs.assemble_seconds || 'n/a' }}s\`"
            echo "- lane total (including emulator + instrumentation): \`${lane_total}s\`"
            echo "- remote gradle cache push: \`${{ env.GRADLE_REMOTE_CACHE_PUSH }}\`"
            echo "- scope: \`${{ needs.metadata.outputs.android_test_scope }}\`"
            echo "- artifact mode: \`${{ needs.metadata.outputs.android_artifact_mode }}\`"
            echo "- emulator boot strategy: \`${{ needs.metadata.outputs.emulator_boot_strategy }}\`"
            echo "- test class count: \`${test_class_count}\`"
            echo "- instrumentation timeout: \`${timeout_seconds}s\`"
            echo "- instrumentation exit code: \`${exit_code}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emit Android shell sccache stats
        if: always() && steps.android_shell_sccache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sccache
          bash .github/scripts/capture_sccache_stats.sh dist/sccache/android-shell-${{ matrix.validation_mode }}.txt
          {
            echo "## android-shell sccache"
            cat dist/sccache/android-shell-${{ matrix.validation_mode }}.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android shell artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-shell-${{ matrix.validation_mode }}-${{ needs.metadata.outputs.android_test_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            clients/android/app/build/reports/androidTests/**
            clients/android/app/build/reports/emulator-smoke/**
            clients/android/app/build/outputs/androidTest-results/**
            clients/android/app/build/outputs/apk/debug/**
            clients/android/app/build/outputs/apk/androidTest/**
            dist/sccache/**

  summary:
    name: Publish validation summary
    needs:
      - metadata
      - parity-matrix
      - wrapper-bootstrap
      - rust-workspace
      - rust-workspace-arm64
      - ffi-abi
      - android-unit
      - android-lint
      - android-shell
      - runtime-scene-telemetry
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: ${{ needs.metadata.outputs.checkout_repository }}
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Download Android shell artifacts for summary enrichment
        if: ${{ needs.android-shell.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: android-shell-*-${{ github.run_id }}*
          path: dist/android-shell-artifacts

      - name: Build validation summary payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/validation-summary
          python3 .github/scripts/write_validation_summary.py \
            --workflow validation-lab \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --checkout-ref "${{ needs.metadata.outputs.checkout_ref }}" \
            --profile "${{ needs.metadata.outputs.profile }}" \
            --profile-intent "${{ needs.metadata.outputs.profile_intent }}" \
            --profile-notes "${{ needs.metadata.outputs.profile_notes }}" \
            --lane-set "${{ needs.metadata.outputs.lane_set }}" \
            --lane-summary "${{ needs.metadata.outputs.lane_summary }}" \
            --android-test-scope "${{ needs.metadata.outputs.android_test_scope }}" \
            --android-validation-mode "${{ needs.metadata.outputs.android_validation_mode }}" \
            --android-artifact-mode "${{ needs.metadata.outputs.android_artifact_mode }}" \
            --emulator-boot-strategy "${{ needs.metadata.outputs.emulator_boot_strategy }}" \
            --android-shell-artifacts-dir dist/android-shell-artifacts \
            --job parity-matrix=${{ needs.parity-matrix.result }} \
            --job wrapper-bootstrap=${{ needs.wrapper-bootstrap.result || 'skipped' }} \
            --job rust-workspace=${{ needs.rust-workspace.result || 'skipped' }} \
            --job rust-workspace-arm64=${{ needs.rust-workspace-arm64.result || 'skipped' }} \
            --job ffi-abi=${{ needs.ffi-abi.result || 'skipped' }} \
            --job android-unit=${{ needs.android-unit.result || 'skipped' }} \
            --job android-lint=${{ needs.android-lint.result || 'skipped' }} \
            --job android-shell=${{ needs.android-shell.result || 'skipped' }} \
            --job runtime-scene-telemetry=${{ needs.runtime-scene-telemetry.result || 'skipped' }} \
            --output-json dist/validation-summary/validation-summary.json \
            --output-md dist/validation-summary/validation-summary.md

      - name: Emit validation summary
        shell: bash
        run: cat dist/validation-summary/validation-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: validation-summary
          if-no-files-found: error
          path: dist/validation-summary/**
