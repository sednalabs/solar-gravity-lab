name: validation-lab
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Diagnostic profile
        required: true
        default: targeted
        type: string
      lane_set:
        description: Diagnostic lane
        required: true
        default: rust-workspace
        type: string
permissions:
  contents: read
jobs:
  playback-characterization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Collect playback characterization
        run: cargo run --release -p solarlab-conformance --example playback_fidelity > playback-fidelity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playback-fidelity-${{ github.sha }}
          path: playback-fidelity.json
          if-no-files-found: error
