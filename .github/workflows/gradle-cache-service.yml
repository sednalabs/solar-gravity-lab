name: Gradle cache service

on:
  push:
    branches: [main]
    paths:
      - 'infra/gradle-cache-service/**'
      - '.github/workflows/gradle-cache-service.yml'
  pull_request:
    paths:
      - 'infra/gradle-cache-service/**'
      - '.github/workflows/gradle-cache-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Test cache service
        run: cargo test --locked --manifest-path infra/gradle-cache-service/Cargo.toml
