name: Android dependency diagnostic (temporary)

on:
  push:
    branches:
      - fix/android-security-diagnosis-20261029

permissions:
  contents: read

jobs:
  dependency-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 2c00946e5eca84e87b53b55cbf5b07e103a77990
      - name: Verify diagnostic source
        shell: bash
        run: test "$(git rev-parse HEAD)" = 2c00946e5eca84e87b53b55cbf5b07e103a77990
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/prepare-android-sdk
        with:
          sdk-root: /usr/local/lib/android/sdk
      - name: Ensure SDK 36 platform and build tools
        shell: bash
        run: |
          bash .github/scripts/ensure_android_sdk_packages.sh \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Capture dependency paths and selection reasons
        id: capture
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/isolated-gradle-home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          cat > "$RUNNER_TEMP/dependency-diagnostic.init.gradle" <<'GROOVY'
          import org.gradle.api.artifacts.result.ResolvedDependencyResult
          import org.gradle.api.artifacts.result.UnresolvedDependencyResult
          import org.gradle.api.artifacts.component.ModuleComponentIdentifier

          def safe = { value -> value.toString().replaceAll('[^A-Za-z0-9_.:+,()=/> -]', '?').take(350) }
          def targets = [
            'org.jetbrains.kotlin:kotlin-gradle-plugin',
            'org.bouncycastle:bcprov-jdk18on',
            'org.bouncycastle:bcpkix-jdk18on',
            'org.bouncycastle:bcutil-jdk18on',
            'com.android.tools:r8',
            'com.google.guava:guava',
            'io.netty:netty-handler',
            'io.netty:netty-codec',
            'io.netty:netty-codec-http',
            'io.netty:netty-codec-http2',
            'io.netty:netty-buffer',
            'io.netty:netty-codec-socks',
            'io.netty:netty-common',
            'io.netty:netty-handler-proxy',
            'io.netty:netty-resolver',
            'io.netty:netty-transport',
            'io.netty:netty-transport-native-unix-common'
          ] as Set

          gradle.projectsEvaluated {
            def root = gradle.rootProject
            root.tasks.register('dependencySnapshot') {
              doLast {
                def emit = { message -> println('DEPSNAPSHOT ' + message) }
                try {
                  def app = root.findProject(':app')
                  def plugin = app?.plugins?.findPlugin('com.android.application')
                  if (plugin == null) {
                    emit('R8_AGP_PLUGIN_LOADER UNKNOWN missing-app-plugin')
                  } else {
                    def versionClass = plugin.class.classLoader.loadClass('com.android.tools.r8.Version')
                    def version = versionClass.getMethod('getVersionString').invoke(null)
                    emit("R8_AGP_PLUGIN_LOADER ${safe(version)}")
                  }
                } catch (Throwable ignored) {
                  emit('R8_AGP_PLUGIN_LOADER UNKNOWN class-or-version-unavailable')
                }
                root.allprojects.each { project ->
                  def inspect = { label, configuration ->
                    if (!configuration.canBeResolved) {
                      emit("CONFIG ${safe(label)} UNRESOLVABLE")
                      return
                    }
                    emit("CONFIG ${safe(label)} BEGIN")
                    try {
                      def result = configuration.incoming.resolutionResult
                      int visited = 0
                      int matches = 0
                      int unresolved = 0
                      boolean truncated = false
                      // Breadth-first search inspects each selected component once.
                      // Every target edge from an inspected component is reported,
                      // with one shortest representative path, not every root path.
                      def queue = new ArrayDeque()
                      def first = result.root
                      def seen = [first.id] as Set
                      queue.add([component: first, path: [safe(project.path)]])
                      while (!queue.isEmpty() && !truncated) {
                        def current = queue.removeFirst()
                        for (def dependency : current.component.dependencies) {
                          if (visited >= 200000) {
                            truncated = true
                            break
                          }
                          visited++
                          if (dependency instanceof UnresolvedDependencyResult) {
                            unresolved++
                            emit("UNRESOLVED ${safe(label)} FROM ${safe(current.component.id.displayName)} ${safe(dependency.requested)}")
                          } else if (dependency instanceof ResolvedDependencyResult) {
                            def selected = dependency.selected
                            def id = selected.id
                            def nextPath = current.path + [safe(id.displayName)]
                            if (id instanceof ModuleComponentIdentifier && targets.contains("${id.group}:${id.module}".toString())) {
                              matches++
                              def reasons = selected.selectionReason.descriptions.collect { safe(it.description) }.join('; ')
                              emit("MATCH ${safe(label)} ${safe(id.displayName)} REQUESTED ${safe(dependency.requested)} FROM ${safe(current.component.id.displayName)} REASONS ${reasons} REPRESENTATIVE_PATH ${nextPath.join(' > ')}")
                            }
                            if (seen.add(id)) {
                              queue.add([component: selected, path: nextPath])
                            }
                          }
                        }
                      }
                      emit("CONFIG ${safe(label)} END matches=${matches} unresolved=${unresolved} truncated=${truncated}")
                    } catch (Exception ignored) {
                      emit("CONFIG ${safe(label)} FAILED resolution-error")
                    }
                  }
                  project.buildscript.configurations.each { config ->
                    if (config.canBeResolved) inspect("${project.path}:buildscript:${config.name}", config)
                  }
                  def names = project.configurations.collect { it.name } as Set
                  emit("INVENTORY ${safe(project.path)} ${names.collect { safe(it) }.sort().join(',')}")
                  if (project.path == ':app') {
                    ['debugCompileClasspath', 'debugRuntimeClasspath', 'releaseCompileClasspath',
                     'releaseRuntimeClasspath', 'prereleaseCompileClasspath', 'prereleaseRuntimeClasspath',
                     'debugAndroidTestCompileClasspath', 'debugAndroidTestRuntimeClasspath'].each { expected ->
                      if (!names.contains(expected)) emit("CONFIG ${safe(project.path)}:${safe(expected)} MISSING")
                    }
                  }
                  project.configurations.each { config ->
                    if (config.canBeResolved) {
                      inspect("${project.path}:${config.name}", config)
                    }
                  }
                }
                emit('SCOPE all resolvable project and buildscript configurations; non-resolvable declaration buckets inventoried only')
                emit('PATH_COVERAGE one shortest representative path per inspected incoming edge; not all root paths')
                emit('APK_MEMBERSHIP UNKNOWN: no exact-candidate APK inspected')
              }
            }
          }
          GROOVY
          set +e
          ./gradlew -p clients/android --init-script "$RUNNER_TEMP/dependency-diagnostic.init.gradle" \
            --no-daemon --no-build-cache --no-configuration-cache --console=plain \
            :dependencySnapshot > "$RUNNER_TEMP/dependency-diagnostic.log" 2>&1
          status=$?
          set -e
          grep '^DEPSNAPSHOT ' "$RUNNER_TEMP/dependency-diagnostic.log" > diagnostic-output/dependency-snapshot.txt || true
          report_empty=false
          if [[ ! -s diagnostic-output/dependency-snapshot.txt ]]; then
            report_empty=true
          fi
          printf 'DEPSNAPSHOT WORKFLOW_SHA %s\n' "$GITHUB_SHA" >> diagnostic-output/dependency-snapshot.txt
          printf 'DEPSNAPSHOT SOURCE_SHA %s\n' "$(git rev-parse HEAD)" >> diagnostic-output/dependency-snapshot.txt
          printf 'DEPSNAPSHOT GRADLE_EXIT %s\n' "$status" >> diagnostic-output/dependency-snapshot.txt
          printf 'DEPSNAPSHOT QUALIFICATION unassessed/incomplete pending owner review\n' >> diagnostic-output/dependency-snapshot.txt
          {
            echo '## Dependency diagnostic'
            echo 'Qualification: unassessed/incomplete pending owner review.'
            echo 'A successful job means only that the collector finished. FAILED, MISSING, UNRESOLVED, and truncated markers require owner assessment and cannot establish absence or coverage.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -ne 0 || "$report_empty" == true ]]; then
            echo 'Dependency collector failed; report is incomplete.'
            exit 1
          fi
      - name: Retain dependency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-dependency-diagnostic
          path: diagnostic-output/dependency-snapshot.txt
          if-no-files-found: warn
          retention-days: 7
