name: dependency-submission-gradle

on:
  push:
    branches:
      - main
    paths:
      - "clients/android/**/*.gradle"
      - "clients/android/**/*.gradle.kts"
      - "clients/android/**/gradle.properties"
      - "clients/android/gradle/**"
      - "clients/android/gradlew"
      - "clients/android/gradlew.bat"
      - ".github/workflows/dependency-submission-gradle.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-gradle-dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          additional-arguments: "--project-dir clients/android"
          cache-provider: basic
          dependency-graph: generate-and-submit
