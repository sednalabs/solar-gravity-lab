name: docs-sanity

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-sanity.yml"
      - ".github/scripts/check_markdown_links.py"
      - ".github/scripts/check_public_doc_safety.py"
      - ".github/scripts/test_interactive_android_provider_wiring.py"
      - ".github/scripts/intake_qualified_prerelease.py"
      - ".github/scripts/test_intake_qualified_prerelease.py"
      - ".github/scripts/test_interactive_png.py"
      - ".github/scripts/validate_interactive_png.py"
      - ".github/scripts/test_interactive_session_summary.py"
      - ".github/scripts/write_interactive_session_summary.py"
  push:
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/docs-sanity.yml"
      - ".github/scripts/check_markdown_links.py"
      - ".github/scripts/check_public_doc_safety.py"
      - ".github/scripts/test_interactive_android_provider_wiring.py"
      - ".github/scripts/intake_qualified_prerelease.py"
      - ".github/scripts/test_intake_qualified_prerelease.py"
      - ".github/scripts/test_interactive_png.py"
      - ".github/scripts/validate_interactive_png.py"
      - ".github/scripts/test_interactive_session_summary.py"
      - ".github/scripts/write_interactive_session_summary.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-links:
    name: Markdown link sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Check relative markdown links
        shell: bash
        run: python3 .github/scripts/check_markdown_links.py

      - name: Check public documentation safety
        shell: bash
        run: python3 .github/scripts/check_public_doc_safety.py

      - name: Test interactive session summary rendering
        shell: bash
        run: python3 .github/scripts/test_interactive_session_summary.py

      - name: Install PNG decoder
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Test qualified prerelease intake
        run: python3 .github/scripts/test_intake_qualified_prerelease.py

      - name: Test native Android image decoding
        run: python3 .github/scripts/test_interactive_png.py

      - name: Test interactive Android provider wiring
        shell: bash
        run: python3 .github/scripts/test_interactive_android_provider_wiring.py

      - name: Emit summary
        shell: bash
        run: |
          {
            echo "## docs-sanity"
            echo
            echo "- checked: \`README.md\` and \`docs/**/*.md\`"
            echo "- validation: relative markdown links"
            echo "- validation: publication-safety guard for obvious local-only leaks"
            echo "- validation: interactive session summary rendering"
            echo "- validation: canonical public Android provider wiring"
            echo "- scope: documentation-only workflow intended to stay cheap"
          } >> "$GITHUB_STEP_SUMMARY"
