name: codeql-query-tests

on:
  pull_request:
    paths:
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/codeql-query-tests.yml"
      - ".github/scripts/inventory_claim_surfaces.py"
      - ".github/scripts/test_inventory_claim_surfaces.py"
      - ".github/scripts/test_codeql_static_workflow.py"
  push:
    branches: ["main"]
    paths:
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/codeql-query-tests.yml"
      - ".github/scripts/inventory_claim_surfaces.py"
      - ".github/scripts/test_inventory_claim_surfaces.py"
      - ".github/scripts/test_codeql_static_workflow.py"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-custom-packs:
    name: Validate custom CodeQL packs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up CodeQL CLI
        id: setup_codeql
        uses: github/codeql-action/setup-codeql@v4

      - name: Install custom pack dependencies
        shell: bash
        env:
          CODEQL: ${{ steps.setup_codeql.outputs.codeql-path }}
        run: |
          set -euo pipefail
          "${CODEQL}" pack install .github/codeql/packs/solar-actions-security
          "${CODEQL}" pack install .github/codeql/packs/solar-actions-claim-enforcement
          "${CODEQL}" pack install .github/codeql/packs/solar-actions-product-invariants
          "${CODEQL}" pack install .github/codeql/packs/solar-cpp-claim-enforcement
          "${CODEQL}" pack install .github/codeql/packs/solar-java-kotlin-claim-enforcement
          "${CODEQL}" pack install .github/codeql/packs/solar-python-security
          "${CODEQL}" pack install .github/codeql/packs/solar-python-claim-enforcement
          "${CODEQL}" pack install .github/codeql/packs/solar-python-product-invariants
          "${CODEQL}" pack install .github/codeql/packs/solar-rust-claim-enforcement

      - name: Resolve custom query suites
        shell: bash
        env:
          CODEQL: ${{ steps.setup_codeql.outputs.codeql-path }}
        run: |
          set -euo pipefail
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-actions-security/suites/solar-actions-security.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-actions-claim-enforcement/suites/solar-actions-claim-enforcement.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-actions-product-invariants/suites/solar-actions-product-invariants.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-cpp-claim-enforcement/suites/solar-cpp-claim-enforcement.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-java-kotlin-claim-enforcement/suites/solar-java-kotlin-claim-enforcement.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-python-security/suites/solar-python-security.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-python-claim-enforcement/suites/solar-python-claim-enforcement.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-python-product-invariants/suites/solar-python-product-invariants.qls
          "${CODEQL}" resolve queries \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-rust-claim-enforcement/suites/solar-rust-claim-enforcement.qls

      - name: Compile custom queries
        shell: bash
        env:
          CODEQL: ${{ steps.setup_codeql.outputs.codeql-path }}
        run: |
          set -euo pipefail
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-actions-security/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-actions-claim-enforcement/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-actions-product-invariants/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-cpp-claim-enforcement/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-java-kotlin-claim-enforcement/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-python-security/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-python-claim-enforcement/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-python-product-invariants/queries/*.ql
          "${CODEQL}" query compile \
            --search-path .github/codeql/packs \
            .github/codeql/packs/solar-rust-claim-enforcement/queries/*.ql

      - name: Validate static CodeQL workflow
        shell: bash
        run: python3 .github/scripts/test_codeql_static_workflow.py

      - name: Run claim inventory tests
        shell: bash
        run: python3 .github/scripts/test_inventory_claim_surfaces.py

      - name: Generate claim inventory baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 .github/scripts/inventory_claim_surfaces.py \
            --format github-summary,json \
            --output dist/claim-surfaces.json \
            --baseline-output dist/claim-enforcement-baseline.json

      - name: Generate base claim inventory baseline
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base_dir="${RUNNER_TEMP}/claim-enforcement-base"
          git worktree add --detach "${base_dir}" "${{ github.event.pull_request.base.sha }}"
          python3 .github/scripts/inventory_claim_surfaces.py \
            --root "${base_dir}" \
            --format json \
            --output dist/claim-surfaces-base.json \
            --baseline-output dist/claim-enforcement-base-baseline.json

      - name: Check new missing-evidence claim surfaces
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/inventory_claim_surfaces.py \
            --format json \
            --output dist/claim-surfaces-pr-check.json \
            --baseline dist/claim-enforcement-base-baseline.json \
            --fail-on-new \
            --fail-on-new-status missing_evidence \
            --fail-on-new-surface actions \
            --fail-on-new-surface c-cpp \
            --fail-on-new-surface java-kotlin \
            --fail-on-new-surface python \
            --fail-on-new-surface rust

      - name: Upload claim inventory baseline
        uses: actions/upload-artifact@v7
        with:
          name: claim-enforcement-baseline
          path: |
            dist/claim-surfaces*.json
            dist/claim-enforcement*.json
          if-no-files-found: error

      - name: Emit summary
        shell: bash
        run: |
          {
            echo "## codeql-query-tests"
            echo
            echo "- resolved custom Actions and Python security query suites"
            echo "- resolved custom Actions, C/C++, Java/Kotlin, Python, and Rust claim-enforcement query suites"
            echo "- resolved custom Actions and Python product-invariant query suites"
            echo "- compiled custom CodeQL queries"
            echo "- validated static CodeQL workflow matrix"
            echo "- ran claim inventory tests, uploaded advisory baseline artifacts, and blocked PRs only on new missing-evidence claim surfaces"
          } >> "$GITHUB_STEP_SUMMARY"
