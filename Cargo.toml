[workspace]
members = [
    "labs/conformance",
    "engine/data",
    "engine/domain",
    "engine/physics",
    "engine/history",
    "engine/scene",
    "engine/hardware",
    "engine/runtime",
    "engine/ffi",
    "render/vulkan-adapter",
    "services/dev-telemetry-collector",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"
authors = ["Sedna Labs"]
repository = "https://github.com/sednalabs/solar-gravity-lab"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Android ships the Rust runtime as one FFI library. Thin LTO preserves useful
# cross-crate optimization without making hosted release builds pay the much
# larger full-LTO cost; one codegen unit gives LLVM a complete release view.
[profile.release]
lto = "thin"
codegen-units = 1
