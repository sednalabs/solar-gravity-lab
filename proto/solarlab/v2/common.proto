syntax = "proto3";

package solarlab.v2;

message SemVer {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string prerelease = 4;
  string build_metadata = 5;
}

message Digest {
  string algorithm = 1;
  bytes value = 2;
}

message Signature {
  string key_id = 1;
  string algorithm = 2;
  bytes signature = 3;
  Digest signed_payload_digest = 4;
}

message ProvenanceRef {
  string source = 1;
  string version = 2;
  string manifest_digest = 3;
  string manifest_id = 4;
  Digest package_digest = 5;
}

message Vector3d {
  double x = 1;
  double y = 2;
  double z = 3;
}

enum ObserverMode {
  OBSERVER_MODE_UNSPECIFIED = 0;
  OBSERVER_MODE_FREE = 1;
  OBSERVER_MODE_FOLLOW_SELECTED = 2;
  OBSERVER_MODE_FOLLOW_HOST = 3;
  OBSERVER_MODE_SYSTEM_FRAME = 4;
}

enum TimelineSemantics {
  TIMELINE_SEMANTICS_UNSPECIFIED = 0;
  TIMELINE_SEMANTICS_ABSOLUTE_EPOCH = 1;
  TIMELINE_SEMANTICS_BRANCHED_SANDBOX = 2;
}
